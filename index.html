<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Oficina · Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens: claro ---------- */
  :root {
    color-scheme: light;
    --pasto-1: #3f7f2e; --pasto-2: #4a8c35; --pasto-3: #326b26; --pasto-4: #38752a;
    --cal: #f7f9f4; --amarilla: #f2c230;
    --bg: #f0f1f3; --panel: #ffffff; --panel-2: #f6f7f8; --text: #141414; --text-2: #6c7076;
    --border: #e7e8eb; --grid: #eceef0; --sel: #e7f6ee;
    --acento: #00985f; --hit: #00985f; --miss: #cfd3d8; --live: #e5484d;
    --top: #1a1a1a; --sombra: 0 1px 2px rgba(0,0,0,.05), 0 1px 8px rgba(0,0,0,.04);
    --display: "Inter", system-ui, sans-serif;
    --ui: "Inter", system-ui, sans-serif;
  }
  /* ---------- oscuro ---------- */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --pasto-1: #23511d; --pasto-2: #2a5d22; --pasto-3: #1c4518; --pasto-4: #214e1c;
      --bg: #0f0f0f; --panel: #1d1d1d; --panel-2: #262626; --text: #f2f2f2; --text-2: #9b9b9b;
      --border: #2d2d2d; --grid: #2a2a2a; --sel: #173328;
      --acento: #14a86e; --hit: #2fbf7f; --miss: #3d3d3d; --live: #ff6b6b;
      --top: #1d1d1d; --sombra: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --pasto-1: #23511d; --pasto-2: #2a5d22; --pasto-3: #1c4518; --pasto-4: #214e1c;
    --bg: #0f0f0f; --panel: #1d1d1d; --panel-2: #262626; --text: #f2f2f2; --text-2: #9b9b9b;
    --border: #2d2d2d; --grid: #2a2a2a; --sel: #173328;
    --acento: #14a86e; --hit: #2fbf7f; --miss: #3d3d3d; --live: #ff6b6b;
    --top: #1d1d1d; --sombra: none;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--ui);
         display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: 6px; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- barra superior ---------- */
  .topbar { flex: none; background: var(--top); color: #fff; border-bottom: 1px solid rgba(255,255,255,.06); }
  .topbar .in { max-width: 1440px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; white-space: nowrap; }
  .logo .ico { width: 32px; height: 32px; border-radius: 50%; background: var(--acento); display: grid; place-items: center; flex: none; }
  .logo .tag { font-size: 11px; font-weight: 700; letter-spacing: .02em; background: rgba(255,255,255,.12); padding: 2px 8px; border-radius: 999px; }
  .buscador { flex: 1; max-width: 440px; position: relative; margin-left: 12px; }
  .buscador svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); opacity: .6; pointer-events: none; }
  .buscador input { width: 100%; background: rgba(255,255,255,.1); border: 0; border-radius: 999px; padding: 9px 14px 9px 38px; color: #fff; }
  .buscador input::placeholder { color: rgba(255,255,255,.55); }
  .buscador input:focus { background: rgba(255,255,255,.16); outline: none; }
  .musica { margin-left: auto; background: rgba(255,255,255,.1); color: #fff; border: 0; border-radius: 999px;
            padding: 8px 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .musica:hover { background: rgba(255,255,255,.16); }
  .musica[aria-pressed="true"] { background: var(--acento); }

  /* ---------- destacados ---------- */
  .franja { flex: none; max-width: 1440px; width: 100%; margin: 0 auto; padding: 12px 16px 0; }
  .destacados { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
  .destacados::-webkit-scrollbar { display: none; }
  .destacados:empty { display: none; }
  .rapido { flex: none; width: 220px; display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer;
            background: var(--panel); border: 2px solid transparent; border-radius: 14px; padding: 10px 12px; box-shadow: var(--sombra); }
  .rapido:hover { border-color: var(--border); }
  .rapido.activo { border-color: var(--acento); }
  .r-cab { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--text-2); }
  .r-liga { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-cuando { white-space: nowrap; font-weight: 600; }
  .r-vivo { color: var(--live); font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .r-vivo i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
  .r-eq { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .r-eq .nom { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-eq b { font-weight: 800; font-variant-numeric: tabular-nums; }

  /* escudos */
  .esc { width: 20px; height: 20px; object-fit: contain; flex: none; }
  .esc-liga { width: 20px; height: 20px; object-fit: contain; flex: none; }
  .esc-grande { width: 60px; height: 60px; object-fit: contain; }
  .esc-ph { display: inline-block; border-radius: 50%; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--border); }

  /* ---------- cuerpo ---------- */
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 390px 1fr; gap: 16px;
            max-width: 1440px; width: 100%; margin: 0 auto; padding: 12px 16px 16px; }
  aside { overflow-y: auto; padding-right: 2px; scrollbar-width: thin; }
  .card { background: var(--panel); border-radius: 16px; box-shadow: var(--sombra); }
  .panel-carga { padding: 14px; display: grid; gap: 10px; margin-bottom: 4px; }
  .panel-carga .fechas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .panel-carga label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .panel-carga input, .panel-carga select { width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--border);
            border-radius: 10px; background: var(--panel-2); color: var(--text); font-weight: 500; }
  .fila-cargar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #cargar { background: var(--acento); color: #fff; border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 700; cursor: pointer; }
  #cargar:disabled { opacity: .6; cursor: default; }
  #estado { font-size: 12px; color: var(--text-2); }

  .dia { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 14px 4px 8px; font-weight: 700; font-size: 15px; }
  .dia span { color: var(--text-2); font-weight: 500; font-size: 13px; margin-left: 4px; }
  .liga-card { background: var(--panel); border-radius: 14px; overflow: hidden; margin-bottom: 10px; box-shadow: var(--sombra); }
  .liga-cab { display: flex; align-items: center; gap: 10px; padding: 11px 14px; font-weight: 700; font-size: 13px;
              border-bottom: 1px solid var(--border); }
  .liga-cab .n { margin-left: auto; color: var(--text-2); font-weight: 500; font-size: 12px; }
  .partido { display: grid; grid-template-columns: 1fr 70px 1fr; align-items: center; gap: 8px; width: 100%;
             border: 0; background: none; padding: 11px 12px; cursor: pointer; text-align: left; }
  .partido + .partido { border-top: 1px solid var(--border); }
  .partido:hover { background: var(--panel-2); }
  .partido.activo { background: var(--sel); box-shadow: inset 3px 0 0 var(--acento); }
  .partido .eq { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; font-weight: 500; }
  .partido .loc { justify-content: flex-end; text-align: right; }
  .partido .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .partido .centro { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
  .partido .marcador { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .partido .hora { font-weight: 600; font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .partido .st { font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .partido.envivo .marcador { color: var(--live); }
  .partido.envivo .st { color: var(--live); font-weight: 700; }
  .vivo { color: var(--live); font-weight: 700; }

  main { overflow-y: auto; padding: 20px 24px 40px; background: var(--panel); border-radius: 16px; box-shadow: var(--sombra); }
  .vacio { color: var(--text-2); padding: 48px 0; max-width: 46ch; }
  .meta { font-size: 13px; color: var(--text-2); }

  /* encabezado del partido */
  .encabezado { padding: 4px 0 18px; }
  .enc-meta { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--text-2); flex-wrap: wrap; }
  .enc-duelo { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin-top: 16px; }
  .enc-eq { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-weight: 700; font-size: 16px; min-width: 0; }
  .enc-centro { text-align: center; min-width: 110px; }
  .enc-res { font-weight: 800; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .enc-hora { font-weight: 800; font-size: 28px; line-height: 1; }
  .enc-st { margin-top: 6px; font-size: 13px; color: var(--text-2); }
  .enc-st.vivo { color: var(--live); }

  .tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--border); margin-bottom: 18px; justify-content: center; }
  .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 2px 10px; cursor: pointer;
                 color: var(--text-2); margin-bottom: -1px; font-weight: 600; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--acento); }

  .filtros { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; margin-bottom: 20px; }
  .filtros label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .filtros select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); color: var(--text); font-weight: 500; }
  .filtros label.check { flex-direction: row; align-items: center; gap: 7px; color: var(--text); font-size: 13px; padding-bottom: 7px; }
  .seg { display: inline-flex; background: var(--panel-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 6px 14px; cursor: pointer; border-radius: 999px; font-weight: 600; color: var(--text-2); }
  .seg button.on { background: var(--acento); color: #fff; }

  /* ---------- panel del jugador ---------- */
  .jugador { display: grid; grid-template-columns: minmax(180px, 220px) 1fr; gap: 8px 28px; padding: 18px;
             background: var(--panel-2); border-radius: 14px; margin-bottom: 18px; }
  .jugador h3 { margin: 0; font: 800 22px/1.15 var(--display); letter-spacing: -.01em; }
  .jugador .pos { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .cifra { margin-top: 14px; }
  .cifra .v { font: 800 52px/1 var(--display); letter-spacing: -.03em; color: var(--acento); }
  .cifra .k { font-size: 13px; color: var(--text-2); margin-top: 4px; }
  .cifras-chicas { display: flex; gap: 22px; margin-top: 14px; }
  .cifras-chicas .v { font: 800 22px/1 var(--display); }
  .cifras-chicas .k { font-size: 12px; color: var(--text-2); }
  .nota { font-size: 13px; color: var(--text-2); margin: 0 0 6px; }
  .leyenda { display: flex; gap: 16px; font-size: 12px; color: var(--text-2); margin: 0 0 4px; flex-wrap: wrap; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .leyenda .dash { width: 16px; height: 0; border-top: 2px dashed var(--text); border-radius: 0; vertical-align: 3px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--text-2); font: 12px var(--ui); }
  .chart text.linea { fill: var(--text); font-weight: 700; }
  details summary { cursor: pointer; color: var(--text-2); font-size: 13px; margin-top: 8px; }
  @media (max-width: 760px) { .jugador { grid-template-columns: 1fr; } }

  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border);
         box-shadow: 0 8px 24px rgba(0,0,0,.14); border-radius: 10px; padding: 8px 10px; font-size: 13px; white-space: nowrap; display: none; z-index: 5; }
  .tip b { font: 800 18px var(--display); }

  /* ---------- tablas ---------- */
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  th { font-size: 12px; color: var(--text-2); font-weight: 600; cursor: pointer; user-select: none; vertical-align: bottom; }
  th:hover { color: var(--text); }
  th.ord { color: var(--text); }
  th.ord::after { content: " ↓"; } th.ord.asc::after { content: " ↑"; }
  .izq { text-align: left; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--border); }
  tr.fila { cursor: pointer; }
  tr.fila:hover td { background: var(--panel-2); }
  tr.fila.sel td { background: var(--sel); }
  tr.fila.sel td:first-child { box-shadow: inset 3px 0 0 var(--acento); }
  td.pct { font: 700 15px var(--display); }
  td.pct small { font: 400 12px var(--ui); color: var(--text-2); margin-left: 4px; }
  .hoy { font-size: 11px; color: var(--acento); font-weight: 700; margin-left: 6px; }
  .sup { color: var(--text-2); font-size: 12px; }
  .spark { vertical-align: middle; }
  h4 { font: 700 17px var(--display); margin: 22px 0 8px; }

  /* ---------- alineaciones ---------- */
  .xi { margin-bottom: 22px; }
  .xi h4 { margin-top: 0; }
  .campo, .campo-espera { display: block; width: 100%; height: auto; border-radius: 12px;
    background:
      radial-gradient(ellipse 80% 90% at 50% 40%, rgba(255, 252, 220, .10), transparent 70%),
      repeating-linear-gradient(90deg, var(--pasto-1) 0, var(--pasto-2) 4.75%, var(--pasto-1) 9.5%,
                                var(--pasto-3) 9.5%, var(--pasto-4) 14.25%, var(--pasto-3) 19%); }
  .campo.medio, .campo-espera.medio { background:
      radial-gradient(ellipse 80% 90% at 50% 40%, rgba(255, 252, 220, .10), transparent 70%),
      repeating-linear-gradient(0deg, var(--pasto-1) 0, var(--pasto-2) 5.5%, var(--pasto-1) 11%,
                                var(--pasto-3) 11%, var(--pasto-4) 16.5%, var(--pasto-3) 22%); }
  .campo-espera { aspect-ratio: 1000 / 648; }
  .campo-espera.medio { aspect-ratio: 648 / 820; }
  .campo .tiza * { fill: none; stroke: #f7f9f4; stroke-width: 2.5; opacity: .75; }
  .campo .ficha { cursor: pointer; }
  .campo .ficha:focus-visible { outline: none; }
  .campo .ficha:focus-visible circle:not([fill="none"]) { stroke: var(--amarilla); }
  .campo text { font-family: var(--ui); paint-order: stroke; stroke: rgba(6, 26, 10, .55); stroke-width: 3px; stroke-linejoin: round; }
  .campo text.dorsal { font-weight: 800; stroke: none; }
  .campo text.nombre { fill: #f7f9f4; font-weight: 700; }
  .campo text.pctxi { fill: #f7f9f4; font-weight: 800; }
  .xi-notas { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--text-2); margin-top: 8px; }
  .xi-notas b { color: var(--text); }
  .xi-nota { display: block; }
  .estado-xi { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase;
               padding: 2px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
  .estado-xi.conf { background: var(--acento); color: #fff; }
  .estado-xi.prob { background: var(--amarilla); color: #1a1a1a; }
  .dudas { display: block; color: var(--live); font-weight: 600; margin: 2px 0 4px; }
  .campo .marca circle { stroke: #f7f9f4; stroke-width: 1.5; }
  .campo .marca text { fill: #fff; stroke: none; font-weight: 800; }
  .campo .m-baja circle, .campo .m-susp circle { fill: var(--live); }
  .campo .m-rotar circle, .campo .m-banco circle { fill: #c98a00; }

  /* ---------- avisos del plantel ---------- */
  .avisos { margin-bottom: 22px; }
  .avisos:empty { display: none; }
  .avisos h4 { margin-top: 0; }
  .avisos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .avisos-eq { background: var(--panel-2); border-radius: 12px; padding: 12px 14px; }
  .avisos-eq h5 { margin: 0 0 8px; font-size: 14px; }
  .avisos-eq ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .avisos-eq li { font-size: 13px; line-height: 1.35; }
  .avisos-eq .quien { font-weight: 700; margin-right: 2px; }
  .avisos-eq .por { display: block; color: var(--text-2); font-size: 12px; }
  .avisos-eq p { margin: 0; }
  .aviso { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
  .a-baja, .a-susp { background: color-mix(in srgb, var(--live) 16%, transparent); color: var(--live); }
  .a-rotar, .a-banco { background: color-mix(in srgb, #e0a100 20%, transparent); color: #a86f00; }
  .a-volvio, .a-hoy { background: color-mix(in srgb, var(--acento) 16%, transparent); color: var(--acento); }
  :root[data-theme="dark"] .a-rotar, :root[data-theme="dark"] .a-banco { color: #f2c230; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .a-rotar, :root:not([data-theme="light"]) .a-banco { color: #f2c230; } }
  @media (max-width: 760px) { .avisos-grid { grid-template-columns: 1fr; } }

  /* ---------- talón ---------- */
  .agregar { margin-top: 16px; background: var(--acento); color: #fff; border: 0; border-radius: 999px;
             padding: 9px 16px; font-weight: 700; cursor: pointer; }
  .agregar.ya { background: none; color: var(--acento); box-shadow: inset 0 0 0 1.5px var(--acento); }
  .talon-boton { position: fixed; right: 18px; bottom: 18px; z-index: 20; display: flex; align-items: center; gap: 10px;
                 background: var(--acento); color: #fff; border: 0; border-radius: 999px; padding: 11px 16px 11px 20px;
                 font: 700 15px var(--ui); cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
  .talon-boton .n { background: #fff; color: var(--acento); border-radius: 999px; min-width: 24px; height: 24px;
                    display: grid; place-items: center; font-size: 13px; font-weight: 800; padding: 0 7px; }
  @media (prefers-reduced-motion: no-preference) { .talon-boton.pulso { animation: pulso .45s ease-out; }
    @keyframes pulso { 40% { transform: scale(1.12); } } }
  .talon { position: fixed; right: 18px; bottom: 78px; z-index: 21; width: min(420px, calc(100vw - 36px));
           max-height: calc(100vh - 110px); overflow-y: auto; background: var(--panel); color: var(--text);
           border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 14px 40px rgba(0, 0, 0, .25); }
  .talon[hidden] { display: none; }

  /* ---------- chat IA ---------- */
  .chat-boton { position: fixed; left: 18px; bottom: 18px; z-index: 20; background: var(--top); color: #fff; border: 0;
                border-radius: 999px; padding: 11px 18px; font: 700 15px var(--ui); cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
  .chat { position: fixed; left: 18px; bottom: 78px; z-index: 21; width: min(440px, calc(100vw - 36px));
          height: min(640px, calc(100vh - 110px)); display: flex; flex-direction: column; background: var(--panel); color: var(--text);
          border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 14px 40px rgba(0, 0, 0, .25); overflow: hidden; }
  .chat[hidden] { display: none; }
  .chat header { padding: 14px 16px 10px; display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--border); }
  .chat h2 { margin: 0; font: 800 20px/1 var(--display); }
  .chat header .sup { flex: 1; }
  .chat header button { background: none; border: 0; font-size: 13px; color: var(--text-2); cursor: pointer; text-decoration: underline; }
  .chat .mensajes { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .chat .msg { max-width: 92%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
  .chat .msg.user { align-self: flex-end; background: var(--acento); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .chat .msg.assistant { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px; }
  .chat .msg.assistant p { margin: 0 0 6px; } .chat .msg.assistant p:last-child { margin: 0; }
  .chat .msg.assistant ul, .chat .msg.assistant ol { margin: 4px 0 6px; padding-left: 20px; }
  .chat .msg.error { align-self: stretch; background: none; color: var(--live); font-size: 13px; padding: 0; }
  .chat .msg.pensando { color: var(--text-2); font-style: italic; }
  .chat .intro { color: var(--text-2); font-size: 13px; }
  .chat .sugerencias { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chat .sugerencias button { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 6px 12px;
                              font-size: 13px; cursor: pointer; text-align: left; }
  .chat .sugerencias button:hover { border-color: var(--acento); }
  .chat form { display: flex; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--border); background: var(--panel-2); }
  .chat textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; background: var(--panel);
                   font-size: 14px; max-height: 120px; }
  .chat form button { background: var(--acento); color: #fff; border: 0; border-radius: 12px; padding: 0 16px; font-weight: 700; cursor: pointer; }
  .chat form button:disabled { opacity: .5; cursor: default; }
  .chat .contexto { font-size: 11.5px; color: var(--text-2); padding: 0 16px 8px; }
  .talon header { position: sticky; top: 0; background: var(--panel); padding: 14px 16px 12px; display: flex;
                  align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border); z-index: 1; }
  .talon h2 { margin: 0; font: 800 22px/1 var(--display); }
  .talon header .cerrar { background: none; border: 0; font-size: 13px; color: var(--text-2); cursor: pointer; text-decoration: underline; }
  .seleccion { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); position: relative; }
  .seleccion .quien { font: 700 17px/1.2 var(--display); padding-right: 64px; }
  .seleccion .donde { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .seleccion .linea { margin-top: 8px; font-weight: 600; }
  .seleccion .quitar { position: absolute; top: 14px; right: 14px; background: none; border: 0; color: var(--text-2);
                       font-size: 12px; cursor: pointer; text-decoration: underline; }
  .seleccion .datos { display: flex; gap: 18px; align-items: flex-end; margin-top: 6px; flex-wrap: wrap; }
  .seleccion .datos .v { font: 800 26px/1 var(--display); color: var(--acento); }
  .seleccion .datos .v.chica { font-size: 18px; color: var(--text); }
  .seleccion .datos .k { font-size: 12px; color: var(--text-2); }
  .seleccion svg { display: block; width: 100%; height: auto; margin-top: 10px; }
  .seleccion svg text { fill: var(--text-2); font: 11px var(--ui); }
  .seleccion svg text.val { fill: var(--text); font-weight: 700; }
  .talon .pie { padding: 14px 16px 16px; background: var(--panel-2); }
  .talon .pie .total { display: flex; gap: 22px; align-items: flex-end; }
  .talon .pie .v { font: 800 28px/1 var(--display); }
  .talon .pie .k { font-size: 12px; color: var(--text-2); }
  .talon .pie p { font-size: 12px; color: var(--text-2); margin: 10px 0 12px; }
  .talon .acciones { display: flex; flex-wrap: wrap; gap: 8px; }
  .talon .acciones button, .talon .acciones a { border: 1px solid var(--border); background: var(--panel); color: var(--text);
            border-radius: 999px; padding: 7px 14px; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 13px; }
  .talon .acciones .principal { background: var(--acento); border-color: var(--acento); color: #fff; }
  .talon .vacio { padding: 24px 16px; }
  @media (max-width: 860px) {
    .talon { inset: 0; width: auto; max-height: none; border-radius: 0; border: 0; }
    .talon-boton { right: 14px; bottom: 14px; }
    .chat { inset: 0; width: auto; height: auto; border-radius: 0; border: 0; }
    .chat-boton { left: 14px; bottom: 14px; }
  }

  /* Panel del jugador dentro de la tabla (celular): se abre debajo del jugador tocado */
  tr.panel-fila td { white-space: normal; text-align: left; padding: 0; background: var(--panel); }
  tr.panel-fila .jugador { margin: 6px 0 10px; padding: 14px 12px 16px; }
  .volver { display: none; }

  @media (max-width: 860px) {
    body { height: auto; }
    /* grilla fija: que el texto del botón de música cambie no mueve nada */
    .topbar .in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; }
    .logo { min-width: 0; overflow: hidden; }
    .buscador { grid-column: 1 / -1; grid-row: 2; max-width: none; margin-left: 0; }
    .layout { grid-template-columns: 1fr; padding: 10px 12px 80px; gap: 10px; }
    .franja { padding: 10px 12px 0; }
    aside { overflow: visible; padding-right: 0; }
    .dia { position: static; }
    /* lista y partido en pantallas separadas */
    body.ver-detalle aside { display: none; }
    body:not(.ver-detalle) main { display: none; }
    body.ver-detalle main { min-height: 100vh; }
    .volver { display: inline-block; background: var(--panel-2); border: 0; border-radius: 999px;
              padding: 7px 14px; margin-bottom: 8px; cursor: pointer; font-weight: 600; }
    .esc-grande { width: 48px; height: 48px; }
    .enc-eq { font-size: 14px; }
    .enc-meta > span[aria-hidden] { display: none; }
    .enc-meta > span:last-child { flex-basis: 100%; text-align: center; }
    .enc-res { font-size: 30px; }
    /* la tabla del plantel entra en el ancho del teléfono */
    .col-opc { display: none; }
    table[data-tabla="plantel"] th, table[data-tabla="plantel"] td { padding: 8px 4px; }
    table[data-tabla="plantel"] td:first-child { white-space: normal; min-width: 92px; padding-left: 6px; }
    table[data-tabla="plantel"] td.pct small { display: none; }
    tr.panel-fila td { max-width: calc(100vw - 32px); }
    table[data-tabla="plantel"] th { white-space: normal; }
    main { padding: 16px 14px 32px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="in">
    <div class="logo"><span class="ico" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="8" width="3" height="6.5" rx="1" fill="#fff"/><rect x="6.5" y="4" width="3" height="10.5" rx="1" fill="#fff"/><rect x="11.5" y="1.5" width="3" height="13" rx="1" fill="#fff"/></svg></span>La Oficina <span class="tag">STATS</span></div>
    <label class="buscador"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg><input id="buscar" type="search" placeholder="Buscar equipo o liga" aria-label="Buscar equipo o liga"></label>
    <button id="musicaBtn" class="musica" aria-pressed="false">Poner música</button>
    <audio id="musica" src="cancion.mp3" loop preload="none"></audio>
  </div>
</header>
<div class="franja"><nav class="destacados" id="destacados" aria-label="Partidos destacados"></nav></div>
<div class="layout">
  <aside>
    <div class="card panel-carga">
      <div class="fechas"><label>Desde <input type="date" id="desde"></label><label>Hasta <input type="date" id="hasta"></label></div>
      <label>Ligas <select id="grupo"></select></label>
      <div class="fila-cargar"><button id="cargar">Cargar partidos</button><span id="estado" role="status"></span></div>
      <select id="filtroLiga" aria-label="Filtrar por liga"><option value="">Todas las ligas cargadas</option></select>
    </div>
    <div id="lista"><div class="vacio">Cargando partidos…</div></div>
  </aside>
  <main id="detalle"><div class="vacio">Elegí un partido de la lista para ver la forma de cada jugador.</div></main>
</div>
<div class="tip" id="tip"></div>
<button class="talon-boton" id="abrirTalon" aria-controls="talon" aria-expanded="false">Talón <span class="n" id="talonN">0</span></button>
<div class="talon" id="talon" role="dialog" aria-label="Talón" hidden></div>
<button class="chat-boton" id="abrirChat" aria-controls="chat" aria-expanded="false">Consultar IA</button>
<div class="chat" id="chat" role="dialog" aria-label="Chat IA" hidden>
  <header><h2>Consultar IA</h2><span class="sup">combinadas</span><button data-limpiar>Borrar charla</button><button data-cerrar-chat>Cerrar</button></header>
  <div class="mensajes" id="chatMensajes" aria-live="polite"></div>
  <div class="contexto" id="chatContexto"></div>
  <form id="chatForm"><textarea id="chatTexto" rows="2" placeholder="Ej: armame una combinada de 3 con más de 1.5 remates" aria-label="Tu pregunta"></textarea><button type="submit">Enviar</button></form>
</div>
<script>
// Datos: API pública de ESPN, pedida directamente desde el navegador.
const API = "https://site.api.espn.com/apis/site/v2";
const API_ATLETA = "https://site.web.api.espn.com/apis/common/v3/sports/soccer/athletes";
const PRINCIPALES = [
  "uefa.nations", "concacaf.nations.league", "fifa.friendly", "conmebol.america", "uefa.euroq",
  "uefa.champions", "uefa.europa", "uefa.europa.conf", "conmebol.libertadores", "conmebol.sudamericana",
  "arg.1", "arg.copa", "arg.2", "bra.1", "bra.copa_do_brazil", "chi.1", "col.1", "uru.1", "par.1", "per.1", "ecu.1",
  "eng.1", "eng.2", "eng.fa", "eng.league_cup", "esp.1", "esp.2", "esp.copa_del_rey",
  "ita.1", "ita.2", "ger.1", "ger.2", "fra.1", "fra.2", "por.1", "ned.1", "bel.1", "tur.1", "sco.1",
  "usa.1", "mex.1", "ksa.1",
];
const STATS = {
  totalShots: "tiros", shotsOnTarget: "tiros_al_arco", foulsCommitted: "faltas_cometidas",
  foulsSuffered: "faltas_recibidas", yellowCards: "amarillas", redCards: "rojas", totalGoals: "goles",
  goalAssists: "asistencias", offsides: "offsides", saves: "atajadas",
};
const NOMBRE_STAT = {
  tiros: "Tiros", tiros_al_arco: "Tiros al arco", faltas_cometidas: "Faltas cometidas",
  faltas_recibidas: "Faltas recibidas", goles: "Goles", asistencias: "Asistencias",
  amarillas: "Amarillas", offsides: "Offsides", atajadas: "Atajadas",
};
const COLS_PARTIDO = [
  ["jugador", "Jugador"], ["posicion", "Pos"], ["minutos", "Min"],
  ["tiros", "Tiros"], ["tiros_al_arco", "Al arco"], ["faltas_cometidas", "Faltas com."], ["faltas_recibidas", "Faltas rec."],
  ["goles", "Goles"], ["asistencias", "Asist."], ["amarillas", "Amar."], ["rojas", "Rojas"], ["offsides", "Offs."], ["atajadas", "Ataj."],
];
const DETALLE_ES = { Scheduled: "Programado", FT: "Final", HT: "Entretiempo", AET: "Final con alargue", Postponed: "Postergado",
                     Canceled: "Cancelado", Abandoned: "Suspendido", "FT-Pens": "Final por penales", Delayed: "Demorado" };
const MAX_DIAS = 7, CONCURRENCIA = 4;

const $ = id => document.getElementById(id);
const fmtDia = new Intl.DateTimeFormat("es-AR", { weekday: "long", day: "numeric", month: "long" });
const fmtHora = new Intl.DateTimeFormat("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false });
const fmtCorta = new Intl.DateTimeFormat("es-AR", { day: "numeric", month: "numeric" });
const fmtLarga = new Intl.DateTimeFormat("es-AR", { day: "numeric", month: "short", year: "numeric" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
const isoLocal = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };
const r1 = x => (Math.round(x * 10) / 10).toLocaleString("es-AR");

// ---------- estado ----------
let partidos = [], activo = null;
const resumenes = {}, equipos = {}, atletas = {};
const vista = { tab: null, lado: "home", stat: "tiros", linea: 0.5, n: 10, soloTitular: false, jugador: null,
                ordenPlantel: { col: "pct", asc: false }, ordenPartido: { col: "tiros", asc: false } };

// ---------- red ----------
async function getJSON(url, intentos = 3) {
  for (let i = 1; ; i++) {
    try {
      const r = await fetch(url.startsWith("http") ? url : API + url);
      if (r.ok) return await r.json();
      if (r.status === 400 || r.status === 404) return {};
      throw new Error("HTTP " + r.status);
    } catch (e) {
      if (i >= intentos) throw e;
      await new Promise(res => setTimeout(res, 1000 * 2 ** i));
    }
  }
}

async function enParalelo(tareas, n, alAvanzar) {
  let i = 0, hechas = 0;
  const res = [];
  await Promise.all(Array.from({ length: n }, async () => {
    while (i < tareas.length) {
      const k = i++;
      try { res[k] = await tareas[k](); } catch { res[k] = null; }
      alAvanzar?.(++hechas, tareas.length);
    }
  }));
  return res;
}

// ---------- lista de partidos ----------
async function cargarPartidos() {
  const desde = new Date($("desde").value + "T12:00"), hasta = new Date($("hasta").value + "T12:00");
  const dias = [];
  for (let d = new Date(desde); d <= hasta && dias.length < MAX_DIAS; d.setDate(d.getDate() + 1)) dias.push(new Date(d));
  if (!dias.length) { $("estado").textContent = "La fecha “desde” tiene que ser anterior a “hasta”."; return; }
  const ligas = $("grupo").value === "principales" ? PRINCIPALES : [$("grupo").value];
  $("cargar").disabled = true;
  const tareas = [];
  for (const d of dias) for (const l of ligas)
    tareas.push(() => getJSON(`/sports/soccer/${l}/scoreboard?dates=${isoLocal(d).replaceAll("-", "")}`).then(j => [l, j]));
  const res = await enParalelo(tareas, CONCURRENCIA, (h, t) => $("estado").textContent = `Buscando partidos (${h} de ${t})`);
  const vistos = new Map();
  let errores = 0;
  for (const r of res) {
    if (!r) { errores++; continue; }
    const [liga, j] = r;
    const nombre = j.leagues?.[0]?.name || liga;
    for (const ev of j.events || []) {
      const c = ev.competitions[0], eq = Object.fromEntries(c.competitors.map(x => [x.homeAway, x]));
      const st = c.status.type;
      vistos.set(ev.id, {
        id: ev.id, fecha: ev.date, liga, liga_nombre: nombre,
        local: eq.home.team.displayName, visitante: eq.away.team.displayName,
        homeId: eq.home.team.id, awayId: eq.away.team.id,
        logoL: eq.home.team.logo, logoV: eq.away.team.logo, ligaLogo: j.leagues?.[0]?.logos?.[0]?.href,
        gl: eq.home.score, gv: eq.away.score, estado: st.state, detalle: DETALLE_ES[st.shortDetail] || st.shortDetail,
      });
    }
  }
  partidos = [...vistos.values()].sort((a, b) => a.fecha.localeCompare(b.fecha));
  const sel = $("filtroLiga"), prev = sel.value;
  sel.innerHTML = `<option value="">Todas las ligas cargadas</option>` +
    [...new Map(partidos.map(p => [p.liga, p.liga_nombre]))].sort((a, b) => a[1].localeCompare(b[1]))
      .map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("");
  sel.value = [...sel.options].some(o => o.value === prev) ? prev : "";
  $("estado").textContent = `${partidos.length} partidos` + (errores ? `, ${errores} ligas no respondieron (probá cargar de nuevo)` : "");
  $("cargar").disabled = false;
  pintarLista();
  pintarDestacados();
}

const cap = t => t ? t[0].toUpperCase() + t.slice(1) : t;
const escudo = (url, cls = "esc") => url
  ? `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
  : `<span class="${cls} esc-ph" aria-hidden="true"></span>`;
const sinMarcador = p => /Postergado|Cancelado/.test(p.detalle || "");

function filaPartido(p) {
  const f = new Date(p.fecha), vivo = p.estado === "in", jugado = p.estado !== "pre" && !sinMarcador(p);
  const centro = jugado
    ? `<span class="marcador">${esc(p.gl)} - ${esc(p.gv)}</span><span class="st">${esc(p.detalle)}</span>`
    : sinMarcador(p) ? `<span class="hora">–</span><span class="st">${esc(p.detalle)}</span>`
    : `<span class="hora">${fmtHora.format(f)}</span>`;
  return `<button class="partido${p.id === activo ? " activo" : ""}${vivo ? " envivo" : ""}" data-id="${esc(p.id)}">
    <span class="eq loc"><span class="nom">${esc(p.local)}</span>${escudo(p.logoL)}</span>
    <span class="centro">${centro}</span>
    <span class="eq vis">${escudo(p.logoV)}<span class="nom">${esc(p.visitante)}</span></span></button>`;
}

function pintarLista() {
  const q = norm($("buscar").value).trim(), liga = $("filtroLiga").value;
  const ps = partidos.filter(p => (!liga || p.liga === liga) &&
    (!q || q.split(/\s+/).every(t => norm(`${p.local} ${p.visitante} ${p.liga_nombre}`).includes(t))));
  // por día y, dentro de cada día, por liga (las más importantes primero)
  const dias = new Map();
  for (const p of ps) {
    const k = isoLocal(new Date(p.fecha));
    if (!dias.has(k)) dias.set(k, new Map());
    const ls = dias.get(k);
    if (!ls.has(p.liga)) ls.set(p.liga, []);
    ls.get(p.liga).push(p);
  }
  const hoy = new Date(isoLocal(new Date()) + "T12:00");
  let html = "";
  for (const [k, ligas] of dias) {
    const f = new Date(k + "T12:00"), dif = Math.round((f - hoy) / 864e5);
    const rel = { 0: "Hoy", "-1": "Ayer", 1: "Mañana" }[dif];
    html += `<div class="dia">${rel ? `${rel}<span>${esc(fmtDia.format(f))}</span>` : esc(cap(fmtDia.format(f)))}</div>`;
    const orden = [...ligas.values()].sort((a, b) => (PESO_LIGA[b[0].liga] ?? 2) - (PESO_LIGA[a[0].liga] ?? 2)
      || a[0].liga_nombre.localeCompare(b[0].liga_nombre));
    for (const lps of orden) {
      html += `<section class="liga-card"><div class="liga-cab">${escudo(lps[0].ligaLogo, "esc-liga")}<span>${esc(lps[0].liga_nombre)}</span>
        <span class="n">${lps.length}</span></div>${lps.map(filaPartido).join("")}</section>`;
    }
  }
  $("lista").innerHTML = html || `<div class="vacio">${partidos.length ? "Ningún partido coincide con la búsqueda." : "No hay partidos en esas fechas. Probá con otro rango o con todas las ligas principales."}</div>`;
}

// ---------- destacados: acceso rápido a los partidos más convocantes ----------
// ESPN no publica popularidad: se puntúa por liga, por equipos grandes y por cercanía (en juego > hoy > próximos).
const PESO_LIGA = {
  "uefa.champions": 10, "conmebol.libertadores": 9, "conmebol.america": 9, "eng.1": 9, "esp.1": 9, "arg.1": 8,
  "ita.1": 7, "ger.1": 7, "arg.copa": 7, "uefa.nations": 6, "uefa.europa": 6, "conmebol.sudamericana": 6,
  "fra.1": 6, "bra.1": 8, "bra.copa_do_brazil": 6, "uefa.euroq": 6, "fifa.friendly": 5, "por.1": 5, "esp.copa_del_rey": 5, "eng.fa": 5,
  "usa.1": 4, "mex.1": 4, "ned.1": 4,
};
const EQUIPOS_GRANDES = [
  "argentina", "brazil", "france", "england", "spain", "germany", "portugal", "italy", "netherlands", "uruguay", "belgium", "croatia",
  "real madrid", "barcelona", "atletico madrid", "manchester city", "liverpool", "arsenal", "manchester united", "chelsea", "tottenham",
  "bayern munich", "borussia dortmund", "paris saint-germain", "juventus", "internazionale", "ac milan", "napoli",
  "boca juniors", "river plate", "racing club", "independiente", "san lorenzo", "estudiantes", "velez", "flamengo", "palmeiras",
  "inter miami", "benfica", "porto", "sporting",
];
const esGrande = nombre => { const n = norm(nombre); return EQUIPOS_GRANDES.some(e => n === e || n.startsWith(e + " ")); };

// Siempre tienen lugar en destacados (si hay partido en las fechas cargadas), en este orden.
const EQUIPOS_FIJOS = ["boca juniors"];
const LIGAS_FIJAS = [
  ["arg.1", "arg.copa"],                      // Liga Profesional (y Copa Argentina)
  ["eng.1"],                                  // Premier League
  ["bra.1", "bra.copa_do_brazil"],            // fútbol de Brasil
];

function destacados(max = 8) {
  const hoy = isoLocal(new Date());
  const puntaje = p => {
    const dia = isoLocal(new Date(p.fecha));
    let s = PESO_LIGA[p.liga] ?? 2;
    s += (esGrande(p.local) ? 6 : 0) + (esGrande(p.visitante) ? 6 : 0);
    if (p.estado === "in") s += 10;
    else if (p.estado === "pre") s += dia === hoy ? 5 : 1;
    else s += dia === hoy ? 0 : -6;
    return s;
  };
  const ranking = [...partidos].map(p => [puntaje(p), p])
    .sort((a, b) => b[0] - a[0] || a[1].fecha.localeCompare(b[1].fecha)).map(([, p]) => p);
  const elegidos = [];
  const sumar = p => { if (p && !elegidos.includes(p) && elegidos.length < max) elegidos.push(p); };
  // 1) partidos de los equipos fijos; 2) el mejor de cada liga fija; 3) el resto por puntaje.
  for (const eq of EQUIPOS_FIJOS) sumar(ranking.find(p => [p.local, p.visitante].some(n => norm(n).startsWith(eq))));
  for (const ligas of LIGAS_FIJAS) sumar(ranking.find(p => ligas.includes(p.liga) && !elegidos.includes(p)));
  for (const p of ranking) sumar(p);
  return elegidos;
}

// ---------- ficha de un partido (summary) ----------
const minuto = t => { const n = (t || "").match(/\d+/g); return n ? n.reduce((a, b) => a + +b, 0) : null; };

function parsearResumen(id, d) {
  const comp = d.header?.competitions?.[0] || {};
  const cs = comp.competitors || [];
  const home = cs.find(c => c.homeAway === "home") || {}, away = cs.find(c => c.homeAway === "away") || {};
  const fin = (comp.status?.period || 2) > 2 ? 120 : 90;
  const entra = {}, sale = {};
  for (const k of d.keyEvents || []) {
    if (!/substitution/i.test(k.type?.text || "")) continue;
    const p = (k.participants || []).map(x => x.athlete.id);
    let m = minuto(k.clock?.displayValue);
    if (m == null || p.length !== 2) continue;
    m = Math.min(m, fin);
    entra[p[0]] = m; sale[p[1]] = m;
  }
  const meta = {
    id, fecha: comp.date, comp: d.header?.league?.name || "",
    homeId: home.team?.id, awayId: away.team?.id, local: home.team?.displayName, visitante: away.team?.displayName,
    gl: home.score, gv: away.score, terminado: !!comp.status?.type?.completed,
  };
  const filas = [], convocados = {}, formaciones = {}, colores = {};
  for (const c of cs) if (c.team?.id) colores[c.team.id] = [c.team.color, c.team.alternateColor];
  for (const eq of d.rosters || []) {
    const tid = eq.team.id;
    convocados[tid] = [];
    formaciones[tid] = eq.formation || null;
    for (const p of eq.roster || []) {
      const aid = p.athlete.id;
      convocados[tid].push({ id: aid, nombre: p.athlete.displayName, corto: p.athlete.shortName || p.athlete.displayName,
        pos: p.position?.abbreviation, titular: !!p.starter, dorsal: p.jersey, lugar: +p.formationPlace || 99 });
      const st = Object.fromEntries((p.stats || []).map(s => [s.name, s.value]));
      if (!(p.starter || p.subbedIn || st.appearances > 0)) continue;
      const ini = p.starter ? 0 : entra[aid];
      const fj = p.subbedOut ? (sale[aid] ?? fin) : fin;
      const f = {
        teamId: tid, equipo: eq.team.displayName, athleteId: aid, jugador: p.athlete.displayName,
        titular: !!p.starter, posicion: p.position?.abbreviation, minutos: ini == null ? null : Math.max(fj - ini, 1),
      };
      for (const [k, c] of Object.entries(STATS)) f[c] = st[k] ?? null;
      filas.push(f);
    }
  }
  return { meta, filas, convocados, formaciones, colores };
}

function resumen(id, forzar = false) {
  if (!resumenes[id] || forzar) {
    resumenes[id] = getJSON(`/sports/soccer/all/summary?event=${id}`).then(d => {
      const r = parsearResumen(id, d);
      if (!r.meta.terminado) setTimeout(() => delete resumenes[id], 60e3);
      return r;
    }).catch(e => { delete resumenes[id]; throw e; });
  }
  return resumenes[id];
}

// ---------- forma de un equipo ----------
function formaEquipo(teamId, antesDe, n) {
  const clave = `${teamId}|${antesDe}|${n}`;
  return equipos[clave] ??= (async () => {
    const corte = new Date(antesDe).getTime();
    let previos = [];
    const sch = await getJSON(`/sports/soccer/all/teams/${teamId}/schedule`);
    const agregar = s => previos.push(...(s.events || []).filter(e =>
      e.competitions?.[0]?.status?.type?.completed && new Date(e.date).getTime() < corte));
    agregar(sch);
    if (previos.length < n && sch.requestedSeason?.year) {
      agregar(await getJSON(`/sports/soccer/all/teams/${teamId}/schedule?season=${sch.requestedSeason.year - 1}`));
    }
    previos = [...new Map(previos.map(e => [e.id, e])).values()]
      .sort((a, b) => b.date.localeCompare(a.date)).slice(0, n);
    const rs = await enParalelo(previos.map(e => () => resumen(e.id)), CONCURRENCIA);
    const partidosEq = [], jugadores = new Map(), planteles = [];
    for (const r of rs) {
      if (!r) continue;
      const m = r.meta, esLocal = m.homeId === teamId;
      partidosEq.push(m);
      const conv = r.convocados?.[teamId] || [];
      planteles.push({ id: m.id, fecha: m.fecha, comp: m.comp, conocido: conv.length >= 11, conv: new Set(conv.map(c => c.id)) });
      for (const f of r.filas.filter(f => f.teamId === teamId)) {
        let j = jugadores.get(f.athleteId);
        if (!j) jugadores.set(f.athleteId, j = { id: f.athleteId, nombre: f.jugador, pos: f.posicion, partidos: [] });
        if (f.posicion && f.posicion !== "SUB") j.pos = j.pos && j.pos !== "SUB" ? j.pos : f.posicion;
        j.partidos.push({
          eventId: m.id, fecha: m.fecha, comp: m.comp, rival: esLocal ? m.visitante : m.local,
          condicion: esLocal ? "L" : "V", resultado: `${m.gl}-${m.gv}`, minutos: f.minutos, titular: f.titular,
          stats: Object.fromEntries(Object.values(STATS).map(c => [c, f[c]])),
        });
      }
    }
    return { partidos: partidosEq, jugadores, planteles };
  })().catch(e => { delete equipos[clave]; throw e; });
}

// ---------- avisos del plantel (deducidos: ESPN no publica lesionados de fútbol) ----------
// Devuelve Map(jugadorId → [{ tipo, texto }]). Tipos: baja, susp, rotar, volvio, hoy, banco.
const ORDEN_AVISO = { baja: 0, susp: 1, banco: 2, rotar: 3, volvio: 4, hoy: 5 };
const NOMBRE_AVISO = { baja: "Posible baja", susp: "Suspendido", rotar: "Puede rotar", volvio: "Volvió", hoy: "Convocado", banco: "Suplente hoy" };
function avisosEquipo(teamId, forma, actual, fechaPartido, compPartido) {
  const res = new Map();
  const add = (id, tipo, texto) => { if (!res.has(id)) res.set(id, []); res.get(id).push({ tipo, texto }); };
  const pl = forma.planteles || [];
  if (!pl.length) return res;
  const ult5 = pl.slice(0, 5).map(x => x.id);
  const conv = actual?.convocados?.[teamId] || [];
  const confirmada = conv.filter(c => c.titular).length >= 11;
  const convHoy = new Map(conv.map(c => [c.id, c]));
  const dias = (a, b) => (new Date(a) - new Date(b)) / 864e5;
  const diasDesdeUlt = dias(fechaPartido, pl[0].fecha);

  for (const j of forma.jugadores.values()) {
    const porEv = new Map(j.partidos.map(x => [x.eventId, x]));
    const titulares5 = ult5.filter(id => porEv.get(id)?.titular).length;
    const habitual = titulares5 >= 3 || (titulares5 >= 2 && ult5.length <= 3);
    // partidos seguidos (desde el último) en los que no estuvo en la lista, contando solo listas conocidas
    let ausencias = 0;
    for (const x of pl) { if (!x.conocido) break; if (x.conv.has(j.id)) break; ausencias++; }
    const hoy = convHoy.get(j.id);

    if (confirmada) {
      if (hoy?.titular) add(j.id, "hoy", "Titular confirmado");
      else if (hoy) { if (habitual) add(j.id, "banco", "Suele ser titular y hoy arranca en el banco"); }
      else if (habitual) add(j.id, "baja", "Suele ser titular y no está en la lista de hoy");
    } else if (conv.length >= 11 && habitual) {  // ESPN publicó convocados pero todavía no el 11
      if (hoy) { if (ausencias > 0) add(j.id, "hoy", "Venía faltando y está en la lista de convocados de hoy"); }
      else add(j.id, "baja", "Suele ser titular y no está en la lista de convocados de hoy");
    } else if (habitual && ausencias > 0) {
      add(j.id, "baja", ausencias >= 4 ? `No está en la lista hace ${ausencias} partidos (lesión larga, sanción o salida del club)`
        : ausencias === 1 ? "Era titular fijo y no estuvo en la lista del último partido"
        : `Era titular fijo y faltó a los últimos ${ausencias} partidos`);
    } else if (pl[1]?.conocido && pl[0].conocido && pl[0].conv.has(j.id) && !pl[1].conv.has(j.id)) {
      const previos = pl.slice(2, 6).filter(x => porEv.get(x.id)?.titular).length;
      if (previos >= 2) add(j.id, "volvio", porEv.get(pl[0].id) ? "Volvió a jugar el último partido después de faltar" : "Volvió a la lista en el último partido");
    }

    const ult = porEv.get(pl[0].id);
    if (ult?.stats?.rojas > 0) add(j.id, "susp", "Lo expulsaron en el último partido: probablemente cumpla fecha");
    const amarillasComp = j.partidos.filter(x => x.comp === compPartido).slice(0, 6).reduce((a, x) => a + (x.stats.amarillas || 0), 0);
    if (amarillasComp >= 4) add(j.id, "susp", `${amarillasComp} amarillas en sus últimos partidos de ${compPartido}: en riesgo de suspensión (depende del reglamento)`);

    if (!confirmada && ult && diasDesdeUlt <= 3.5 && (ult.minutos ?? 0) >= 80)
      add(j.id, "rotar", `Jugó ${ult.minutos}' hace ${Math.max(1, Math.round(diasDesdeUlt))} días`);
    else if (!confirmada) {
      const min7 = j.partidos.filter(x => dias(fechaPartido, x.fecha) <= 8).reduce((a, x) => a + (x.minutos || 0), 0);
      if (min7 >= 200) add(j.id, "rotar", `Lleva ${min7}' en los últimos 8 días`);
    }
  }
  // convocados hoy que no venían jugando (o vuelven de una baja)
  if (confirmada) for (const c of conv) if (!res.has(c.id) && !forma.jugadores.has(c.id) && c.titular) add(c.id, "hoy", "Titular confirmado");
  for (const l of res.values()) l.sort((a, b) => ORDEN_AVISO[a.tipo] - ORDEN_AVISO[b.tipo]);
  return res;
}
const etiquetaAviso = a => `<span class="aviso a-${a.tipo}" title="${esc(a.texto)}">${NOMBRE_AVISO[a.tipo]}</span>`;

// ---------- partidos de un jugador con cualquier equipo (últimos 5) ----------
function partidosAtleta(id) {
  return atletas[id] ??= getJSON(`${API_ATLETA}/${id}/overview`).then(d => {
    const gl = d.gameLog || {}, s = gl.statistics?.[0];
    if (!s) return [];
    const metaEv = gl.events || {};
    return (s.events || []).map(e => {
      const m = metaEv[e.eventId] || {};
      const v = Object.fromEntries(s.names.map((n, i) => [n, e.stats[i]]));
      const app = String(v.appearances ?? "");
      return {
        eventId: e.eventId, fecha: m.gameDate, comp: m.leagueName || m.leagueAbbreviation || "",
        rival: m.opponent?.displayName || "", condicion: m.atVs === "@" ? "V" : "L", resultado: m.score || "",
        minutos: null, titular: /start/i.test(app), jugo: app !== "0" && app !== "",
        stats: Object.fromEntries(Object.entries(STATS).map(([k, c]) => [c, num(v[k])])),
        otroEquipo: true,
      };
    }).filter(p => p.jugo && p.fecha);
  }).catch(() => []);
}

// ---------- cálculos ----------
function filtrarPartidos(ps) {
  return ps.filter(p => !vista.soloTitular || p.titular)
    .sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, vista.n);
}
function resumenStat(ps) {
  const vals = ps.map(p => p.stats[vista.stat]).filter(v => v != null);
  const sup = vals.filter(v => v > vista.linea).length;
  const conMin = ps.filter(p => p.minutos != null);
  return {
    pj: ps.length, n: vals.length, sup,
    pct: vals.length ? sup / vals.length : null,
    prom: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null,
    min: conMin.length ? conMin.reduce((a, p) => a + p.minutos, 0) / conMin.length : null,
  };
}

// ---------- gráficos ----------
function sparkline(ps) {
  const orden = [...ps].reverse();
  const [w, gap] = esAngosto() ? [4, 1.5] : [7, 2], h = 22, max = Math.max(vista.linea + 0.5, ...orden.map(p => p.stats[vista.stat] ?? 0));
  const W = Math.max(orden.length * (w + gap) - gap, 1);
  const bars = orden.map((p, i) => {
    const v = p.stats[vista.stat] ?? 0, bh = Math.max(v / max * h, 2);
    return `<rect x="${i * (w + gap)}" y="${h - bh}" width="${w}" height="${bh}" rx="1.5" fill="var(${v > vista.linea ? "--hit" : "--miss"})"/>`;
  }).join("");
  const ly = h - (vista.linea / max) * h;
  return `<svg class="spark" width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" aria-hidden="true">${bars}
    <line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="var(--text)" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/></svg>`;
}

function graficoBarras(ps, ancho = 720) {
  const orden = [...ps].reverse();
  const W = Math.max(300, Math.round(ancho)), H = W < 500 ? 210 : 240, m = { t: 12, r: 66, b: 46, l: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = orden.map(p => p.stats[vista.stat] ?? 0);
  const ymax = Math.max(Math.ceil(Math.max(...vals, vista.linea + 0.5)), 1);
  const paso = ymax > 8 ? 2 : 1;
  const y = v => m.t + ih - (v / ymax) * ih;
  const band = iw / Math.max(orden.length, 1), bw = Math.min(24, band * 0.55);
  let g = "";
  for (let v = 0; v <= ymax; v += paso)
    g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
          <text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  orden.forEach((p, i) => {
    const v = vals[i], x = m.l + i * band + (band - bw) / 2, top = y(v), base = y(0);
    if (v > 0) {
      const r = Math.min(4, (base - top) / 2);
      g += `<path d="M${x},${base} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${base} Z" fill="var(${v > vista.linea ? "--hit" : "--miss"})"/>`;
    } else {
      g += `<rect x="${x}" y="${base - 2}" width="${bw}" height="2" fill="var(--miss)"/>`;
    }
    const cx = m.l + i * band + band / 2;
    const fecha = fmtCorta.format(new Date(p.fecha));
    if (band >= 44) {
      const maxCar = Math.floor(band / 7.5);
      const rival = p.rival.length > maxCar ? p.rival.slice(0, maxCar - 1).trimEnd() + "…" : p.rival;
      g += `<text x="${cx}" y="${H - m.b + 17}" text-anchor="middle">${esc(rival)}</text>
            <text x="${cx}" y="${H - m.b + 32}" text-anchor="middle">${fecha}</text>`;
    } else if (band >= 34 || (orden.length - 1 - i) % 2 === 0) {
      g += `<text x="${cx}" y="${H - m.b + 17}" text-anchor="middle">${fecha}</text>`;
    }
    g += `<rect class="hit" data-i="${i}" x="${m.l + i * band}" y="${m.t}" width="${band}" height="${ih}" fill="transparent"/>`;
  });
  const ly = y(vista.linea);
  g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${ly}" y2="${ly}" stroke="var(--text)" stroke-width="2" stroke-dasharray="6 4"/>
        <text class="linea" x="${m.l + iw + 8}" y="${ly + 4}">Línea ${r1(vista.linea)}</text>`;
  return { svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(NOMBRE_STAT[vista.stat])} por partido">${g}</svg>`, orden };
}

async function pintarDetalle() {
  const p = partidos.find(x => x.id === activo), det = $("detalle");
  if (!p) { det.innerHTML = `<div class="vacio">Elegí un partido de la lista para ver la forma de cada jugador.</div>`; return; }

  det.innerHTML = cabecera(p) + `<div id="cuerpo"><div class="vacio">Cargando…</div></div>`;
  try {
    if (vista.tab === "partido") await pintarStatsPartido(p);
    else await pintarPrevia(p);
  } catch (e) {
    if (activo === p.id) $("cuerpo").innerHTML = `<div class="vacio">ESPN no respondió. Revisá tu conexión y volvé a elegir el partido.</div>`;
  }

async function pintarStatsPartido(p) {
  const r = await resumen(p.id, p.estado === "in");
  if (activo !== p.id || vista.tab !== "partido") return;
  if (!r.filas.length) { $("cuerpo").innerHTML = `<div class="vacio">ESPN no publicó estadísticas por jugador para este partido.</div>`; return; }
  const { col, asc } = vista.ordenPartido;
  const tabla = (eq, filas) => {
    filas = [...filas].sort((a, b) => { const x = a[col] ?? -1, y = b[col] ?? -1; const s = typeof x === "string" ? x.localeCompare(y) : x - y; return asc ? s : -s; });
    const sum = COLS_PARTIDO.slice(3).map(([c]) => filas.reduce((s, f) => s + (f[c] || 0), 0));
    return `<h4>${esc(eq)}</h4><div class="tablewrap"><table data-tabla="partido"><thead><tr>${COLS_PARTIDO.map(([c, t], i) =>
      `<th data-col="${c}" class="${i < 2 ? "izq " : ""}${c === col ? "ord" + (asc ? " asc" : "") : ""}">${t}</th>`).join("")}</tr></thead><tbody>
      ${filas.map(f => `<tr>${COLS_PARTIDO.map(([c], i) => i === 0
        ? `<td class="izq">${esc(f.jugador)}${f.titular ? "" : ' <span class="sup">entró</span>'}</td>`
        : i === 1 ? `<td class="izq sup">${esc(f.posicion === "SUB" ? "" : f.posicion)}</td>` : `<td>${f[c] ?? "–"}</td>`).join("")}</tr>`).join("")}
      <tr class="total"><td class="izq">Equipo</td><td></td><td></td>${sum.map(s => `<td>${s}</td>`).join("")}</tr></tbody></table></div>`;
  };
  $("cuerpo").innerHTML = [p.local, p.visitante].map(eq => tabla(eq, r.filas.filter(f => f.equipo === eq))).join("") +
    `<p class="nota" style="margin-top:12px">Los minutos son aproximados: salen de los cambios. ${p.estado === "in" ? "El partido sigue en juego; volvé a abrir esta pestaña para actualizar." : ""}</p>`;
}

function filtrosHTML(p) {
  const opt = (arr, val) => arr.map(([v, t]) => `<option value="${v}"${String(v) === String(val) ? " selected" : ""}>${t}</option>`).join("");
  const lineas = [0.5, 1.5, 2.5, 3.5, 4.5].map(v => [v, `Más de ${r1(v)}`]);
  return `<div class="filtros">
    <div class="seg" role="group" aria-label="Equipo">
      <button data-lado="home" class="${vista.lado === "home" ? "on" : ""}">${esc(p.local)}</button>
      <button data-lado="away" class="${vista.lado === "away" ? "on" : ""}">${esc(p.visitante)}</button>
    </div>
    <label>Estadística <select id="fStat">${opt(Object.entries(NOMBRE_STAT), vista.stat)}</select></label>
    <label>Línea <select id="fLinea">${opt(lineas, vista.linea)}</select></label>
    <label>Partidos <select id="fN">${opt([[5, "Últimos 5"], [10, "Últimos 10"], [15, "Últimos 15"]], vista.n)}</select></label>
    <label class="check"><input type="checkbox" id="fTit"${vista.soloTitular ? " checked" : ""}> Solo como titular</label>
  </div>`;
}

async function pintarPrevia(p) {
  const teamId = vista.lado === "home" ? p.homeId : p.awayId;
  const nombreEq = vista.lado === "home" ? p.local : p.visitante;
  $("cuerpo").innerHTML = `<section class="xi" id="alineacion"><h4>Alineaciones</h4><div class="campo-espera ${esAngosto() ? "medio" : ""}"></div></section>`
    + `<section class="avisos" id="avisos"></section>` + filtrosHTML(p) + `<div id="previa"><div class="vacio">Trayendo los últimos partidos de ${esc(nombreEq)}…</div></div>`;
  pintarAlineacion(p);
  const [forma, actual] = await Promise.all([formaEquipo(teamId, p.fecha, Math.max(vista.n, 10)), resumen(p.id).catch(() => null)]);
  if (activo !== p.id || vista.tab !== "previa" || (vista.lado === "home" ? p.homeId : p.awayId) !== teamId) return;

  const conv = actual?.convocados?.[teamId] || [];
  const avisos = avisosEquipo(teamId, forma, actual, p.fecha, p.liga_nombre);
  const convMap = new Map(conv.map(c => [c.id, c]));
  const jugadores = new Map(forma.jugadores);
  for (const c of conv) if (!jugadores.has(c.id)) jugadores.set(c.id, { id: c.id, nombre: c.nombre, pos: c.pos, partidos: [] });

  const filas = [...jugadores.values()].map(j => {
    const ps = filtrarPartidos(j.partidos);
    return { j, ps, ...resumenStat(ps), hoy: convMap.get(j.id) };
  }).filter(f => f.pj > 0 || f.hoy);
  if (!filas.length) { $("previa").innerHTML = `<div class="vacio">ESPN no tiene estadísticas por jugador de los partidos anteriores de ${esc(nombreEq)}. Probá con el otro equipo.</div>`; return; }

  const { col, asc } = vista.ordenPlantel;
  const val = (f, c) => c === "jugador" ? f.j.nombre : c === "pos" ? (f.j.pos || "") : f[c] ?? -1;
  filas.sort((a, b) => { const x = val(a, col), y = val(b, col); const s = typeof x === "string" ? x.localeCompare(y) : x - y; return (asc ? s : -s) || b.n - a.n; });
  if (!vista.jugador || !jugadores.has(vista.jugador)) vista.jugador = filas.find(f => f.pj)?.j.id ?? null;

  const stat = NOMBRE_STAT[vista.stat].toLowerCase();
  const cols = [["jugador", "Jugador", "izq"], ["pos", "Pos", "izq col-opc"], ["pj", "PJ"], ["min", "Min por partido", "col-opc"],
    ["prom", `Promedio de ${stat}`], ["pct", `Superó ${r1(vista.linea)}`], ["spark", "Últimos partidos", "izq"]];
  plantelActual = jugadores;
  const enTabla = esAngosto();  // en celular el gráfico va debajo del jugador elegido
  const tabla = `<div class="tablewrap"><table data-tabla="plantel"><thead><tr>${cols.map(([c, t, cl]) =>
      `<th data-col="${c}" class="${cl || ""} ${c === col ? "ord" + (asc ? " asc" : "") : ""}">${t}</th>`).join("")}</tr></thead><tbody>
    ${filas.map(f => `<tr class="fila${f.j.id === vista.jugador ? " sel" : ""}" data-j="${esc(f.j.id)}" tabindex="0">
      <td class="izq">${esc(f.j.nombre)}${f.hoy ? `<span class="hoy">${f.hoy.titular ? "Titular hoy" : "Convocado"}</span>` : ""}${(avisos.get(f.j.id) || []).filter(a => a.tipo !== "hoy").slice(0, 1).map(etiquetaAviso).join("")}</td>
      <td class="izq sup col-opc">${esc(f.j.pos === "SUB" ? "" : f.j.pos)}</td>
      <td>${f.pj}</td><td class="col-opc">${f.min != null ? Math.round(f.min) : "–"}</td>
      <td>${f.prom != null ? r1(f.prom) : "–"}</td>
      <td class="pct">${f.pct != null ? `${Math.round(f.pct * 100)}%<small>${f.sup} de ${f.n}</small>` : "–"}</td>
      <td class="izq">${f.ps.length ? sparkline(f.ps) : ""}</td></tr>${enTabla && f.j.id === vista.jugador ? PANEL_FILA : ""}`).join("")}
    </tbody></table></div>
    <p class="nota" style="margin-top:10px">La tabla usa los últimos ${forma.partidos.length} partidos de ${esc(nombreEq)} en todas sus competiciones; los minutos son aproximados.
    ${conv.length ? "" : `La alineación confirmada aparece cuando ESPN la publica, cerca del inicio${p.estado === "pre" && new Date(p.fecha) - Date.now() < 6 * 36e5 ? "; la página la busca sola cada 2 minutos" : ""}.`}</p>`;

  $("previa").innerHTML = (enTabla ? "" : `<section class="jugador" id="panelJugador"></section>`) + tabla;
  pintarJugador(jugadores.get(vista.jugador));
}

// ---------- alineaciones en la cancha ----------
// Profundidad (0 = arco propio) y costado (-1 izquierda … 1 derecha) según la posición de ESPN.
function profundidad(pos = "") {
  if (pos === "G") return 0;
  if (/^(CD|SW)/.test(pos)) return 1;
  if (/^(LB|RB)$/.test(pos)) return 1.1;
  if (/WB/.test(pos)) return 1.8;
  if (/^(DM|CDM)/.test(pos)) return 2.2;
  if (/^(CM|LM|RM|M)/.test(pos)) return 3;
  if (/^(AM|CAM)/.test(pos)) return 4;
  if (/^(LW|RW|LF|RF)/.test(pos)) return 4.6;
  if (/^(CF|F|ST|S)/.test(pos)) return 5;
  return 3;
}
function costado(pos = "") {
  if (/-L$/.test(pos)) return -0.5;
  if (/-R$/.test(pos)) return 0.5;
  if (/^L/.test(pos)) return -1;
  if (/^R/.test(pos)) return 1;
  return 0;
}
// Devuelve cada titular con d (0 arco propio → 1 mitad de cancha) y t (0 izquierda → 1 derecha del equipo).
function ubicarXI(xi, formacion) {
  const arquero = xi.find(j => j.pos === "G") || [...xi].sort((a, b) => a.lugar - b.lugar)[0];
  const campo = xi.filter(j => j !== arquero)
    .sort((a, b) => profundidad(a.pos) - profundidad(b.pos) || a.lugar - b.lugar);
  let filas = (formacion || "").split("-").map(Number).filter(n => n > 0);
  if (filas.reduce((a, b) => a + b, 0) !== campo.length) {
    const grupos = new Map();
    for (const j of campo) { const k = Math.round(profundidad(j.pos)); grupos.set(k, (grupos.get(k) || 0) + 1); }
    filas = [...grupos.keys()].sort((a, b) => a - b).map(k => grupos.get(k));
  }
  const res = arquero ? [{ ...arquero, d: 0.03, t: 0.5 }] : [];
  let i = 0;
  filas.forEach((n, k) => {
    const fila = campo.slice(i, i + n).sort((a, b) => costado(a.pos) - costado(b.pos)); i += n;
    const d = filas.length === 1 ? 0.6 : 0.24 + k * (0.94 - 0.24) / (filas.length - 1);
    fila.forEach((j, m) => res.push({ ...j, d, t: (m + 1) / (n + 1) }));
  });
  return res;
}
const colorTexto = hex => {
  const n = parseInt(hex, 16); if (Number.isNaN(n)) return "#ffffff";
  const [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255];
  return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? "#14231a" : "#ffffff";
};
function coloresEquipos(colA, colB) {
  const ok = c => /^[0-9a-f]{6}$/i.test(c || "");
  const rgb = h => { const n = parseInt(h, 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const lejos = (x, y) => { const [a, b] = [rgb(x), rgb(y)]; return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]) > 130; };
  const a = ok(colA?.[0]) ? colA[0] : "14231a";
  const candidatos = [colB?.[0], colB?.[1], "f7f9f4", "14231a"].filter(ok);
  return [a, candidatos.find(c => lejos(c, a)) || "f7f9f4"];
}

async function datosXI(p, teamId, forma, actual, avisos) {
  let xi = (actual?.convocados?.[teamId] || []).filter(j => j.titular);
  let formacion = actual?.formaciones?.[teamId], fuente = "confirmada", confirmada = xi.length >= 11;
  if (xi.length < 11 && forma.partidos.length) {
    const ult = forma.partidos[0];
    const r = await resumen(ult.id).catch(() => null);
    const t = (r?.convocados?.[teamId] || []).filter(j => j.titular);
    if (t.length >= 11) {
      xi = t; formacion = r.formaciones[teamId];
      const rival = ult.homeId === teamId ? ult.visitante : ult.local;
      fuente = `último 11 inicial, contra ${rival} el ${fmtCorta.format(new Date(ult.fecha))}`;
    }
  }
  if (xi.length < 11) return null;
  const stats = j => {
    const jj = forma.jugadores.get(j.id);
    return jj ? resumenStat(filtrarPartidos(jj.partidos)) : null;
  };
  const dudas = [];
  const ubicados = ubicarXI(xi, formacion).map(j => {
    const av = (avisos?.get(j.id) || []).find(a => a.tipo !== "hoy" && a.tipo !== "volvio");
    if (av && !confirmada) dudas.push(`${j.corto} (${NOMBRE_AVISO[av.tipo].toLowerCase()})`);
    return { ...j, est: stats(j), aviso: av };
  });
  return { ubicados, formacion, fuente, confirmada, dudas };
}

function lineasCancha(W, H, medio) {
  const s = 1000 / 105;  // unidades por metro
  const area = [16.5 * s, 40.3 * s], chica = [5.5 * s, 18.3 * s], r = 9.15 * s;
  if (medio) {  // media cancha vertical, arco abajo
    return `<rect x="4" y="4" width="${W - 8}" height="${H - 8}"/>
      <line x1="4" y1="4" x2="${W - 4}" y2="4"/><path d="M${W / 2 - r} 4 A${r} ${r} 0 0 0 ${W / 2 + r} 4"/>
      <rect x="${(W - area[1]) / 2}" y="${H - 4 - area[0]}" width="${area[1]}" height="${area[0]}"/>
      <rect x="${(W - chica[1]) / 2}" y="${H - 4 - chica[0]}" width="${chica[1]}" height="${chica[0]}"/>
      <path d="M${W / 2 - 7.3 * s} ${H - 4 - area[0]} A${r} ${r} 0 0 1 ${W / 2 + 7.3 * s} ${H - 4 - area[0]}"/>`;
  }
  return `<rect x="4" y="4" width="${W - 8}" height="${H - 8}"/>
    <line x1="${W / 2}" y1="4" x2="${W / 2}" y2="${H - 4}"/><circle cx="${W / 2}" cy="${H / 2}" r="${r}"/>
    <rect x="4" y="${(H - area[1]) / 2}" width="${area[0]}" height="${area[1]}"/>
    <rect x="4" y="${(H - chica[1]) / 2}" width="${chica[0]}" height="${chica[1]}"/>
    <rect x="${W - 4 - area[0]}" y="${(H - area[1]) / 2}" width="${area[0]}" height="${area[1]}"/>
    <rect x="${W - 4 - chica[0]}" y="${(H - chica[1]) / 2}" width="${chica[0]}" height="${chica[1]}"/>
    <path d="M${4 + area[0]} ${H / 2 - 7.3 * s} A${r} ${r} 0 0 1 ${4 + area[0]} ${H / 2 + 7.3 * s}"/>
    <path d="M${W - 4 - area[0]} ${H / 2 - 7.3 * s} A${r} ${r} 0 0 0 ${W - 4 - area[0]} ${H / 2 + 7.3 * s}"/>`;
}

function fichaJugador(j, x, y, color, lado, escala, W) {
  const tc = colorTexto(color), sel = j.id === vista.jugador;
  const pct = j.est?.pct != null ? `${Math.round(j.est.pct * 100)}%` : "";
  const r = 19 * escala, f = 15 * escala;
  // nombres cerca del borde: alineados hacia adentro para que no se corten
  const borde = 70 * escala;
  const [tx, ancla] = x < borde ? [Math.max(8, x - r), "start"] : x > W - borde ? [Math.min(W - 8, x + r), "end"] : [x, "middle"];
  return `<g class="ficha" data-xi="${esc(j.id)}" data-xi-lado="${lado}" tabindex="0" role="button" aria-label="${esc(j.nombre)}${pct ? `, ${pct}` : ""}">
    ${sel ? `<circle cx="${x}" cy="${y}" r="${r + 6 * escala}" fill="none" stroke="var(--amarilla)" stroke-width="${4 * escala}"/>` : ""}
    <circle cx="${x}" cy="${y}" r="${r}" fill="#${color}" stroke="#f7f9f4" stroke-width="${2.5 * escala}"/>
    <text x="${x}" y="${y + 5 * escala}" text-anchor="middle" class="dorsal" style="fill:${tc};font-size:${f}px">${esc(j.dorsal ?? "")}</text>
    <text x="${tx}" y="${y + r + 17 * escala}" text-anchor="${ancla}" class="nombre" style="font-size:${f}px">${esc(j.corto)}</text>
    ${pct ? `<text x="${tx}" y="${y + r + 36 * escala}" text-anchor="${ancla}" class="pctxi" style="font-size:${f * 1.25}px">${pct}</text>` : ""}
    ${j.aviso ? `<g class="marca m-${j.aviso.tipo}"><title>${esc(NOMBRE_AVISO[j.aviso.tipo])}: ${esc(j.aviso.texto)}</title>
      <circle cx="${x + r * 0.78}" cy="${y - r * 0.78}" r="${8 * escala}"/>
      <text x="${x + r * 0.78}" y="${y - r * 0.78 + 4 * escala}" text-anchor="middle" style="font-size:${11 * escala}px">${j.aviso.tipo === "rotar" ? "↻" : "!"}</text></g>` : ""}
  </g>`;
}

let tRefresco = null, avisosActuales = null;
function programarRefresco(p, confirmadas) {
  clearTimeout(tRefresco); tRefresco = null;
  const faltan = new Date(p.fecha) - Date.now();
  // antes del partido, si falta alguna alineación, se vuelve a consultar ESPN cada 2 minutos
  if (p.estado !== "pre" || confirmadas || faltan > 6 * 36e5) return;
  tRefresco = setTimeout(async () => {
    if (activo !== p.id || vista.tab !== "previa" || !$("alineacion")) return;
    delete resumenes[p.id];
    const r = await resumen(p.id).catch(() => null);
    const ok = id => (r?.convocados?.[id] || []).filter(j => j.titular).length >= 11;
    if (activo !== p.id || vista.tab !== "previa") return;
    if (ok(p.homeId) || ok(p.awayId)) pintarDetalle();  // salió una alineación: se repinta todo (tabla incluida)
    else programarRefresco(p, false);
  }, 120e3);
}

function pintarAvisos(p, avh, ava) {
  const cont = $("avisos");
  if (!cont) return;
  const bloque = (eq, av, nom) => {
    const items = [...av].filter(([, l]) => l.some(a => a.tipo !== "hoy"))
      .sort((a, b) => ORDEN_AVISO[a[1][0].tipo] - ORDEN_AVISO[b[1][0].tipo]);
    return `<div class="avisos-eq"><h5>${esc(eq)}</h5>${items.length ? `<ul>${items.map(([id, l]) => `<li>
        <span class="quien">${esc(nom.get(id) || "")}</span>${l.filter(a => a.tipo !== "hoy").map(etiquetaAviso).join("")}
        <span class="por">${esc(l.filter(a => a.tipo !== "hoy").map(a => a.texto).join(". "))}</span></li>`).join("")}</ul>`
      : `<p class="sup">Sin avisos: el plantel viene completo.</p>`}</div>`;
  };
  const [eqs, avs, nms] = [[p.local, p.visitante], [avh.av, ava.av], [avh.nom, ava.nom]];
  const orden = esAngosto() ? (vista.lado === "home" ? [0] : [1]) : [0, 1];
  cont.innerHTML = `<h4>Avisos del plantel</h4><div class="avisos-grid">${orden.map(i => bloque(eqs[i], avs[i], nms[i])).join("")}</div>
    <p class="nota">ESPN no publica lesionados de fútbol: estos avisos salen de las listas de convocados, los minutos y las tarjetas de los partidos anteriores. Confirmalo con las noticias antes de apostar.</p>`;
  avisosActuales = { partido: p.id, home: avh, away: ava };
}

async function pintarAlineacion(p) {
  const n = Math.max(vista.n, 10);
  try {
    const [fh, fa, actual] = await Promise.all([formaEquipo(p.homeId, p.fecha, n), formaEquipo(p.awayId, p.fecha, n), resumen(p.id).catch(() => null)]);
    const avh = avisosEquipo(p.homeId, fh, actual, p.fecha, p.liga_nombre), ava = avisosEquipo(p.awayId, fa, actual, p.fecha, p.liga_nombre);
    const [xh, xa] = await Promise.all([datosXI(p, p.homeId, fh, actual, avh), datosXI(p, p.awayId, fa, actual, ava)]);
    const cont = $("alineacion");
    if (!cont || activo !== p.id) return;
    const nom = (teamId, forma) => {
      const m = new Map();
      for (const j of forma.jugadores.values()) m.set(j.id, j.nombre);
      for (const c of actual?.convocados?.[teamId] || []) if (!m.has(c.id)) m.set(c.id, c.nombre);
      return m;
    };
    pintarAvisos(p, { av: avh, nom: nom(p.homeId, fh) }, { av: ava, nom: nom(p.awayId, fa) });
    programarRefresco(p, !!(xh?.confirmada && xa?.confirmada));
    const [ch, ca] = coloresEquipos(actual?.colores?.[p.homeId], actual?.colores?.[p.awayId]);
    const stat = NOMBRE_STAT[vista.stat].toLowerCase();
    const nota = (nombre, x) => x ? `<span class="xi-nota"><span class="estado-xi ${x.confirmada ? "conf" : "prob"}">${x.confirmada ? "Confirmada" : "Probable"}</span>
        <b>${esc(nombre)}</b>${x.formacion ? ` ${esc(x.formacion)}` : ""}${x.confirmada ? "" : `: ${esc(x.fuente)}, hasta que ESPN publique la de hoy`}
        ${x.dudas.length ? `<span class="dudas">En duda: ${esc(x.dudas.join(", "))}</span>` : ""}</span>`
                                  : `<span><b>${esc(nombre)}</b>: sin alineación disponible</span>`;
    let svg;
    if (esAngosto()) {  // celular: media cancha del equipo elegido
      const x = vista.lado === "home" ? xh : xa, color = vista.lado === "home" ? ch : ca;
      const W = 648, H = 820;
      const fichas = x ? x.ubicados.map(j => fichaJugador(j, 50 + j.t * (W - 100), H - 92 - j.d * (H - 200), color, vista.lado, 1.4, W)).join("") : "";
      svg = `<svg viewBox="0 0 ${W} ${H}" class="campo medio" role="group" aria-label="Alineación"><g class="tiza">${lineasCancha(W, H, true)}</g>${fichas}</svg>`;
      cont.innerHTML = `<h4>Alineación</h4>${svg}<div class="xi-notas">${nota(vista.lado === "home" ? p.local : p.visitante, x)}</div>`;
    } else {
      const W = 1000, H = 648;
      const fh2 = xh ? xh.ubicados.map(j => fichaJugador(j, 34 + j.d * 430, 52 + j.t * (H - 104), ch, "home", 1, W)).join("") : "";
      const fa2 = xa ? xa.ubicados.map(j => fichaJugador(j, W - 34 - j.d * 430, H - 52 - j.t * (H - 104), ca, "away", 1, W)).join("") : "";
      svg = `<svg viewBox="0 0 ${W} ${H}" class="campo" role="group" aria-label="Alineaciones"><g class="tiza">${lineasCancha(W, H, false)}</g>${fh2}${fa2}</svg>`;
      cont.innerHTML = `<h4>Alineaciones</h4>${svg}<div class="xi-notas">${nota(p.local, xh)}${nota(p.visitante, xa)}</div>`;
    }
    cont.querySelector(".xi-notas").insertAdjacentHTML("beforeend", `<span>El % es cuántas veces superó ${r1(vista.linea)} ${stat} en sus últimos ${vista.n} partidos con su equipo. Tocá un jugador para ver su gráfico.</span>`);
  } catch {
    const cont = $("alineacion");
    if (cont) cont.innerHTML = `<h4>Alineaciones</h4><div class="vacio">No se pudo traer la alineación de ESPN.</div>`;
  }
}

function elegirDesdeCancha(g) {
  const id = g.dataset.xi, lado = g.dataset.xiLado;
  if (lado !== vista.lado) { vista.lado = lado; vista.jugador = id; pintarDetalle(); return; }
  const fila = document.querySelector(`tr.fila[data-j="${CSS.escape(id)}"]`);
  if (fila) elegirFila(fila); else { vista.jugador = id; pintarDetalle(); }
  document.querySelectorAll("#alineacion .ficha").forEach(f => f.classList.toggle("elegida", f.dataset.xi === id));
  const p = partidos.find(x => x.id === activo); if (p) pintarAlineacion(p);
}

let plantelActual = null;
const PANEL_FILA = `<tr class="panel-fila"><td colspan="7"><section class="jugador" id="panelJugador"></section></td></tr>`;
const esAngosto = () => window.matchMedia("(max-width: 860px)").matches;

// Ejecuta un cambio en la página sin que se mueva lo que el usuario está mirando:
// mide dónde está `ancla` antes y después, y compensa el scroll.
function sinSalto(ancla, cambio) {
  const antes = ancla?.isConnected ? ancla.getBoundingClientRect().top : null;
  cambio();
  if (antes == null || !ancla.isConnected) return;
  const delta = ancla.getBoundingClientRect().top - antes;
  if (Math.abs(delta) < 1) return;
  const main = $("detalle");
  if (!esAngosto() && main.scrollHeight > main.clientHeight) main.scrollTop += delta;
  else window.scrollBy(0, delta);
}

function elegirFila(fila) {
  const id = fila.dataset.j;
  if (id === vista.jugador || !plantelActual) return;
  vista.jugador = id;
  sinSalto(fila, () => {
    document.querySelectorAll("tr.fila.sel").forEach(r => r.classList.remove("sel"));
    fila.classList.add("sel");
    if (esAngosto()) {
      document.querySelector("tr.panel-fila")?.remove();
      fila.insertAdjacentHTML("afterend", PANEL_FILA);
    }
    pintarJugador(plantelActual.get(id));
  });
}

    const angosto = window.matchMedia("(max-width: 760px)").matches;
    const { svg, orden } = graficoBarras(sel, angosto ? cont.clientWidth - 24 : cont.clientWidth - 284);

        <div class="cifras-chicas">
          <div><div class="v">${r1(r.prom)}</div><div class="k">promedio</div></div>
          <div><div class="v">${Math.max(...sel.map(p => p.stats[vista.stat] ?? 0))}</div><div class="k">máximo</div></div>
        </div>
        ${cargandoOtros ? "" : `<button class="agregar${enTalon(claveSeleccion(j.id)) ? " ya" : ""}" data-agregar>${enTalon(claveSeleccion(j.id)) ? "Actualizar en el talón" : "Agregar al talón"}</button>`}
      </div>
      <div>
        <p class="nota">${NOMBRE_STAT[vista.stat]} en sus últimos ${sel.length} partidos${vista.soloTitular ? " como titular" : ""}. ${nota}</p>
        <div class="leyenda"><span><i style="background:var(--hit)"></i>Superó la línea</span><span><i style="background:var(--miss)"></i>No la superó</span><span><i class="dash"></i>Línea ${r1(vista.linea)}</span></div>
        <div class="chart" id="chart">${svg}</div>

          <thead><tr><th class="izq">Fecha</th><th class="izq">Rival</th><th class="izq">Competición</th><th>Resultado</th><th>Min</th><th>${NOMBRE_STAT[vista.stat]}</th></tr></thead><tbody>
          ${sel.map(p => `<tr><td class="izq">${fmtLarga.format(new Date(p.fecha))}</td><td class="izq">${p.condicion === "V" ? "en cancha de " : ""}${esc(p.rival)}</td>
            <td class="izq sup">${esc(p.comp)}</td><td>${esc(p.resultado)}</td><td>${p.minutos ?? "–"}${p.titular ? "" : " <span class='sup'>entró</span>"}</td>
