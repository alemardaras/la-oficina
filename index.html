function activarTooltip(chart, orden) {
  const tip = $("tip");
  chart.querySelectorAll("rect.hit").forEach(rc => {
    const mostrar = e => {
      const p = orden[+rc.dataset.i], v = p.stats[vista.stat];
      tip.innerHTML = `<div class="sup">${esc(fmtLarga.format(new Date(p.fecha)))}, ${esc(p.comp)}</div>
        <div>${p.condicion === "V" ? "En cancha de " : "Contra "}${esc(p.rival)} <span class="sup">${esc(p.resultado)}</span></div>
        <div style="margin-top:4px"><b>${v ?? "–"}</b> ${NOMBRE_STAT[vista.stat].toLowerCase()} en ${p.minutos != null ? p.minutos + " minutos" : (p.titular ? "su partido como titular" : "su partido desde el banco")}</div>`;
      tip.style.display = "block";
      const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
      const yTop = e.clientY - tip.offsetHeight - 14;
      tip.style.left = Math.max(8, x) + window.scrollX + "px";
      tip.style.top = (yTop < 8 ? e.clientY + 18 : yTop) + window.scrollY + "px";
      rc.setAttribute("fill", "color-mix(in srgb, var(--text) 6%, transparent)");
    };
    rc.addEventListener("mouseenter", mostrar);
    rc.addEventListener("mousemove", mostrar);
    rc.addEventListener("mouseleave", () => { tip.style.display = "none"; rc.setAttribute("fill", "transparent"); });
  });
}

// ---------- talón: selecciones guardadas con sus estadísticas ----------
// Se guarda en el navegador (localStorage); si no está disponible, dura mientras la página esté abierta.
const CLAVE_TALON = "laoficina.talon.v1";
let talon = [], ultimoPanel = null;
try { talon = JSON.parse(localStorage.getItem(CLAVE_TALON) || "[]"); } catch { talon = []; }
const guardarTalon = () => { try { localStorage.setItem(CLAVE_TALON, JSON.stringify(talon)); } catch {} };
const claveSeleccion = jugadorId => `${activo}|${jugadorId}|${vista.stat}|${vista.linea}`;
const enTalon = clave => talon.some(s => s.clave === clave);
const cuotaJusta = prob => prob > 0 ? (1 / prob).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "–";

function agregarAlTalon() {
  const p = partidos.find(x => x.id === activo);
  if (!p || !ultimoPanel) return;
  const { j, sel, r } = ultimoPanel;
  const clave = claveSeleccion(j.id);
  const seleccion = {
    clave, jugador: j.nombre, pos: j.pos && j.pos !== "SUB" ? j.pos : "",
    equipo: vista.lado === "home" ? p.local : p.visitante,
    partido: { id: p.id, local: p.local, visitante: p.visitante, fecha: p.fecha, liga: p.liga_nombre },
    stat: vista.stat, linea: vista.linea, soloTitular: vista.soloTitular,
    pct: r.pct, sup: r.sup, n: r.n, prom: r.prom, max: Math.max(...sel.map(x => x.stats[vista.stat] ?? 0)),
    valores: [...sel].reverse().map(x => ({ v: x.stats[vista.stat], fecha: x.fecha, rival: x.rival })),
    agregado: new Date().toISOString(),
  };
  const i = talon.findIndex(s => s.clave === clave);
  if (i >= 0) talon[i] = seleccion; else talon.push(seleccion);
  guardarTalon();
  pintarTalon();
  const b = $("abrirTalon"); b.classList.remove("pulso"); void b.offsetWidth; b.classList.add("pulso");
  const btn = document.querySelector("[data-agregar]");
  if (btn) { btn.textContent = "En el talón"; btn.classList.add("ya"); }
}

function barrasTalon(valores, linea) {
  const W = 360, H = 88, base = 50, alto = 42;
  const max = Math.max(linea + 0.5, ...valores.map(x => x.v ?? 0));
  const band = W / Math.max(valores.length, 1), bw = Math.min(18, band * 0.6);
  let g = "";
  valores.forEach((x, i) => {
    const v = x.v ?? 0, h = Math.max((v / max) * alto, 2), bx = i * band + (band - bw) / 2;
    g += `<rect x="${bx}" y="${base - h}" width="${bw}" height="${h}" rx="2" fill="var(${v > linea ? "--hit" : "--miss"})">
            <title>${esc(fmtLarga.format(new Date(x.fecha)))}, contra ${esc(x.rival)}: ${x.v ?? "sin dato"}</title></rect>
          <text class="val" x="${i * band + band / 2}" y="${base + 15}" text-anchor="middle">${x.v ?? "–"}</text>`;
  });
  const ly = base - (linea / max) * alto;
  g += `<line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="4 3"/>
        <text x="0" y="${H - 2}">← más antiguo</text><text x="${W}" y="${H - 2}" text-anchor="end">más reciente →</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Últimos valores: ${valores.map(x => x.v ?? "sin dato").join(", ")}">${g}</svg>`;
}

function textoTalon() {
  const prob = talon.reduce((a, s) => a * (s.pct ?? 0), 1);
  return ["La Oficina, talón", ""].concat(talon.map((s, i) =>
    `${i + 1}. ${s.jugador} (${s.equipo}) más de ${r1(s.linea)} ${NOMBRE_STAT[s.stat].toLowerCase()}\n` +
    `   ${s.partido.local} vs ${s.partido.visitante}, ${fmtDia.format(new Date(s.partido.fecha))}\n` +
    `   Superó la línea en ${s.sup} de ${s.n} (${Math.round(s.pct * 100)}%), promedio ${r1(s.prom)}, cuota justa ${cuotaJusta(s.pct)}\n` +
    `   Últimos: ${s.valores.map(x => x.v ?? "–").join(" ")}`))
    .concat(talon.length > 1 ? ["", `Combinada: ${Math.round(prob * 100)}% histórico, cuota justa ${cuotaJusta(prob)}`] : [])
    .join("\n");
}

    ${talon.map((s, i) => {

        <div class="quien">${esc(s.jugador)}</div>
        <div class="donde">${esc(s.equipo)}${s.pos ? `, ${esc(s.pos)}` : ""}. ${esc(s.partido.local)} vs ${esc(s.partido.visitante)}, ${esc(cuando)}</div>
        <button class="quitar" data-quitar="${i}">Quitar</button>
        <div class="linea">Más de ${r1(s.linea)} ${NOMBRE_STAT[s.stat].toLowerCase()}${s.soloTitular ? " (partidos como titular)" : ""}</div>
        <div class="datos">
          <div><div class="v">${Math.round(s.pct * 100)}%</div><div class="k">superó en ${s.sup} de ${s.n}</div></div>
          <div><div class="v chica">${r1(s.prom)}</div><div class="k">promedio</div></div>
          <div><div class="v chica">${s.max}</div><div class="k">máximo</div></div>
          <div><div class="v chica">${cuotaJusta(s.pct)}</div><div class="k">cuota justa</div></div>

    <div class="pie">

      <p>Si bet365 paga más que la cuota justa, la apuesta tiene valor según el historial. El % de la combinada multiplica los de cada selección, como si fueran independientes; con jugadores del mismo partido puede no ser así.</p>`
      : `<p>Si bet365 paga más que la cuota justa, la apuesta tiene valor según el historial de estos partidos.</p>`}
      <div class="acciones">
        <a class="principal" href="https://wa.me/?text=${encodeURIComponent(textoTalon())}" target="_blank" rel="noopener">Mandar por WhatsApp</a>
        <button data-copiar>Copiar talón</button>
        <button data-vaciar>Vaciar talón</button>
      </div>

// ---------- chat IA (pasa por un worker de Cloudflare que guarda la clave de Anthropic) ----------
const CHAT_URL = "";  // URL del worker, por ejemplo https://la-oficina-chat.TU-SUBDOMINIO.workers.dev
const CLAVE_CHAT = "laoficina.chat";
let chat = [], chatOcupado = false;
try { chat = JSON.parse(sessionStorage.getItem(CLAVE_CHAT) || "[]"); } catch { chat = []; }
const guardarChat = () => { try { sessionStorage.setItem(CLAVE_CHAT, JSON.stringify(chat.slice(-20))); } catch {} };

// texto mínimo con formato: **negrita**, listas con "-" o "1." y párrafos
function mdLite(t) {
  const lineas = esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split("\n");
  let html = "", lista = null;
  const cerrar = () => { if (lista) { html += `</${lista}>`; lista = null; } };
  for (const l of lineas) {
    const ul = l.match(/^\s*[-•*]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul || ol) {
      const tipo = ul ? "ul" : "ol";
      if (lista !== tipo) { cerrar(); html += `<${tipo}>`; lista = tipo; }
      html += `<li>${(ul || ol)[1]}</li>`;
    } else { cerrar(); if (l.trim()) html += `<p>${l}</p>`; }
  }
  cerrar();
  return html;
}

// resumen por jugador de varias estadísticas, para que la IA arme combinadas con datos reales
const LINEAS_IA = { tiros: [0.5, 1.5, 2.5], tiros_al_arco: [0.5, 1.5], faltas_cometidas: [0.5, 1.5], faltas_recibidas: [0.5, 1.5],
                    amarillas: [0.5], goles: [0.5], asistencias: [0.5], atajadas: [1.5, 2.5] };
function lineaJugadorIA(j, avisos, n) {
  const ps = [...j.partidos].sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, n);
  if (!ps.length) return null;
  const tit = ps.filter(x => x.titular).length;
  const conMin = ps.filter(x => x.minutos != null);
  const min = conMin.length ? Math.round(conMin.reduce((a, x) => a + x.minutos, 0) / conMin.length) : "?";
  const partes = [];
  for (const [st, lineas] of Object.entries(LINEAS_IA)) {
    const vals = ps.map(x => x.stats[st]).filter(v => v != null);
    if (!vals.length) continue;
    const prom = vals.reduce((a, b) => a + b, 0) / vals.length;
    if (st === "atajadas" && j.pos !== "G") continue;
    if (prom === 0 && st !== "tiros") continue;  // ceros que no aportan: se omiten para achicar el contexto
    const pcts = lineas.map(l => `+${l}: ${Math.round(vals.filter(v => v > l).length / vals.length * 100)}%`).join(" ");
    partes.push(`${NOMBRE_STAT[st].toLowerCase()} prom ${r1(prom)} (${pcts}) últimos [${ps.map(x => x.stats[st] ?? "-").join(",")}]`);
  }
  const av = (avisos.get(j.id) || []).map(a => `${NOMBRE_AVISO[a.tipo].toUpperCase()}: ${a.texto}`).join("; ");
  return `- ${j.nombre} (${j.pos && j.pos !== "SUB" ? j.pos : "?"}) | ${ps.length} PJ, ${tit} de titular, ${min}' por partido${av ? ` | AVISO ${av}` : ""}\n    ${partes.join(" · ")}`;
}

async function contextoIA() {
  const partes = [`Hoy es ${fmtLarga.format(new Date())}. Estadística elegida en la página: ${NOMBRE_STAT[vista.stat]}, línea más de ${r1(vista.linea)}, últimos ${vista.n} partidos.`];
  const p = partidos.find(x => x.id === activo);
  if (p) {
    const f = new Date(p.fecha), n = Math.max(vista.n, 10);
    partes.push(`\nPARTIDO ABIERTO: ${p.local} (local) vs ${p.visitante}, ${p.liga_nombre}, ${fmtDia.format(f)} ${fmtHora.format(f)}. Estado: ${p.estado === "pre" ? "por jugarse" : p.detalle}${p.estado !== "pre" ? `, ${p.gl}-${p.gv}` : ""}.`);
    try {
      const [fh, fa, actual] = await Promise.all([formaEquipo(p.homeId, p.fecha, n), formaEquipo(p.awayId, p.fecha, n), resumen(p.id).catch(() => null)]);
      for (const [teamId, forma, nombre] of [[p.homeId, fh, p.local], [p.awayId, fa, p.visitante]]) {
        const conv = actual?.convocados?.[teamId] || [];
        const xi = conv.filter(c => c.titular);
        const avisos = avisosEquipo(teamId, forma, actual, p.fecha, p.liga_nombre);
        partes.push(`\n== ${nombre} == (últimos ${forma.partidos.length} partidos: ${forma.partidos.slice(0, 5).map(m => `${m.local} ${m.gl}-${m.gv} ${m.visitante}`).join("; ")})`);
        partes.push(xi.length >= 11 ? `Alineación CONFIRMADA: ${xi.map(c => c.nombre).join(", ")}. Suplentes: ${conv.filter(c => !c.titular).map(c => c.nombre).join(", ")}`
          : "Alineación todavía no confirmada (la página muestra el último 11 como probable).");
        const filas = [...forma.jugadores.values()].filter(j => j.partidos.length >= 2)
          .sort((a, b) => b.partidos.length - a.partidos.length).slice(0, 22)
          .map(j => lineaJugadorIA(j, avisos, vista.n)).filter(Boolean);
        partes.push(filas.join("\n"));
      }
    } catch { partes.push("(No se pudieron traer los datos de ESPN de este partido.)"); }
  } else {
    partes.push("\nNo hay ningún partido abierto en la página. Si el usuario pregunta por jugadores, sugerile abrir el partido para tener datos.");
  }
  const otros = partidos.filter(x => x.id !== activo && x.estado === "pre").slice(0, 30);
  if (otros.length) partes.push(`\nOtros partidos cargados por jugarse: ${otros.map(x => `${x.local} vs ${x.visitante} (${x.liga_nombre})`).join("; ")}.`);
  partes.push(talon.length ? `\nTALÓN ACTUAL DEL USUARIO:\n${textoTalon()}` : "\nEl talón del usuario está vacío.");
  return partes.join("\n");
}

function pintarChat() {
  const cont = $("chatMensajes");
  const p = partidos.find(x => x.id === activo);
  $("chatContexto").textContent = p ? `Usa los datos de ${p.local} vs ${p.visitante} y tu talón.` : "Abrí un partido para que la IA use sus datos.";
  if (!CHAT_URL) {
    cont.innerHTML = `<div class="intro">El chat todavía no está conectado: falta poner la dirección del servidor que guarda la clave de la IA.</div>`;
    $("chatForm").querySelector("button").disabled = true;
    return;
  }
  const sug = p ? [`Armame una combinada de 3 para ${p.local} vs ${p.visitante}`, "¿Quién tiene más chances de recibir faltas?", "¿Hay algún titular en duda?"]
                : ["¿Cómo armo una buena combinada?", "¿Qué es la cuota justa?"];
  if (talon.length) sug.push("¿Qué riesgos tiene mi talón?");
  cont.innerHTML = (chat.length ? "" : `<div class="intro">Preguntá lo que quieras sobre el partido abierto o tu talón. La IA ve los mismos números que la página (historial de los últimos partidos, avisos de bajas y rotación), no las cuotas de las casas.
      <div class="sugerencias">${sug.map(t => `<button type="button" data-sug="${esc(t)}">${esc(t)}</button>`).join("")}</div></div>`)
    + chat.map(m => `<div class="msg ${m.role}">${m.role === "assistant" ? mdLite(m.content) : esc(m.content)}</div>`).join("")
    + (chatOcupado ? `<div class="msg assistant pensando">Pensando…</div>` : "");
  cont.scrollTop = cont.scrollHeight;
  $("chatForm").querySelector("button").disabled = chatOcupado;
}

async function enviarChat(texto) {
  texto = texto.trim();
  if (!texto || chatOcupado || !CHAT_URL) return;
  chat.push({ role: "user", content: texto.slice(0, 2000) });
  chatOcupado = true; guardarChat(); pintarChat();
  let error = null;
  try {
    const contexto = await contextoIA();
    const r = await fetch(CHAT_URL, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: chat.slice(-12), contexto }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.texto) error = d.error || `El servidor respondió ${r.status}.`;
    else chat.push({ role: "assistant", content: d.texto });
  } catch { error = "No se pudo conectar con el chat. Revisá tu conexión."; }
  if (error) chat.pop();  // la pregunta vuelve al cuadro de texto para reintentar
  chatOcupado = false; guardarChat(); pintarChat();
  if (error) {
    $("chatTexto").value = texto;
    $("chatMensajes").insertAdjacentHTML("beforeend", `<div class="msg error">${esc(error)}</div>`);
  }
}

function abrirChat(abrir) {
  $("chat").hidden = !abrir;
  $("abrirChat").setAttribute("aria-expanded", String(abrir));
  if (abrir) { abrirTalon(false); pintarChat(); $("chatTexto").focus(); }
}
$("abrirChat").addEventListener("click", () => abrirChat($("chat").hidden));
$("chat").addEventListener("click", e => {
  if (e.target.closest("[data-cerrar-chat]")) { abrirChat(false); return; }
  if (e.target.closest("[data-limpiar]")) { if (!chatOcupado) { chat = []; guardarChat(); pintarChat(); } return; }
  const s = e.target.closest("[data-sug]");
  if (s) enviarChat(s.dataset.sug);
});
$("chatForm").addEventListener("submit", e => { e.preventDefault(); const t = $("chatTexto").value; $("chatTexto").value = ""; enviarChat(t); });
$("chatTexto").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("chatForm").requestSubmit(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("chat").hidden) abrirChat(false); });

// ---------- música de fondo ----------
// Los navegadores no permiten sonar sin una acción del usuario: arranca con el botón,
// o con el primer toque en la página si la última vez quedó prendida.
const CLAVE_MUSICA = "laoficina.musica";
const musica = $("musica");
musica.volume = 0.35;
function marcarMusica(sonando) {
  $("musicaBtn").setAttribute("aria-pressed", String(sonando));
  $("musicaBtn").textContent = sonando ? "Pausar música" : "Poner música";
}
async function ponerMusica(prender) {
  try { localStorage.setItem(CLAVE_MUSICA, prender ? "1" : "0"); } catch {}
  if (!prender) { musica.pause(); marcarMusica(false); return; }
  $("musicaBtn").textContent = "Cargando música…";
  try { await musica.play(); marcarMusica(true); }
  catch { marcarMusica(false); $("musicaBtn").textContent = "No se pudo reproducir"; }
}
$("musicaBtn").addEventListener("click", e => { e.stopPropagation(); ponerMusica(musica.paused); });
// Prendida por defecto: intenta sonar al abrir; si el navegador lo bloquea, arranca con el primer toque.
// Solo queda apagada si el usuario la pausó (preferencia "0").
let prefMusica = "1";
try { prefMusica = localStorage.getItem(CLAVE_MUSICA) ?? "1"; } catch {}
if (prefMusica === "1") {
  musica.preload = "auto";
  const eventos = ["pointerdown", "keydown", "touchstart"];
  const arrancar = e => {
    eventos.forEach(ev => document.removeEventListener(ev, arrancar, true));
    if (e?.target?.closest?.("#musicaBtn")) return;  // el botón ya maneja su propio clic
    if (musica.paused) ponerMusica(true);
  };
  musica.play().then(() => marcarMusica(true))
    .catch(() => eventos.forEach(ev => document.addEventListener(ev, arrancar, { capture: true, passive: true })));
}

// ---------- eventos ----------
$("lista").addEventListener("click", e => {
  const b = e.target.closest(".partido"); if (b) abrirPartido(b.dataset.id);
});
$("destacados").addEventListener("click", e => {
  const b = e.target.closest(".rapido"); if (b) abrirPartido(b.dataset.id);
});
$("detalle").addEventListener("click", e => {
  if (e.target.closest("[data-volver]")) { volverALista(); return; }
  const ficha = e.target.closest(".ficha");
  if (ficha) { elegirDesdeCancha(ficha); return; }
  if (e.target.closest("[data-agregar]")) { agregarAlTalon(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { vista.tab = tab.dataset.tab; pintarDetalle(); return; }
  const lado = e.target.closest("[data-lado]");
  if (lado) { vista.lado = lado.dataset.lado; vista.jugador = null; pintarDetalle(); return; }
  const th = e.target.closest("th[data-col]");
  if (th) {
    const t = th.closest("table").dataset.tabla, c = th.dataset.col;
    if (c === "spark") return;
    const o = t === "plantel" ? "ordenPlantel" : "ordenPartido";
    vista[o] = { col: c, asc: vista[o].col === c ? !vista[o].asc : ["jugador", "pos", "posicion"].includes(c) };
    pintarDetalle(); return;
  }
  const fila = e.target.closest("tr.fila");
  if (fila) elegirFila(fila);
});
$("detalle").addEventListener("keydown", e => {
  const ficha = e.target.closest?.(".ficha");
  if (ficha && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); elegirDesdeCancha(ficha); return; }
  const fila = e.target.closest?.("tr.fila");
  if (fila && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); elegirFila(fila); }
});
$("detalle").addEventListener("change", e => {
  const id = e.target.id;
  if (id === "fStat") vista.stat = e.target.value;
  else if (id === "fLinea") vista.linea = +e.target.value;
  else if (id === "fN") vista.n = +e.target.value;
  else if (id === "fTit") vista.soloTitular = e.target.checked;
  else return;
  pintarDetalle();
});
let anchoPrevio = window.innerWidth, tRedim;
window.addEventListener("resize", () => {
  clearTimeout(tRedim);
  tRedim = setTimeout(() => {
    if (Math.abs(window.innerWidth - anchoPrevio) > 40 && $("panelJugador")) { anchoPrevio = window.innerWidth; pintarDetalle(); }
  }, 250);
});
$("buscar").addEventListener("input", () => { pintarLista(); if (esAngosto() && document.body.classList.contains("ver-detalle")) volverALista(); });
$("filtroLiga").addEventListener("change", pintarLista);
$("cargar").addEventListener("click", cargarPartidos);

// ---------- inicio ----------
(async () => {
  const hoy = new Date(), antes = new Date(), despues = new Date();
  antes.setDate(hoy.getDate() - 1); despues.setDate(hoy.getDate() + 1);
  $("desde").value = isoLocal(antes); $("hasta").value = isoLocal(despues);
  $("grupo").innerHTML = `<option value="principales">Ligas principales (${PRINCIPALES.length})</option>`;
  getJSON("/leagues/dropdown?sport=soccer&limit=1000").then(d => {
    const ls = (d.leagues || []).slice().sort((a, b) => a.name.localeCompare(b.name));
    $("grupo").insertAdjacentHTML("beforeend", ls.map(l => `<option value="${esc(l.slug)}">${esc(l.name)}</option>`).join(""));
  }).catch(() => {});
  await cargarPartidos();
})();
</script>
