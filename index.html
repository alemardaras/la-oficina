<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Oficina · Stats</title>
<meta name="description" content="Estadísticas por jugador y picks para las previas de fútbol.">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Oficina">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens: claro ---------- */
  :root {
    color-scheme: light;
    --pasto-1: #3f7f2e; --pasto-2: #4a8c35; --pasto-3: #326b26; --pasto-4: #38752a;
    --cal: #f7f9f4; --amarilla: #f2c230;
    --bg: #f0f1f3; --panel: #ffffff; --panel-2: #f6f7f8; --text: #141414; --text-2: #6c7076;
    --border: #e7e8eb; --grid: #eceef0; --sel: #e7f6ee;
    --acento: #00985f; --hit: #00985f; --miss: #cfd3d8; --live: #e5484d;
    --top: #1a1a1a; --sombra: 0 1px 2px rgba(0,0,0,.05), 0 1px 8px rgba(0,0,0,.04);
    --display: "Inter", system-ui, sans-serif;
    --ui: "Inter", system-ui, sans-serif;
  }
  /* ---------- oscuro ---------- */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --pasto-1: #23511d; --pasto-2: #2a5d22; --pasto-3: #1c4518; --pasto-4: #214e1c;
      --bg: #0f0f0f; --panel: #1d1d1d; --panel-2: #262626; --text: #f2f2f2; --text-2: #9b9b9b;
      --border: #2d2d2d; --grid: #2a2a2a; --sel: #173328;
      --acento: #14a86e; --hit: #2fbf7f; --miss: #3d3d3d; --live: #ff6b6b;
      --top: #1d1d1d; --sombra: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --pasto-1: #23511d; --pasto-2: #2a5d22; --pasto-3: #1c4518; --pasto-4: #214e1c;
    --bg: #0f0f0f; --panel: #1d1d1d; --panel-2: #262626; --text: #f2f2f2; --text-2: #9b9b9b;
    --border: #2d2d2d; --grid: #2a2a2a; --sel: #173328;
    --acento: #14a86e; --hit: #2fbf7f; --miss: #3d3d3d; --live: #ff6b6b;
    --top: #1d1d1d; --sombra: none;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--ui);
         display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; border-radius: 6px; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- barra superior ---------- */
  .topbar { flex: none; background: var(--top); color: #fff; border-bottom: 1px solid rgba(255,255,255,.06); }
  .topbar .in { max-width: 1440px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; white-space: nowrap; }
  .logo .ico { width: 32px; height: 32px; border-radius: 50%; background: var(--acento); display: grid; place-items: center; flex: none; }
  .logo .tag { font-size: 11px; font-weight: 700; letter-spacing: .02em; background: rgba(255,255,255,.12); padding: 2px 8px; border-radius: 999px; }
  .buscador { flex: 1; max-width: 440px; position: relative; margin-left: 12px; }
  .buscador svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); opacity: .6; pointer-events: none; }
  .buscador input { width: 100%; background: rgba(255,255,255,.1); border: 0; border-radius: 999px; padding: 9px 14px 9px 38px; color: #fff; }
  .buscador input::placeholder { color: rgba(255,255,255,.55); }
  .buscador input:focus { background: rgba(255,255,255,.16); outline: none; }
  .musica { margin-left: auto; background: rgba(255,255,255,.1); color: #fff; border: 0; border-radius: 999px;
            padding: 8px 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .musica:hover { background: rgba(255,255,255,.16); }
  .musica[aria-pressed="true"] { background: var(--acento); }

  /* ---------- destacados ---------- */
  .franja { flex: none; max-width: 1440px; width: 100%; margin: 0 auto; padding: 12px 16px 0; }
  .destacados { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
  .destacados::-webkit-scrollbar { display: none; }
  .destacados:empty { display: none; }
  .rapido { flex: none; width: 220px; display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer;
            background: var(--panel); border: 2px solid transparent; border-radius: 14px; padding: 10px 12px; box-shadow: var(--sombra); }
  .rapido:hover { border-color: var(--border); }
  .rapido.activo { border-color: var(--acento); }
  .r-cab { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--text-2); }
  .r-liga { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-cuando { white-space: nowrap; font-weight: 600; }
  .r-vivo { color: var(--live); font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .r-vivo i { width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
  .r-eq { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .r-eq .nom { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-eq b { font-weight: 800; font-variant-numeric: tabular-nums; }

  /* escudos */
  .esc { width: 20px; height: 20px; object-fit: contain; flex: none; }
  .esc-liga { width: 20px; height: 20px; object-fit: contain; flex: none; }
  .esc-grande { width: 60px; height: 60px; object-fit: contain; }
  .esc-ph { display: inline-block; border-radius: 50%; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--border); }

  /* ---------- cuerpo ---------- */
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 390px 1fr; gap: 16px;
            max-width: 1440px; width: 100%; margin: 0 auto; padding: 12px 16px 16px; }
  aside { overflow-y: auto; padding-right: 2px; scrollbar-width: thin; }
  .card { background: var(--panel); border-radius: 16px; box-shadow: var(--sombra); }
  .panel-carga { padding: 14px; display: grid; gap: 10px; margin-bottom: 4px; }
  .panel-carga .fechas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .panel-carga label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .panel-carga input, .panel-carga select { width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--border);
            border-radius: 10px; background: var(--panel-2); color: var(--text); font-weight: 500; }
  .fila-cargar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #cargar { background: var(--acento); color: #fff; border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 700; cursor: pointer; }
  #cargar:disabled { opacity: .6; cursor: default; }
  #estado { font-size: 12px; color: var(--text-2); }

  .dia { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 14px 4px 8px; font-weight: 700; font-size: 15px; }
  .dia span { color: var(--text-2); font-weight: 500; font-size: 13px; margin-left: 4px; }
  .liga-card { background: var(--panel); border-radius: 14px; overflow: hidden; margin-bottom: 10px; box-shadow: var(--sombra); }
  .liga-cab { display: flex; align-items: center; gap: 10px; padding: 11px 14px; font-weight: 700; font-size: 13px;
              border-bottom: 1px solid var(--border); }
  .liga-cab .n { margin-left: auto; color: var(--text-2); font-weight: 500; font-size: 12px; }
  .partido { display: grid; grid-template-columns: 1fr 70px 1fr; align-items: center; gap: 8px; width: 100%;
             border: 0; background: none; padding: 11px 12px; cursor: pointer; text-align: left; }
  .partido + .partido { border-top: 1px solid var(--border); }
  .partido:hover { background: var(--panel-2); }
  .partido.activo { background: var(--sel); box-shadow: inset 3px 0 0 var(--acento); }
  .partido .eq { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; font-weight: 500; }
  .partido .loc { justify-content: flex-end; text-align: right; }
  .partido .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .partido .centro { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
  .partido .marcador { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .partido .hora { font-weight: 600; font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .partido .st { font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .partido.envivo .marcador { color: var(--live); }
  .partido.envivo .st { color: var(--live); font-weight: 700; }
  .vivo { color: var(--live); font-weight: 700; }

  main { overflow-y: auto; padding: 20px 24px 40px; background: var(--panel); border-radius: 16px; box-shadow: var(--sombra); }
  .vacio { color: var(--text-2); padding: 48px 0; max-width: 46ch; }
  .meta { font-size: 13px; color: var(--text-2); }

  /* encabezado del partido */
  .encabezado { padding: 4px 0 18px; }
  .enc-meta { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--text-2); flex-wrap: wrap; }
  .enc-duelo { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; margin-top: 16px; }
  .enc-eq { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; font-weight: 700; font-size: 16px; min-width: 0; }
  .enc-centro { text-align: center; min-width: 110px; }
  .enc-res { font-weight: 800; font-size: 36px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .enc-hora { font-weight: 800; font-size: 28px; line-height: 1; }
  .enc-st { margin-top: 6px; font-size: 13px; color: var(--text-2); }
  .enc-st.vivo { color: var(--live); }

  .tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--border); margin-bottom: 18px; justify-content: center; }
  .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 2px 10px; cursor: pointer;
                 color: var(--text-2); margin-bottom: -1px; font-weight: 600; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--acento); }

  .hechos { display: flex; flex-direction: column; }
  .hecho { display: flex; align-items: center; justify-content: space-between; gap: 14px;
           padding: 12px 0; border-bottom: 1px solid var(--border); }
  .hecho:last-child { border-bottom: 0; }
  .hecho-izq { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hecho-ico { flex: none; display: block; }
  .hecho-txt { min-width: 0; line-height: 1.35; }
  .hecho-txt b { display: block; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hecho.gol .hecho-txt b .marcador { color: var(--acento); }
  .hecho-txt small { display: block; font-size: 12px; color: var(--text-2); }
  .hecho-min { flex: none; font-weight: 800; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .hecho-tarjeta { width: 12px; height: 16px; border-radius: 2px; flex: none; }
  .hecho-tarjeta.amarilla { background: var(--amarilla); }
  .hecho-tarjeta.roja { background: var(--live); }
  .hecho.cambio .hecho-cambio { display: flex; flex-direction: column; gap: 5px; }
  .hecho.cambio .fila { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .hecho.cambio .fila.entra { color: var(--acento); }
  .hecho.cambio .fila.sale { color: var(--live); }
  .hecho.visita { flex-direction: row-reverse; }
  .hecho.visita .hecho-izq { flex-direction: row-reverse; }
  .hecho.visita .hecho-txt, .hecho.visita .hecho-cambio { align-items: flex-end; text-align: right; }
  .hecho.visita .fila { flex-direction: row-reverse; }
  .hecho-mt { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 0;
              font-size: 13px; color: var(--text-2); font-weight: 600; }
  .hecho-mt .circulo { width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: var(--panel);
                       display: flex; align-items: center; justify-content: center; font: 800 11px var(--ui); flex: none; }

  .filtros { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; margin-bottom: 20px; }
  .filtros label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .filtros select { padding: 7px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); color: var(--text); font-weight: 500; }
  .filtros label.check { flex-direction: row; align-items: center; gap: 7px; color: var(--text); font-size: 13px; padding-bottom: 7px; }
  .seg { display: inline-flex; background: var(--panel-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 6px 14px; cursor: pointer; border-radius: 999px; font-weight: 600; color: var(--text-2); }
  .seg button.on { background: var(--acento); color: #fff; }

  /* ---------- panel del jugador ---------- */
  .jugador { display: grid; grid-template-columns: minmax(180px, 220px) 1fr; gap: 8px 28px; padding: 18px;
             background: var(--panel-2); border-radius: 14px; margin-bottom: 18px; }
  .jugador h3 { margin: 0; font: 800 22px/1.15 var(--display); letter-spacing: -.01em; }
  .jugador .pos { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .cifra { margin-top: 14px; }
  .cifra .v { font: 800 52px/1 var(--display); letter-spacing: -.03em; color: var(--acento); }
  .cifra .k { font-size: 13px; color: var(--text-2); margin-top: 4px; }
  .cifras-chicas { display: flex; gap: 22px; margin-top: 14px; }
  .cifras-chicas .v { font: 800 22px/1 var(--display); }
  .cifras-chicas .k { font-size: 12px; color: var(--text-2); }
  .nota { font-size: 13px; color: var(--text-2); margin: 0 0 6px; }
  .leyenda { display: flex; gap: 16px; font-size: 12px; color: var(--text-2); margin: 0 0 4px; flex-wrap: wrap; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .leyenda .dash { width: 16px; height: 0; border-top: 2px dashed var(--text); border-radius: 0; vertical-align: 3px; }

  /* ---------- claves para el partido ---------- */
  .claves { border: 1px solid var(--acento); border-radius: 14px; background: var(--panel-2); margin: 0 0 16px; overflow: hidden; }
  .claves-cab { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 12px 14px; cursor: pointer; text-align: left; }
  .claves-cab .tit { font-weight: 800; font-size: 15px; white-space: nowrap; }
  .claves-cab .sub { font-size: 11px; color: var(--text-2); line-height: 1.3; flex: 1; min-width: 0; }
  .claves-cab .flecha { color: var(--text-2); transition: transform .2s; flex: none; }
  .claves.plegada .flecha { transform: rotate(-90deg); }
  .claves.plegada .claves-cuerpo { display: none; }
  .claves-tira { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .claves-tira::-webkit-scrollbar { display: none; }
  .clave { flex: 0 0 100%; scroll-snap-align: start; padding: 0 14px 4px; display: flex; flex-direction: column; }
  .clave p { margin: 0 0 12px; line-height: 1.5; }
  .clave .mercado { font-weight: 700; margin: auto 0 8px; }
  .clave .pick-clave { background: var(--panel); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: center; align-items: baseline;
                       gap: 10px; flex-wrap: wrap; }
  .clave .pick-clave b { font-size: 16px; font-weight: 600; }
  .clave .pick-clave span { color: var(--acento); font-weight: 700; font-size: 13px; }
  .claves-puntos { display: flex; justify-content: center; gap: 7px; padding: 10px 0 12px; }
  .claves-puntos button { width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0; background: var(--miss); cursor: pointer; }
  .claves-puntos button.on { background: var(--acento); }
  .claves-nota { font-size: 11px; color: var(--text-2); text-align: center; padding: 0 14px 12px; margin: 0; }

  /* ---------- remates por jugador ---------- */
  .remates { --rem: #7F77DD; --rem-caja: #5148b5; max-width: 560px; margin: 0 auto; }
  .rem-eqs { display: flex; width: 100%; margin-bottom: 14px; }
  .rem-eqs button { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rem-lista { display: flex; flex-direction: column; background: var(--panel-2); border-radius: 14px; overflow: hidden; }
  .rem-partido { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; text-align: left;
                 background: none; border: 0; border-bottom: 1px solid var(--border); padding: 12px 14px; cursor: pointer; width: 100%; }
  .rem-partido:last-child { border-bottom: 0; }
  .rem-partido:hover { background: var(--sel); }
  .rem-partido b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rem-partido .meta { grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rem-partido .chev { grid-row: 1 / 3; grid-column: 2; display: flex; align-items: center; gap: 10px; color: var(--text-2); }
  .rem-partido.suma b { color: var(--acento); }
  .rem-res { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #fff; }
  .rem-res.G { background: #1f9d55; } .rem-res.E { background: #6b6b6b; } .rem-res.P { background: #d64545; }
  .rem-volver { background: var(--panel-2); border: 0; border-radius: 999px; padding: 7px 14px; margin-bottom: 12px; cursor: pointer; font-weight: 600; }
  .rem-titulo { font-weight: 700; margin: 0 0 2px; }
  .rem-metricas { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 14px; }
  .rem-metricas button { border: 0; background: var(--panel-2); color: var(--text-2); padding: 6px 12px; border-radius: 999px;
                         font-weight: 600; font-size: 13px; cursor: pointer; }
  .rem-metricas button.on { background: var(--rem); color: #fff; }
  .rem-total { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; color: var(--text-2); font-size: 13px; }
  .rem-total b { font: 800 34px/1 var(--display); color: var(--rem); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .rem-filas { display: flex; flex-direction: column; gap: 6px; }
  .rem-fila { display: grid; grid-template-columns: minmax(0, 38%) 32px minmax(0, 1fr); gap: 8px; align-items: center; }
  .rem-nombre { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .rem-caja { height: 26px; border-radius: 6px; background: var(--rem-caja); color: #fff; display: grid; place-items: center;
              font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .rem-barra { height: 10px; border-radius: 5px; background: var(--rem); }
  .rem-fila.cero .rem-nombre { color: var(--text-2); font-weight: 500; }
  .rem-fila.cero .rem-caja { background: var(--miss); color: var(--text-2); }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--text-2); font: 12px var(--ui); }
  .chart text.linea { fill: var(--text); font-weight: 700; }
  details summary { cursor: pointer; color: var(--text-2); font-size: 13px; margin-top: 8px; }
  @media (max-width: 760px) { .jugador { grid-template-columns: 1fr; } }

  .comparativa { margin-bottom: 24px; padding: 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel-2); }
  .comparativa h4 { margin: 0 0 12px; }
  .comparativa .filtros { margin-bottom: 14px; }
  .comparativa-frase { font-size: 15px; margin: 0 0 12px; }
  .comparativa-frase b { color: var(--acento); }

  /* ---------- mi talón ---------- */
  .btn-top { background: rgba(255,255,255,.1); color: #fff; border: 0; border-radius: 999px;
             padding: 8px 14px; font-weight: 600; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
  .btn-top:hover { background: rgba(255,255,255,.16); }
  .btn-top .cuenta { background: var(--acento); border-radius: 999px; padding: 1px 7px; font-size: 12px; font-weight: 800; }
  .btn-top .cuenta:empty, .btn-top .cuenta[hidden] { display: none; }
  .acciones-top { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .acciones-top .musica { margin-left: 0; }
  .guardar-pick { margin-top: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
                  padding: 8px 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }

    <label class="buscador"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg><input id="buscar" type="search" placeholder="Buscar equipo o liga" aria-label="Buscar equipo o liga"></label>
    <div class="acciones-top">
      <button id="irTalon" class="btn-top" title="Mi talón"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5h10v13l-2-1.3-1.7 1.3L8 13.2 6.3 14.5 4.6 13.2 3 14.5z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.8 5.5h4.4M5.8 8.3h4.4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg><span class="txt">Mi talón</span><span class="cuenta" id="cuentaTalon" hidden></span></button>
      <button id="musicaBtn" class="musica" aria-pressed="false">Poner música</button>
    </div>
    <audio id="musica" src="cancion.mp3" loop preload="none"></audio>
  </div>
</header>
<div class="franja"><nav class="destacados" id="destacados" aria-label="Partidos destacados"></nav></div>
<div class="layout">
  <aside>
    <section class="picks-movil" id="picksMovil"></section>
    <div class="card panel-carga">
      <div class="fechas"><label>Desde <input type="date" id="desde"></label><label>Hasta <input type="date" id="hasta"></label></div>
      <label>Ligas <select id="grupo"></select></label>
      <div class="fila-cargar"><button id="cargar">Cargar partidos</button><span id="estado" role="status"></span></div>
      <select id="filtroLiga" aria-label="Filtrar por liga"><option value="">Todas las ligas cargadas</option></select>
    </div>
    <div id="lista"><div class="vacio">Cargando partidos…</div></div>
  </aside>
  <main id="detalle"><div class="vacio">Elegí un partido de la lista para ver la forma de cada jugador.</div></main>
</div>
<div class="tip" id="tip"></div>
<script>
// Datos: API pública de ESPN, pedida directamente desde el navegador.
const API = "https://site.api.espn.com/apis/site/v2";
const API_ATLETA = "https://site.web.api.espn.com/apis/common/v3/sports/soccer/athletes";
const PRINCIPALES = [
  "uefa.nations", "concacaf.nations.league", "fifa.friendly", "conmebol.america", "uefa.euroq",
  "uefa.champions", "uefa.europa", "uefa.europa.conf", "conmebol.libertadores", "conmebol.sudamericana",
  "arg.1", "arg.copa", "arg.2", "bra.1", "bra.copa_do_brazil", "chi.1", "col.1", "uru.1", "par.1", "per.1", "ecu.1",
  "eng.1", "eng.2", "eng.fa", "eng.league_cup", "esp.1", "esp.2", "esp.copa_del_rey",
  "ita.1", "ita.2", "ger.1", "ger.2", "fra.1", "fra.2", "por.1", "ned.1", "bel.1", "tur.1", "sco.1",
  "usa.1", "mex.1", "ksa.1",
];
const STATS = {
  totalShots: "tiros", shotsOnTarget: "tiros_al_arco", foulsCommitted: "faltas_cometidas",
  foulsSuffered: "faltas_recibidas", yellowCards: "amarillas", redCards: "rojas", totalGoals: "goles",
  goalAssists: "asistencias", offsides: "offsides", saves: "atajadas",
};
const NOMBRE_STAT = {
  tiros: "Tiros", tiros_al_arco: "Tiros al arco", faltas_cometidas: "Faltas cometidas",
  faltas_recibidas: "Faltas recibidas", goles: "Goles", asistencias: "Asistencias",
  amarillas: "Amarillas", offsides: "Offsides", atajadas: "Atajadas",
};
const COLS_PARTIDO = [
  ["jugador", "Jugador"], ["posicion", "Pos"], ["minutos", "Min"],
  ["tiros", "Tiros"], ["tiros_al_arco", "Al arco"], ["faltas_cometidas", "Faltas com."], ["faltas_recibidas", "Faltas rec."],
  ["goles", "Goles"], ["asistencias", "Asist."], ["amarillas", "Amar."], ["rojas", "Rojas"], ["offsides", "Offs."], ["atajadas", "Ataj."],
];
const DETALLE_ES = { Scheduled: "Programado", FT: "Final", HT: "Entretiempo", AET: "Final con alargue", Postponed: "Postergado",
                     Canceled: "Cancelado", Abandoned: "Suspendido", "FT-Pens": "Final por penales", Delayed: "Demorado" };
const MAX_DIAS = 7, CONCURRENCIA = 4;

const $ = id => document.getElementById(id);
const fmtDia = new Intl.DateTimeFormat("es-AR", { weekday: "long", day: "numeric", month: "long" });
const fmtHora = new Intl.DateTimeFormat("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false });
const fmtCorta = new Intl.DateTimeFormat("es-AR", { day: "numeric", month: "numeric" });
const fmtLarga = new Intl.DateTimeFormat("es-AR", { day: "numeric", month: "short", year: "numeric" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
const isoLocal = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };
const r1 = x => (Math.round(x * 10) / 10).toLocaleString("es-AR");

// ---------- estado ----------
let partidos = [], activo = null;
const resumenes = {}, equipos = {}, atletas = {};
const vista = { tab: null, lado: "home", stat: "tiros", linea: 0.5, n: 10, soloTitular: false, jugador: null,
                favorContra: "favor", sedeEq: "todos", rivalEq: "",
                ordenPlantel: { col: "prom", asc: false }, ordenPartido: { col: "tiros", asc: false },
                remLado: "home", remSel: null, remMetrica: "tiros" };

// ---------- red ----------
async function getJSON(url, intentos = 3) {
  for (let i = 1; ; i++) {
    try {
      const r = await fetch(url.startsWith("http") ? url : API + url);
      if (r.ok) return await r.json();
      if (r.status === 400 || r.status === 404) return {};
      throw new Error("HTTP " + r.status);
    } catch (e) {
      if (i >= intentos) throw e;
      await new Promise(res => setTimeout(res, 1000 * 2 ** i));
    }
  }
}

async function enParalelo(tareas, n, alAvanzar) {
  let i = 0, hechas = 0;
  const res = [];
  await Promise.all(Array.from({ length: n }, async () => {
    while (i < tareas.length) {
      const k = i++;
      try { res[k] = await tareas[k](); } catch { res[k] = null; }
      alAvanzar?.(++hechas, tareas.length);
    }
  }));
  return res;
}

// ---------- lista de partidos ----------
async function cargarPartidos() {
  const desde = new Date($("desde").value + "T12:00"), hasta = new Date($("hasta").value + "T12:00");
  const dias = [];
  for (let d = new Date(desde); d <= hasta && dias.length < MAX_DIAS; d.setDate(d.getDate() + 1)) dias.push(new Date(d));
  if (!dias.length) { $("estado").textContent = "La fecha “desde” tiene que ser anterior a “hasta”."; return; }
  const ligas = $("grupo").value === "principales" ? PRINCIPALES : [$("grupo").value];
  $("cargar").disabled = true;
  const tareas = [];
  for (const d of dias) for (const l of ligas)
    tareas.push(() => getJSON(`/sports/soccer/${l}/scoreboard?dates=${isoLocal(d).replaceAll("-", "")}`).then(j => [l, j]));
  const res = await enParalelo(tareas, CONCURRENCIA, (h, t) => $("estado").textContent = `Buscando partidos (${h} de ${t})`);
  const vistos = new Map();
  let errores = 0;
  for (const r of res) {
    if (!r) { errores++; continue; }
    const [liga, j] = r;
    const nombre = j.leagues?.[0]?.name || liga;
    for (const ev of j.events || []) {
      const c = ev.competitions[0], eq = Object.fromEntries(c.competitors.map(x => [x.homeAway, x]));
      const st = c.status.type;
      vistos.set(ev.id, {
        id: ev.id, fecha: ev.date, liga, liga_nombre: nombre,
        local: eq.home.team.displayName, visitante: eq.away.team.displayName,
        homeId: eq.home.team.id, awayId: eq.away.team.id,
        logoL: eq.home.team.logo, logoV: eq.away.team.logo, ligaLogo: j.leagues?.[0]?.logos?.[0]?.href,
        gl: eq.home.score, gv: eq.away.score, estado: st.state, detalle: DETALLE_ES[st.shortDetail] || st.shortDetail,
      });
    }
  }
  partidos = [...vistos.values()].sort((a, b) => a.fecha.localeCompare(b.fecha));
  const sel = $("filtroLiga"), prev = sel.value;
  sel.innerHTML = `<option value="">Todas las ligas cargadas</option>` +
    [...new Map(partidos.map(p => [p.liga, p.liga_nombre]))].sort((a, b) => a[1].localeCompare(b[1]))
      .map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join("");
  sel.value = [...sel.options].some(o => o.value === prev) ? prev : "";
  $("estado").textContent = `${partidos.length} partidos` + (errores ? `, ${errores} ligas no respondieron (probá cargar de nuevo)` : "");
  $("cargar").disabled = false;
  pintarLista();
  pintarDestacados();
  if (!activo || esAngosto()) pintarInicio();
}

const cap = t => t ? t[0].toUpperCase() + t.slice(1) : t;
const escudo = (url, cls = "esc") => url
  ? `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
  : `<span class="${cls} esc-ph" aria-hidden="true"></span>`;
const sinMarcador = p => /Postergado|Cancelado/.test(p.detalle || "");

function filaPartido(p) {
  const f = new Date(p.fecha), vivo = p.estado === "in", jugado = p.estado !== "pre" && !sinMarcador(p);
  const centro = jugado
    ? `<span class="marcador">${esc(p.gl)} - ${esc(p.gv)}</span><span class="st">${esc(p.detalle)}</span>`
    : sinMarcador(p) ? `<span class="hora">–</span><span class="st">${esc(p.detalle)}</span>`
    : `<span class="hora">${fmtHora.format(f)}</span>`;
  return `<button class="partido${p.id === activo ? " activo" : ""}${vivo ? " envivo" : ""}" data-id="${esc(p.id)}">
    <span class="eq loc"><span class="nom">${esc(p.local)}</span>${escudo(p.logoL)}</span>
    <span class="centro">${centro}</span>
    <span class="eq vis">${escudo(p.logoV)}<span class="nom">${esc(p.visitante)}</span></span></button>`;
}

function pintarLista() {
  const q = norm($("buscar").value).trim(), liga = $("filtroLiga").value;
  const ps = partidos.filter(p => (!liga || p.liga === liga) &&
    (!q || q.split(/\s+/).every(t => norm(`${p.local} ${p.visitante} ${p.liga_nombre}`).includes(t))));
  // por día y, dentro de cada día, por liga (las más importantes primero)
  const dias = new Map();
  for (const p of ps) {
    const k = isoLocal(new Date(p.fecha));
    if (!dias.has(k)) dias.set(k, new Map());
    const ls = dias.get(k);
    if (!ls.has(p.liga)) ls.set(p.liga, []);
    ls.get(p.liga).push(p);
  }
  const hoy = new Date(isoLocal(new Date()) + "T12:00");
  let html = "";
  for (const [k, ligas] of dias) {
    const f = new Date(k + "T12:00"), dif = Math.round((f - hoy) / 864e5);
    const rel = { 0: "Hoy", "-1": "Ayer", 1: "Mañana" }[dif];
    html += `<div class="dia">${rel ? `${rel}<span>${esc(fmtDia.format(f))}</span>` : esc(cap(fmtDia.format(f)))}</div>`;
    const orden = [...ligas.values()].sort((a, b) => (PESO_LIGA[b[0].liga] ?? 2) - (PESO_LIGA[a[0].liga] ?? 2)
      || a[0].liga_nombre.localeCompare(b[0].liga_nombre));
    for (const lps of orden) {
      html += `<section class="liga-card"><div class="liga-cab">${escudo(lps[0].ligaLogo, "esc-liga")}<span>${esc(lps[0].liga_nombre)}</span>
        <span class="n">${lps.length}</span></div>${lps.map(filaPartido).join("")}</section>`;
    }
  }
  $("lista").innerHTML = html || `<div class="vacio">${partidos.length ? "Ningún partido coincide con la búsqueda." : "No hay partidos en esas fechas. Probá con otro rango o con todas las ligas principales."}</div>`;
}

// ---------- destacados: acceso rápido a los partidos más convocantes ----------
// ESPN no publica popularidad: se puntúa por liga, por equipos grandes y por cercanía (en juego > hoy > próximos).
const PESO_LIGA = {
  "uefa.champions": 10, "conmebol.libertadores": 9, "conmebol.america": 9, "eng.1": 9, "esp.1": 9, "arg.1": 8,
  "ita.1": 7, "ger.1": 7, "arg.copa": 7, "uefa.nations": 6, "uefa.europa": 6, "conmebol.sudamericana": 6,
  "fra.1": 6, "bra.1": 8, "bra.copa_do_brazil": 6, "uefa.euroq": 6, "fifa.friendly": 5, "por.1": 5, "esp.copa_del_rey": 5, "eng.fa": 5,
  "usa.1": 4, "mex.1": 4, "ned.1": 4,
};
const EQUIPOS_GRANDES = [
  "argentina", "brazil", "france", "england", "spain", "germany", "portugal", "italy", "netherlands", "uruguay", "belgium", "croatia",
  "real madrid", "barcelona", "atletico madrid", "manchester city", "liverpool", "arsenal", "manchester united", "chelsea", "tottenham",
  "bayern munich", "borussia dortmund", "paris saint-germain", "juventus", "internazionale", "ac milan", "napoli",
  "boca juniors", "river plate", "racing club", "independiente", "san lorenzo", "estudiantes", "velez", "flamengo", "palmeiras",
  "inter miami", "benfica", "porto", "sporting",
];
const esGrande = nombre => { const n = norm(nombre); return EQUIPOS_GRANDES.some(e => n === e || n.startsWith(e + " ")); };

// Siempre tienen lugar en destacados (si hay partido en las fechas cargadas), en este orden.
const EQUIPOS_FIJOS = ["boca juniors"];
const LIGAS_FIJAS = [
  ["arg.1", "arg.copa"],                      // Liga Profesional (y Copa Argentina)
  ["eng.1"],                                  // Premier League
  ["bra.1", "bra.copa_do_brazil"],            // fútbol de Brasil
];

function destacados(max = 8) {
  const hoy = isoLocal(new Date());
  const puntaje = p => {
    const dia = isoLocal(new Date(p.fecha));
    let s = PESO_LIGA[p.liga] ?? 2;
    s += (esGrande(p.local) ? 6 : 0) + (esGrande(p.visitante) ? 6 : 0);
    if (p.estado === "in") s += 10;
    else if (p.estado === "pre") s += dia === hoy ? 5 : 1;
    else s += dia === hoy ? 0 : -6;
    return s;
  };
  const ranking = [...partidos].map(p => [puntaje(p), p])
    .sort((a, b) => b[0] - a[0] || a[1].fecha.localeCompare(b[1].fecha)).map(([, p]) => p);
  const elegidos = [];
  const sumar = p => { if (p && !elegidos.includes(p) && elegidos.length < max) elegidos.push(p); };
  // 1) partidos de los equipos fijos; 2) el mejor de cada liga fija; 3) el resto por puntaje.
  for (const eq of EQUIPOS_FIJOS) sumar(ranking.find(p => [p.local, p.visitante].some(n => norm(n).startsWith(eq))));
  for (const ligas of LIGAS_FIJAS) sumar(ranking.find(p => ligas.includes(p.liga) && !elegidos.includes(p)));
  for (const p of ranking) sumar(p);
  return elegidos;
}

function pintarDestacados() {
  const ps = destacados();
  if (!ps.length) { $("destacados").innerHTML = ""; return; }
  const hoy = isoLocal(new Date());
  $("destacados").innerHTML = ps.map(p => {
    const f = new Date(p.fecha), jugado = p.estado !== "pre" && !sinMarcador(p);
    const cuando = p.estado === "in" ? `<span class="r-vivo"><i aria-hidden="true"></i>${esc(p.detalle)}</span>`
      : p.estado === "post" ? `<span class="r-cuando">${esc(p.detalle)}</span>`
      : `<span class="r-cuando">${isoLocal(f) === hoy ? "Hoy" : esc(fmtCorta.format(f))} ${fmtHora.format(f)}</span>`;
    return `<button class="rapido${p.id === activo ? " activo" : ""}" data-id="${esc(p.id)}"
      title="${esc(p.local)} contra ${esc(p.visitante)}, ${esc(p.liga_nombre)}">
      <span class="r-cab"><span class="r-liga">${esc(p.liga_nombre)}</span>${cuando}</span>
      <span class="r-eq">${escudo(p.logoL)}<span class="nom">${esc(p.local)}</span>${jugado ? `<b>${esc(p.gl)}</b>` : ""}</span>
      <span class="r-eq">${escudo(p.logoV)}<span class="nom">${esc(p.visitante)}</span>${jugado ? `<b>${esc(p.gv)}</b>` : ""}</span></button>`;
  }).join("");
}

function abrirPartido(id) {
  verTalon = false;
  if (activo !== id) { vista.jugador = null; vista.lado = "home"; vista.tab = null; vista.rivalEq = ""; vista.sedeEq = "todos";
                       vista.remLado = "home"; vista.remSel = null; }
  activo = id;
  if (!$("lista").querySelector(`.partido[data-id="${CSS.escape(id)}"]`)) { $("buscar").value = ""; $("filtroLiga").value = ""; }
  document.body.classList.add("ver-detalle");
  pintarLista(); pintarDestacados(); pintarDetalle();
  if (esAngosto()) $("detalle").scrollIntoView({ block: "start" });
  else $("lista").querySelector(".partido.activo")?.scrollIntoView({ block: "nearest" });
}

function volverALista() {
  document.body.classList.remove("ver-detalle");
  $("lista").querySelector(".partido.activo")?.scrollIntoView({ block: "center" });
}

// ---------- ficha de un partido (summary) ----------
const minuto = t => { const n = (t || "").match(/\d+/g); return n ? n.reduce((a, b) => a + +b, 0) : null; };

function parsearResumen(id, d) {
  const comp = d.header?.competitions?.[0] || {};
  const cs = comp.competitors || [];
  const home = cs.find(c => c.homeAway === "home") || {}, away = cs.find(c => c.homeAway === "away") || {};
  const fin = (comp.status?.period || 2) > 2 ? 120 : 90;
  const entra = {}, sale = {};
  for (const k of d.keyEvents || []) {
    if (!/substitution/i.test(k.type?.text || "")) continue;
    const p = (k.participants || []).map(x => x.athlete.id);
    let m = minuto(k.clock?.displayValue);
    if (m == null || p.length !== 2) continue;
    m = Math.min(m, fin);
    entra[p[0]] = m; sale[p[1]] = m;
  }
  const meta = {
    id, fecha: comp.date, comp: d.header?.league?.name || "",
    homeId: home.team?.id, awayId: away.team?.id, local: home.team?.displayName, visitante: away.team?.displayName,
    gl: home.score, gv: away.score, terminado: !!comp.status?.type?.completed,
  };
  const eventos = [];
  { let gl = 0, gv = 0;
    for (const k of d.keyEvents || []) {
      const tipo = k.type?.type || "", m = k.clock?.displayValue || "", ps = k.participants || [];
      if (k.scoringPlay) {
        if (k.team?.id === meta.homeId) gl++; else if (k.team?.id === meta.awayId) gv++;
        eventos.push({ tipo: tipo === "own-goal" ? "autogol" : "gol", minuto: m, equipoId: k.team?.id,
          jugador: ps[0]?.athlete?.displayName || "", asistencia: tipo === "own-goal" ? null : (ps[1]?.athlete?.displayName || null),
          marcador: `${gl}-${gv}` });
      } else if (tipo === "yellow-card" || tipo === "red-card") {
        eventos.push({ tipo: tipo === "yellow-card" ? "amarilla" : "roja", minuto: m, equipoId: k.team?.id,
          jugador: ps[0]?.athlete?.displayName || "", doble: /second yellow/i.test(k.text || "") });
      } else if (tipo === "substitution" && ps.length === 2) {
        eventos.push({ tipo: "cambio", minuto: m, equipoId: k.team?.id,
          jugador: ps[0]?.athlete?.displayName || "", saliente: ps[1]?.athlete?.displayName || "" });
      } else if (tipo === "halftime") {
        const add = k.clock?.value > 2700 ? Math.round((k.clock.value - 2700) / 60) : 0;
        eventos.push({ tipo: "entretiempo", marcador: `${gl}-${gv}`, añadidos: add });
      }
    }
  }
  const filas = [], convocados = {}, formaciones = {}, colores = {};
  for (const c of cs) if (c.team?.id) colores[c.team.id] = [c.team.color, c.team.alternateColor];
  for (const eq of d.rosters || []) {
    const tid = eq.team.id;
    convocados[tid] = [];
    formaciones[tid] = eq.formation || null;
    for (const p of eq.roster || []) {
      const aid = p.athlete.id;
      const jerseys = p.athlete.jerseyImages || [];
      convocados[tid].push({ id: aid, nombre: p.athlete.displayName, corto: p.athlete.shortName || p.athlete.displayName,
        pos: p.position?.abbreviation, titular: !!p.starter, dorsal: p.jersey, lugar: +p.formationPlace || 99,
        camiseta: (jerseys.find(x => (x.rel || []).includes("dark")) || jerseys[0])?.href || null });
      const st = Object.fromEntries((p.stats || []).map(s => [s.name, s.value]));
      if (!(p.starter || p.subbedIn || st.appearances > 0)) continue;
      const ini = p.starter ? 0 : entra[aid];
      const fj = p.subbedOut ? (sale[aid] ?? fin) : fin;
      const f = {
        teamId: tid, equipo: eq.team.displayName, athleteId: aid, jugador: p.athlete.displayName,
        titular: !!p.starter, posicion: p.position?.abbreviation, minutos: ini == null ? null : Math.max(fj - ini, 1),
      };
      for (const [k, c] of Object.entries(STATS)) f[c] = st[k] ?? null;
      filas.push(f);
    }
  }
  return { meta, filas, convocados, formaciones, colores, eventos };
}

function resumen(id, forzar = false) {
  if (!resumenes[id] || forzar) {
    resumenes[id] = getJSON(`/sports/soccer/all/summary?event=${id}`).then(d => {
      const r = parsearResumen(id, d);
      if (!r.meta.terminado) setTimeout(() => delete resumenes[id], 60e3);
      return r;
    }).catch(e => { delete resumenes[id]; throw e; });
  }
  return resumenes[id];
}

// ---------- forma de un equipo ----------
function formaEquipo(teamId, antesDe, n) {
  const clave = `${teamId}|${antesDe}|${n}`;
  return equipos[clave] ??= (async () => {
    const corte = new Date(antesDe).getTime();
    let previos = [];
    let sch = await getJSON(`/sports/soccer/all/teams/${teamId}/schedule`);
    // A algunos equipos (ej. São Paulo) ESPN les devuelve el calendario vacío si no se pide la temporada
    if (!sch.requestedSeason && !(sch.events || []).length) {
      sch = await getJSON(`/sports/soccer/all/teams/${teamId}/schedule?season=${new Date(antesDe).getUTCFullYear()}`);
    }
    const agregar = s => previos.push(...(s.events || []).filter(e =>
      e.competitions?.[0]?.status?.type?.completed && new Date(e.date).getTime() < corte));
    agregar(sch);
    if (previos.length < n && sch.requestedSeason?.year) {
      agregar(await getJSON(`/sports/soccer/all/teams/${teamId}/schedule?season=${sch.requestedSeason.year - 1}`));
    }
    previos = [...new Map(previos.map(e => [e.id, e])).values()]
      .sort((a, b) => b.date.localeCompare(a.date)).slice(0, n);
    const rs = await enParalelo(previos.map(e => () => resumen(e.id)), CONCURRENCIA);
    const partidosEq = [], jugadores = new Map(), planteles = [];
    for (const r of rs) {
      if (!r) continue;
      const m = r.meta, esLocal = m.homeId === teamId;
      const favor = {}, contra = {};
      for (const c of Object.values(STATS)) {
        favor[c] = r.filas.filter(f => f.teamId === teamId).reduce((s, f) => s + (f[c] || 0), 0);
        contra[c] = r.filas.filter(f => f.teamId !== teamId).reduce((s, f) => s + (f[c] || 0), 0);
      }
      partidosEq.push({ ...m, esLocal, favor, contra,
        rival: esLocal ? m.visitante : m.local, rivalId: esLocal ? m.awayId : m.homeId });
      const conv = r.convocados?.[teamId] || [];
      planteles.push({ id: m.id, fecha: m.fecha, comp: m.comp, conocido: conv.length >= 11, conv: new Set(conv.map(c => c.id)) });
      for (const f of r.filas.filter(f => f.teamId === teamId)) {
        let j = jugadores.get(f.athleteId);
        if (!j) jugadores.set(f.athleteId, j = { id: f.athleteId, nombre: f.jugador, pos: f.posicion, partidos: [] });
        if (f.posicion && f.posicion !== "SUB") j.pos = j.pos && j.pos !== "SUB" ? j.pos : f.posicion;
        j.partidos.push({
          eventId: m.id, fecha: m.fecha, comp: m.comp, rival: esLocal ? m.visitante : m.local,
          condicion: esLocal ? "L" : "V", resultado: `${m.gl}-${m.gv}`, minutos: f.minutos, titular: f.titular,
          stats: Object.fromEntries(Object.values(STATS).map(c => [c, f[c]])),
        });
      }
    }
    return { partidos: partidosEq, jugadores, planteles };
  })().catch(e => { delete equipos[clave]; throw e; });
}

// ---------- avisos del plantel (deducidos: ESPN no publica lesionados de fútbol) ----------
// Devuelve Map(jugadorId → [{ tipo, texto }]). Tipos: baja, susp, rotar, volvio, hoy, banco.
const ORDEN_AVISO = { baja: 0, susp: 1, banco: 2, rotar: 3, volvio: 4, hoy: 5 };
const NOMBRE_AVISO = { baja: "Posible baja", susp: "Suspendido", rotar: "Puede rotar", volvio: "Volvió", hoy: "Convocado", banco: "Suplente hoy" };
function avisosEquipo(teamId, forma, actual, fechaPartido, compPartido) {
  const res = new Map();
  const add = (id, tipo, texto) => { if (!res.has(id)) res.set(id, []); res.get(id).push({ tipo, texto }); };
  const todos = forma.planteles || [];
  if (!todos.length) return res;
  const pl = todos.filter(x => x.conocido).length ? todos.filter(x => x.conocido) : todos;  // partidos con lista de convocados
  const ult5 = pl.slice(0, 5).map(x => x.id);
  const conv = actual?.convocados?.[teamId] || [];
  const confirmada = conv.filter(c => c.titular).length >= 11;
  const convHoy = new Map(conv.map(c => [c.id, c]));
  const dias = (a, b) => (new Date(a) - new Date(b)) / 864e5;
  const diasDesdeUlt = dias(fechaPartido, todos[0].fecha);

  for (const j of forma.jugadores.values()) {
    const porEv = new Map(j.partidos.map(x => [x.eventId, x]));
    const titulares5 = ult5.filter(id => porEv.get(id)?.titular).length;
    const habitual = titulares5 >= 3 || (titulares5 >= 2 && ult5.length <= 3);
    // partidos seguidos (desde el último) en los que no estuvo en la lista, contando solo listas conocidas
    let ausencias = 0;
    for (const x of pl) { if (!x.conocido) break; if (x.conv.has(j.id)) break; ausencias++; }
    const hoy = convHoy.get(j.id);

    if (confirmada) {
      if (hoy?.titular) add(j.id, "hoy", "Titular confirmado");
      else if (hoy) { if (habitual) add(j.id, "banco", "Suele ser titular y hoy arranca en el banco"); }
      else if (habitual) add(j.id, "baja", "Suele ser titular y no está en la lista de hoy");
    } else if (conv.length >= 11 && habitual) {  // ESPN publicó convocados pero todavía no el 11
      if (hoy) { if (ausencias > 0) add(j.id, "hoy", "Venía faltando y está en la lista de convocados de hoy"); }
      else add(j.id, "baja", "Suele ser titular y no está en la lista de convocados de hoy");
    } else if (habitual && ausencias > 0) {
      add(j.id, "baja", ausencias >= 4 ? `No está en la lista hace ${ausencias} partidos (lesión larga, sanción o salida del club)`
        : ausencias === 1 ? "Era titular fijo y no estuvo en la lista del último partido"
        : `Era titular fijo y faltó a los últimos ${ausencias} partidos`);
    } else if (pl[1]?.conocido && pl[0].conocido && pl[0].conv.has(j.id) && !pl[1].conv.has(j.id)) {
      const previos = pl.slice(2, 6).filter(x => porEv.get(x.id)?.titular).length;
      if (previos >= 2) add(j.id, "volvio", porEv.get(pl[0].id) ? "Volvió a jugar el último partido después de faltar" : "Volvió a la lista en el último partido");
    }

    const ult = porEv.get(todos[0].id) || porEv.get(pl[0].id);
    if (ult?.stats?.rojas > 0) add(j.id, "susp", "Lo expulsaron en el último partido: probablemente cumpla fecha");
    const amarillasComp = j.partidos.filter(x => x.comp === compPartido).slice(0, 6).reduce((a, x) => a + (x.stats.amarillas || 0), 0);
    if (amarillasComp >= 4) add(j.id, "susp", `${amarillasComp} amarillas en sus últimos partidos de ${compPartido}: en riesgo de suspensión (depende del reglamento)`);

    if (!confirmada && ult && diasDesdeUlt <= 3.5 && (ult.minutos ?? 0) >= 80)
      add(j.id, "rotar", `Jugó ${ult.minutos}' hace ${Math.max(1, Math.round(diasDesdeUlt))} días`);
    else if (!confirmada) {
      const min7 = j.partidos.filter(x => dias(fechaPartido, x.fecha) <= 8).reduce((a, x) => a + (x.minutos || 0), 0);
      if (min7 >= 200) add(j.id, "rotar", `Lleva ${min7}' en los últimos 8 días`);
    }
  }
  // convocados hoy que no venían jugando (o vuelven de una baja)
  if (confirmada) for (const c of conv) if (!res.has(c.id) && !forma.jugadores.has(c.id) && c.titular) add(c.id, "hoy", "Titular confirmado");
  for (const l of res.values()) l.sort((a, b) => ORDEN_AVISO[a.tipo] - ORDEN_AVISO[b.tipo]);
  return res;
}
const etiquetaAviso = a => `<span class="aviso a-${a.tipo}" title="${esc(a.texto)}">${NOMBRE_AVISO[a.tipo]}</span>`;

const cuotaJusta = prob => prob > 0 ? (1 / prob).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "–";
const textoMercado = () => `Más de ${r1(vista.linea)} ${NOMBRE_STAT[vista.stat].toLowerCase()}`;

// ---------- mi talón: picks guardados en este navegador ----------
const CLAVE_PICKS = "laoficina.picks", CLAVE_MONTO = "laoficina.monto";
let misPicks = [], montoTalon = 1000, verTalon = false, pickVisible = null;
try { misPicks = JSON.parse(localStorage.getItem(CLAVE_PICKS)) || []; } catch {}
try { montoTalon = +localStorage.getItem(CLAVE_MONTO) || 1000; } catch {}
const guardarEnDisco = () => { try {
  localStorage.setItem(CLAVE_PICKS, JSON.stringify(misPicks));
  localStorage.setItem(CLAVE_MONTO, String(montoTalon));
} catch {} };
const mercadoPick = k => `Más de ${r1(k.linea)} ${NOMBRE_STAT[k.stat].toLowerCase()}`;
const aCuota = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return Number.isFinite(n) && n > 1 ? n : null; };
const fmt2 = x => x.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function actualizarCuentaTalon() {
  const el = $("cuentaTalon");

// Arma el pick con lo que el usuario está mirando: jugador, estadística y línea elegidas.
function pickDesdeVista(j, r) {
  const p = partidos.find(x => x.id === activo);
  if (!p || !j) return null;
  const esLocal = vista.lado === "home";
  return {
    id: `${p.id}|${j.id}|${vista.stat}|${vista.linea}`,
    partidoId: p.id, jugadorId: j.id, jugador: j.nombre,
    equipo: esLocal ? p.local : p.visitante, rival: esLocal ? p.visitante : p.local,
    liga: p.liga_nombre, fecha: p.fecha, stat: vista.stat, linea: vista.linea,
    pct: r.pct, sup: r.sup, n: r.n, prom: r.prom, cuota: null,

}

function alternarPickVisible() {
  if (!pickVisible) return;
  const i = misPicks.findIndex(x => x.id === pickVisible.id);
  if (i >= 0) misPicks.splice(i, 1); else misPicks.push({ ...pickVisible });
  guardarEnDisco(); actualizarCuentaTalon();
  const b = document.querySelector("[data-guardar-pick]");
  if (b) { const on = i < 0; b.classList.toggle("on", on); b.textContent = on ? "✓ En mi talón" : "☆ Guardar en mi talón"; }
}

// Probabilidad suavizada (Laplace): con 10 de 10 la tasa cruda da 100%, que como probabilidad
// es mentira y haría que cualquier cuota parezca tener valor. (sup+1)/(n+2) corrige eso.
const probAjustada = k => k.n > 0 ? (k.sup + 1) / (k.n + 2) : null;

// La cuota combinada multiplica las cuotas; la "justa" sale de multiplicar las probabilidades ajustadas.
function totalesTalon() {
  const cuotas = misPicks.map(k => aCuota(k.cuota)), conCuota = cuotas.filter(c => c != null);
  const probs = misPicks.map(probAjustada).filter(v => v != null && v > 0);
  const probModelo = misPicks.length && probs.length === misPicks.length ? probs.reduce((a, b) => a * b, 1) : null;
  const combinada = conCuota.length ? conCuota.reduce((a, b) => a * b, 1) : null;
  return { combinada, faltan: cuotas.length - conCuota.length, probModelo,
           justa: probModelo ? 1 / probModelo : null, retorno: combinada != null ? combinada * montoTalon : null };
}

function totalesTalonHTML() {
  const t = totalesTalon();
  const completo = t.combinada != null && t.justa != null && !t.faltan;
  const valor = completo && t.combinada > t.justa;
  return `<div class="talon-grid">
      <div><div class="v${valor ? " ok" : ""}">${t.combinada != null ? fmt2(t.combinada) : "–"}</div>
        <div class="k">cuota combinada${t.faltan ? ` (faltan ${t.faltan})` : ""}</div></div>
      <div><div class="v">${t.justa != null ? fmt2(t.justa) : "–"}</div><div class="k">cuota justa según tus datos</div></div>
      <div><div class="v">${t.probModelo != null ? Math.round(t.probModelo * 100) + "%" : "–"}</div><div class="k">probabilidad combinada ajustada</div></div>
      <div><div class="v">${t.retorno != null ? "$" + fmt2(t.retorno) : "–"}</div>
        <div class="k">cobrás${t.retorno != null ? `, ganancia $${fmt2(t.retorno - montoTalon)}` : ""}</div></div>
    </div>
    <p class="nota" style="margin:14px 0 0">${
      t.combinada == null ? "Cargá la cuota de cada pick para ver cuánto paga la combinada."
      : !completo ? "Faltan cuotas: la combinada es parcial."
      : valor ? "La combinada paga más que la cuota justa de tus datos: según tu historial, tiene valor."
      : "La combinada paga menos que la cuota justa de tus datos."}
      La probabilidad no es la tasa cruda: está ajustada para no tratar un 10 de 10 como un 100% seguro. Igual son muestras chicas, tomalo como referencia y no como certeza.</p>`;
}

function textoTalon() {
  const lineas = misPicks.map(k => {
    const c = aCuota(k.cuota);
    return `• ${k.jugador} — ${mercadoPick(k)} (${k.equipo} vs ${k.rival})`
      + (c ? ` @ ${fmt2(c)}` : "") + (k.pct != null ? ` · ${Math.round(k.pct * 100)}% en ${k.n}` : "");
  });
  const t = totalesTalon();
  if (t.combinada != null) lineas.push(`Combinada ${fmt2(t.combinada)}${t.faltan ? ` (faltan ${t.faltan})` : ""}: $${fmt2(montoTalon)} → $${fmt2(t.retorno)}`);
  return "Mi talón · La Oficina\n" + lineas.join("\n");
}

async function copiarTalon(boton) {
  const txt = textoTalon();
  try { await navigator.clipboard.writeText(txt); boton.textContent = "¡Copiado!"; }
  catch { boton.textContent = "No se pudo copiar"; }
  setTimeout(() => { boton.textContent = "Copiar talón"; }, 1800);
}

function picksEquipo(p, lado, forma, actual) {
  const teamId = lado === "home" ? p.homeId : p.awayId;
  const avisos = avisosEquipo(teamId, forma, actual, p.fecha, p.liga_nombre);
  const conv = actual?.convocados?.[teamId] || [];
  const confirmada = conv.filter(c => c.titular).length >= 11;
  const titularHoy = new Set(conv.filter(c => c.titular).map(c => c.id)), enLista = new Set(conv.map(c => c.id));
  const ult3 = forma.partidos.slice(0, 3).map(m => m.id);
  const minN = Math.min(5, Math.max(3, forma.partidos.length));
  const cands = [];
  for (const j of forma.jugadores.values()) {
    const av = avisos.get(j.id) || [];
    if (av.some(a => a.tipo === "baja" || a.tipo === "susp")) continue;
    if (confirmada ? !titularHoy.has(j.id) : conv.length >= 11 && !enLista.has(j.id)) continue;
    if (!confirmada && !j.partidos.some(x => ult3.includes(x.eventId))) continue;  // tiene que venir jugando
    const ps = filtrarPartidos(j.partidos), r = resumenStat(ps);
    if (r.n < minN || !r.sup) continue;
    if (ps.filter(x => x.titular).length < ps.length / 2) continue;  // suplentes habituales afuera
    cands.push({ p, lado, j, ps, r, av, equipo: lado === "home" ? p.local : p.visitante, logo: lado === "home" ? p.logoL : p.logoV });
  }
  return cands.sort((a, b) => b.r.pct - a.r.pct || b.r.prom - a.r.prom || b.r.n - a.r.n).slice(0, 3);
}

function barrasMini(ps, linea) {
  const vals = [...ps].reverse().map(x => x.stats[vista.stat]);
  const W = 240, H = 50, base = 36, alto = 32;
  const max = Math.max(linea + 0.5, ...vals.map(v => v ?? 0));
  const band = W / Math.max(vals.length, 1), bw = Math.min(16, band * 0.62);
  let g = "";
  vals.forEach((v, i) => {
    const h = Math.max(((v ?? 0) / max) * alto, 2);
    g += `<rect x="${i * band + (band - bw) / 2}" y="${base - h}" width="${bw}" height="${h}" rx="2" fill="var(${(v ?? 0) > linea ? "--hit" : "--miss"})"/>
      <text x="${i * band + band / 2}" y="${H - 2}" text-anchor="middle">${v ?? "–"}</text>`;
  });
  const ly = base - (linea / max) * alto;
  g += `<line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="var(--text)" stroke-width="1.2" stroke-dasharray="3 3"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Últimos partidos, del más antiguo al más reciente: ${vals.map(v => v ?? "sin dato").join(", ")}">${g}</svg>`;
}

function cardPick(k, rank, conPartido) {
  const { p, j, ps, r } = k, f = new Date(p.fecha);
  const cuando = isoLocal(f) === isoLocal(new Date()) ? `Hoy ${fmtHora.format(f)}` : `${fmtCorta.format(f)} ${fmtHora.format(f)}`;
  const rival = k.lado === "home" ? p.visitante : p.local;
  const extra = k.av.filter(a => ["rotar", "volvio", "banco"].includes(a.tipo)).slice(0, 1).map(etiquetaAviso).join("");
  return `<button class="pick" data-pick-partido="${esc(p.id)}" data-pick-lado="${k.lado}" data-pick-j="${esc(j.id)}">
    <span class="pick-cab"><span class="pick-rank">${rank}</span>${escudo(k.logo)}
      <span class="pick-quien"><b>${esc(j.nombre)}</b><small>${esc(k.equipo)}${j.pos && j.pos !== "SUB" ? ` · ${esc(j.pos)}` : ""}</small></span></span>
    ${conPartido ? `<span class="pick-partido">vs ${esc(rival)} · ${esc(p.liga_nombre)} · ${cuando}</span>` : ""}
    <span class="pick-mercado">${textoMercado()}${extra}</span>
    <span class="pick-datos"><span class="pick-pct">${Math.round(r.pct * 100)}%</span>
      <span class="pick-k">superó en ${r.sup} de ${r.n}<br>promedio ${r1(r.prom)} · cuota justa ${cuotaJusta(r.pct)}</span></span>
    ${barrasMini(ps, vista.linea)}
  </button>`;
}

function filtrosPicksHTML(idStat, idLinea) {
  const opt = (arr, val) => arr.map(([v, t]) => `<option value="${v}"${String(v) === String(val) ? " selected" : ""}>${t}</option>`).join("");
  return `<label>Estadística <select id="${idStat}">${opt(Object.entries(NOMBRE_STAT), vista.stat)}</select></label>

}

async function pintarPicksPartido(p) {
  const n = Math.max(vista.n, 10);
  try {
    const [fh, fa, actual] = await Promise.all([formaEquipo(p.homeId, p.fecha, n), formaEquipo(p.awayId, p.fecha, n), resumen(p.id).catch(() => null)]);
    const cont = $("picks");
    if (!cont || activo !== p.id) return;
    const bloque = (lado, forma) => {
      const ks = picksEquipo(p, lado, forma, actual);
      return `<div class="picks-eq"><h5>${escudo(lado === "home" ? p.logoL : p.logoV)}${esc(lado === "home" ? p.local : p.visitante)}</h5>
        <div class="picks-fila">${ks.length ? ks.map((k, i) => cardPick(k, i + 1, false)).join("")
          : `<p class="sup">Ningún titular superó la línea con suficientes partidos.</p>`}</div></div>`;
    };
    cont.innerHTML = `<div class="picks-titulo"><h4><span class="top3">Top 3</span> Picks del partido</h4>
        <span class="sup">${textoMercado()}, últimos ${vista.n} partidos${vista.soloTitular ? ", solo como titular" : ""}. Sin jugadores en duda.</span></div>
      ${bloque("home", fh)}${bloque("away", fa)}`;
  } catch {
    const cont = $("picks"); if (cont) cont.innerHTML = "";
  }
}

  const cab = `<div class="inicio-cab"><div><h2>Picks del día</h2>
      <p class="sup">Los jugadores que más veces superaron la línea en los partidos destacados que vienen. Tocá una pick para ver el partido.</p></div>
      <div class="filtros">${filtrosPicksHTML("iStat", "iLinea")}</div></div>`;
  if (!ps.length) {
    cont.innerHTML = cab + `<div class="vacio">${partidos.length ? "No quedan partidos destacados por jugarse en estas fechas. Probá cargar los días siguientes." : "Cargando partidos…"}</div>`;
    return;
  }
  const todos = [];
  let hechos = 0;
  const pintar = () => {
    if (gen !== genInicio || verTalon || (cont === $("detalle") && activo)) return;  // ya se abrió un partido o el talón: no pisar el detalle
    const orden = [...todos].sort((a, b) => b.r.pct - a.r.pct || b.r.n - a.r.n || b.r.prom - a.r.prom).slice(0, 12);
    cont.innerHTML = cab + (hechos < ps.length ? `<p class="sup progreso">Analizando partidos (${hechos} de ${ps.length})…</p>` : "")
      + (orden.length ? `<div class="picks-grid">${orden.map((k, i) => cardPick(k, i + 1, true)).join("")}</div>`
        : hechos < ps.length ? "" : `<div class="vacio">Con esta línea nadie se destaca. Probá con una línea más baja.</div>`);
  };
  pintar();
  const n = Math.max(vista.n, 10);
  await enParalelo(ps.map(p => async () => {
    try {
      const [fh, fa, actual] = await Promise.all([formaEquipo(p.homeId, p.fecha, n), formaEquipo(p.awayId, p.fecha, n), resumen(p.id).catch(() => null)]);
      todos.push(...picksEquipo(p, "home", fh, actual), ...picksEquipo(p, "away", fa, actual));
    } catch {}
    hechos++; pintar();
  }), 2);
}

function irAPick(b) {
  const id = b.dataset.pickPartido, lado = b.dataset.pickLado, jid = b.dataset.pickJ;
  if (activo !== id) abrirPartido(id);
  vista.lado = lado; vista.jugador = jid; vista.tab = "previa";
  pintarDetalle().then(() => setTimeout(() => {
    (document.querySelector("tr.fila.sel") || $("panelJugador"))?.scrollIntoView({ block: "center", behavior: "smooth" });
  }, 400));
}

// ---------- partidos de un jugador con cualquier equipo (últimos 5) ----------
function partidosAtleta(id) {
  return atletas[id] ??= getJSON(`${API_ATLETA}/${id}/overview`).then(d => {
    const gl = d.gameLog || {}, s = gl.statistics?.[0];
    if (!s) return [];
    const metaEv = gl.events || {};
    return (s.events || []).map(e => {
      const m = metaEv[e.eventId] || {};
      const v = Object.fromEntries(s.names.map((n, i) => [n, e.stats[i]]));
      const app = String(v.appearances ?? "");
      return {
        eventId: e.eventId, fecha: m.gameDate, comp: m.leagueName || m.leagueAbbreviation || "",
        rival: m.opponent?.displayName || "", condicion: m.atVs === "@" ? "V" : "L", resultado: m.score || "",
        minutos: null, titular: /start/i.test(app), jugo: app !== "0" && app !== "",
        stats: Object.fromEntries(Object.entries(STATS).map(([k, c]) => [c, num(v[k])])),
        otroEquipo: true,
      };
    }).filter(p => p.jugo && p.fecha);
  }).catch(() => []);
}

// ---------- cálculos ----------
function filtrarPartidos(ps) {
  return ps.filter(p => !vista.soloTitular || p.titular)
    .sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, vista.n);
}
function resumenStat(ps) {
  const vals = ps.map(p => p.stats[vista.stat]).filter(v => v != null);
  const sup = vals.filter(v => v > vista.linea).length;
  const conMin = ps.filter(p => p.minutos != null);
  return {
    pj: ps.length, n: vals.length, sup,
    pct: vals.length ? sup / vals.length : null,
    prom: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null,
    min: conMin.length ? conMin.reduce((a, p) => a + p.minutos, 0) / conMin.length : null,
  };
}

// ---------- gráficos ----------
function sparkline(ps) {
  const orden = [...ps].reverse();
  const [w, gap] = esAngosto() ? [4, 1.5] : [7, 2], h = 22, max = Math.max(vista.linea + 0.5, ...orden.map(p => p.stats[vista.stat] ?? 0));
  const W = Math.max(orden.length * (w + gap) - gap, 1);
  const bars = orden.map((p, i) => {
    const v = p.stats[vista.stat] ?? 0, bh = Math.max(v / max * h, 2);
    return `<rect x="${i * (w + gap)}" y="${h - bh}" width="${w}" height="${bh}" rx="1.5" fill="var(${v > vista.linea ? "--hit" : "--miss"})"/>`;
  }).join("");
  const ly = h - (vista.linea / max) * h;
  return `<svg class="spark" width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" aria-hidden="true">${bars}
    <line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="var(--text)" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/></svg>`;
}

function graficoBarras(ps, ancho = 720) {
  const orden = [...ps].reverse();
  const W = Math.max(300, Math.round(ancho)), H = W < 500 ? 210 : 240, m = { t: 12, r: 66, b: 46, l: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = orden.map(p => p.stats[vista.stat] ?? 0);
  const ymax = Math.max(Math.ceil(Math.max(...vals, vista.linea + 0.5)), 1);
  const paso = ymax > 8 ? 2 : 1;
  const y = v => m.t + ih - (v / ymax) * ih;
  const band = iw / Math.max(orden.length, 1), bw = Math.min(24, band * 0.55);
  let g = "";
  for (let v = 0; v <= ymax; v += paso)
    g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
          <text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  orden.forEach((p, i) => {
    const v = vals[i], x = m.l + i * band + (band - bw) / 2, top = y(v), base = y(0);
    if (v > 0) {
      const r = Math.min(4, (base - top) / 2);
      g += `<path d="M${x},${base} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${base} Z" fill="var(${v > vista.linea ? "--hit" : "--miss"})"/>`;
    } else {
      g += `<rect x="${x}" y="${base - 2}" width="${bw}" height="2" fill="var(--miss)"/>`;
    }
    const cx = m.l + i * band + band / 2;
    const fecha = fmtCorta.format(new Date(p.fecha));
    if (band >= 44) {
      const maxCar = Math.floor(band / 7.5);
      const rival = p.rival.length > maxCar ? p.rival.slice(0, maxCar - 1).trimEnd() + "…" : p.rival;
      g += `<text x="${cx}" y="${H - m.b + 17}" text-anchor="middle">${esc(rival)}</text>
            <text x="${cx}" y="${H - m.b + 32}" text-anchor="middle">${fecha}</text>`;
    } else if (band >= 34 || (orden.length - 1 - i) % 2 === 0) {
      g += `<text x="${cx}" y="${H - m.b + 17}" text-anchor="middle">${fecha}</text>`;
    }
    g += `<rect class="hit" data-i="${i}" x="${m.l + i * band}" y="${m.t}" width="${band}" height="${ih}" fill="transparent"/>`;
  });
  const ly = y(vista.linea);
  g += `<line x1="${m.l}" x2="${m.l + iw}" y1="${ly}" y2="${ly}" stroke="var(--text)" stroke-width="2" stroke-dasharray="6 4"/>
        <text class="linea" x="${m.l + iw + 8}" y="${ly + 4}">Línea ${r1(vista.linea)}</text>`;
  return { svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(NOMBRE_STAT[vista.stat])} por partido">${g}</svg>`, orden };
}

async function pintarDetalle() {
  if (verTalon) { pintarTalon(); return; }
  const p = partidos.find(x => x.id === activo), det = $("detalle");
  if (!p) { pintarInicio(); return; }
  if (!vista.tab) vista.tab = p.estado === "pre" ? "previa" : "hechos";
  if (p.estado === "pre" && vista.tab !== "previa" && vista.tab !== "remates") vista.tab = "previa";
  det.innerHTML = cabecera(p) + `<div id="cuerpo"><div class="vacio">Cargando…</div></div>`;
  pintarClaves(p);
  try {
    if (vista.tab === "remates") await pintarRemates(p);
    else if (vista.tab === "partido") await pintarStatsPartido(p);
    else if (vista.tab === "hechos") await pintarHechos(p);
    else await pintarPrevia(p);
  } catch (e) {
    if (activo === p.id) $("cuerpo").innerHTML = `<div class="vacio">ESPN no respondió. Revisá tu conexión y volvé a elegir el partido.</div>`;
  }
}

async function pintarHechos(p) {
