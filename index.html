// ---------- claves para el partido: tendencias de los últimos 10 partidos (reglas fijas, sin cuotas) ----------
const CLAVES_N = 10, CLAVES_MIN = 0.65, CLAVE_PLEGADA = "laoficina-claves-plegada";
const clavesCache = {};
let clavesPlegada = false;
try { clavesPlegada = localStorage.getItem(CLAVE_PLEGADA) === "1"; } catch {}
const fmtL = l => r1(l).replace(",", ".");
const prom = (xs) => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0;

// tasa ajustada por tamaño de muestra: 5 de 5 no vale más que 18 de 20
const suav = (sup, n) => (sup + 1) / (n + 2);
// Línea "Más de"/"Menos de" más exigente que igual se cumplió seguido; devuelve { dir, linea, sup, n, tasa }
function mejorLinea(vals, lineas, umbral = 0.7) {
  const n = vals.length, cands = [];
  for (const l of lineas) {
    const mas = vals.filter(v => v > l).length;
    cands.push({ dir: "Más", linea: l, sup: mas, n, tasa: suav(mas, n) }, { dir: "Menos", linea: l, sup: n - mas, n, tasa: suav(n - mas, n) });
  }
  const masOk = cands.filter(c => c.dir === "Más" && c.tasa >= umbral).sort((x, y) => y.linea - x.linea)[0];
  const menosOk = cands.filter(c => c.dir === "Menos" && c.tasa >= umbral).sort((x, y) => x.linea - y.linea)[0];
  const ok = [masOk, menosOk].filter(Boolean).sort((x, y) => y.tasa - x.tasa)[0];
  return ok || cands.sort((x, y) => y.tasa - x.tasa)[0];
}

function datosEquipoClaves(forma, teamId) {
  const ps = forma.partidos.map(m => {
    const gf = +(m.esLocal ? m.gl : m.gv), gc = +(m.esLocal ? m.gv : m.gl);
    return { ...m, gf, gc, r: gf > gc ? "G" : gf < gc ? "P" : "E" };
  }).filter(m => Number.isFinite(m.gf) && Number.isFinite(m.gc));
  return { teamId, ps, n: ps.length, jugadores: forma.jugadores };
}

function calcularClaves(p, A, B) {
  const claves = [], nA = A.n, nB = B.n, N = nA + nB;
  const b = t => `<b>${esc(t)}</b>`;
  // 1. Goles
  { const tot = [...A.ps, ...B.ps].map(m => m.gf + m.gc);
    const k = mejorLinea(tot, [1.5, 2.5, 3.5]);
    const enA = A.ps.filter(m => (k.dir === "Más") === (m.gf + m.gc > k.linea)).length, enB = k.sup - enA;
    const s = e => e.ps.reduce((x, m) => x + m.gf, 0), c = e => e.ps.reduce((x, m) => x + m.gc, 0);
    claves.push({ tasa: k.tasa, mercado: "Goles · Más/Menos de", pick: `${k.dir} de ${fmtL(k.linea)}`, sup: k.sup, n: N,
      texto: `${b(p.local)} anotó ${b(s(A))} goles y recibió ${b(c(A))} en sus últimos ${nA} partidos, mientras que ${b(p.visitante)} anotó ${b(s(B))} y recibió ${b(c(B))}. Hubo ${k.dir.toLowerCase()} de ${fmtL(k.linea)} goles en ${enA} partidos de ${esc(p.local)} y en ${enB} de ${esc(p.visitante)}.` });
  }
  // 2. Ambos marcan
  { const ba = A.ps.filter(m => m.gf > 0 && m.gc > 0).length, bb = B.ps.filter(m => m.gf > 0 && m.gc > 0).length;
    const si = (ba + bb) / N, sup = si >= 0.5 ? ba + bb : N - ba - bb;
    claves.push({ tasa: suav(sup, N), mercado: "Ambos equipos marcan", pick: si >= 0.5 ? "Sí" : "No", sup, n: N,
      texto: `Los dos equipos marcaron en ${b(ba)} de los últimos ${nA} partidos de ${esc(p.local)} y en ${b(bb)} de los ${nB} de ${esc(p.visitante)}.` });
  }
  // 3. Resultado (forma)
  { const reg = e => ({ G: e.ps.filter(m => m.r === "G").length, E: e.ps.filter(m => m.r === "E").length, P: e.ps.filter(m => m.r === "P").length });
    const ra = reg(A), rb = reg(B), pa = (3 * ra.G + ra.E) / nA, pb = (3 * rb.G + rb.E) / nB;
    const [fav, dog, rf, rd, nf, nd] = pa >= pb ? [p.local, p.visitante, ra, rb, nA, nB] : [p.visitante, p.local, rb, ra, nB, nA];
    const gana = (rf.G + rd.P) / N, noPierde = (rf.G + rf.E + rd.P + rd.E) / N;
    const ganaFuerte = gana >= CLAVES_MIN;
    const sup = ganaFuerte ? rf.G + rd.P : rf.G + rf.E + rd.P + rd.E;
    claves.push({ tasa: suav(sup, N) - (ganaFuerte ? 0 : 0.1), mercado: ganaFuerte ? "Resultado final" : "Doble oportunidad",
      pick: ganaFuerte ? `Gana ${fav}` : `${fav} o empate`, sup, n: N,
      texto: `${b(p.local)} viene de ${ra.G} ganados, ${ra.E} empatados y ${ra.P} perdidos (${r1(pa)} puntos por partido); ${b(p.visitante)}, de ${rb.G}-${rb.E}-${rb.P} (${r1(pb)} por partido). ${esc(fav)} ganó ${rf.G} de ${nf} y ${esc(dog)} perdió ${rd.P} de ${nd}.` });
  }
  // 4. Amarillas
  { const am = e => e.ps.map(m => (m.favor.amarillas || 0) + (m.contra.amarillas || 0));
    const va = am(A), vb = am(B), k = mejorLinea([...va, ...vb], [2.5, 3.5, 4.5, 5.5, 6.5]);
    if (va.some(Boolean) || vb.some(Boolean))
      claves.push({ tasa: k.tasa, mercado: "Tarjetas amarillas · Más/Menos de", pick: `${k.dir} de ${fmtL(k.linea)}`, sup: k.sup, n: N,
        texto: `En los partidos de ${b(p.local)} se vieron ${b(r1(prom(va)))} amarillas por partido y en los de ${b(p.visitante)}, ${b(r1(prom(vb)))}.` });
  }
  // 5. Remates al arco de cada equipo (lo que patea + lo que le patean al rival)
  for (const [yo, rival, nombre, nombreRival] of [[A, B, p.local, p.visitante], [B, A, p.visitante, p.local]]) {
    const propios = yo.ps.map(m => m.favor.tiros_al_arco || 0), recibe = rival.ps.map(m => m.contra.tiros_al_arco || 0);
    if (!propios.some(Boolean)) continue;
    const k = mejorLinea([...propios, ...recibe], [2.5, 3.5, 4.5, 5.5]);
    if (k.dir !== "Más") continue;
    claves.push({ tasa: k.tasa, mercado: `${nombre} · Remates al arco`, pick: `Más de ${fmtL(k.linea)}`, sup: k.sup, n: k.n,
      texto: `${b(nombre)} promedia ${b(r1(prom(propios)))} remates al arco por partido y ${b(nombreRival)} recibe ${b(r1(prom(recibe)))}. Se superaron los ${fmtL(k.linea)} en ${k.sup} de esos ${k.n} partidos.` });
  }
  // 6. Jugadores: titular en el último partido, con 4+ de los últimos 5 jugados
  const jugs = [];
  for (const [e, nombreEq] of [[A, p.local], [B, p.visitante]]) {
    const ultimo = e.ps[0]?.id, ultimos5 = new Set(e.ps.slice(0, 5).map(m => m.id));
    for (const j of e.jugadores.values()) {
      const pj = j.partidos.filter(x => ultimos5.has(x.eventId));
      if (pj.length < 4 || !pj.some(x => x.eventId === ultimo && x.titular)) continue;
      for (const [stat, linea, mercado] of [["tiros_al_arco", 0.5, "Remates al arco"], ["tiros", 1.5, "Remates totales"], ["faltas_recibidas", 1.5, "Faltas recibidas"]]) {
        const sup = pj.filter(x => (x.stats[stat] || 0) > linea).length, tasa = suav(sup, pj.length);
        if (sup / pj.length >= 0.75) jugs.push({ tasa, mercado: `${j.nombre} · ${mercado}`, pick: `Más de ${fmtL(linea)}`, sup, n: pj.length,
          texto: `${b(j.nombre)} (${esc(nombreEq)}) fue titular en el último partido y superó ${fmtL(linea)} ${mercado.toLowerCase()} en ${b(sup)} de sus últimos ${pj.length} partidos (${pj.reduce((s, x) => s + (x.stats[stat] || 0), 0)} en total).` });
      }
    }
  }
  jugs.sort((x, y) => y.tasa - x.tasa || y.n - x.n);
  const vistos = new Set();
  claves.push(...jugs.filter(k => { const nom = k.mercado.split(" · ")[0]; if (vistos.has(nom)) return false; vistos.add(nom); return true; }).slice(0, 2));
  return claves.filter(k => k.tasa >= CLAVES_MIN).sort((x, y) => y.tasa - x.tasa).slice(0, 5);
}

function clavesHTML(claves, nA, nB) {
  const cuerpo = !claves.length
    ? `<p class="claves-nota" style="padding-top:2px">No hay una tendencia clara en los últimos partidos de estos equipos.</p>`
    : `<div class="claves-tira">${claves.map(k => `<div class="clave"><p>${k.texto}</p>
        <div class="mercado">${esc(k.mercado)}</div>
        <div class="pick-clave"><b>${esc(k.pick)}</b><span>se dio en ${k.sup} de ${k.n}</span></div></div>`).join("")}</div>
      ${claves.length > 1 ? `<div class="claves-puntos">${claves.map((_, i) => `<button data-clave-ir="${i}" class="${i ? "" : "on"}" aria-label="Clave ${i + 1}"></button>`).join("")}</div>` : ""}
      <p class="claves-nota">Tendencias de partidos anteriores, no son una garantía.</p>`;
  return `<div class="claves${clavesPlegada ? " plegada" : ""}">
    <button class="claves-cab" data-claves-plegar aria-expanded="${!clavesPlegada}">
      <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1l1.6 4.4L14 7l-4.4 1.6L8 13l-1.6-4.4L2 7l4.4-1.6z" fill="var(--acento)"/></svg>
      <span class="tit">Claves para el partido</span>
      <span class="sub">Últimos ${Math.max(nA, nB)} partidos · ESPN</span>
      <svg class="flecha" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button><div class="claves-cuerpo">${cuerpo}</div></div>`;
}

function activarClaves() {
  const tira = document.querySelector("#claves .claves-tira"), puntos = document.querySelectorAll("#claves .claves-puntos button");
  if (!tira || !puntos.length) return;
  tira.addEventListener("scroll", () => {
    const i = Math.round(tira.scrollLeft / tira.clientWidth);
    puntos.forEach((b, j) => b.classList.toggle("on", i === j));
  }, { passive: true });
}

async function pintarClaves(p) {
  const pintar = html => { const c = $("claves"); if (c && activo === p.id) { c.innerHTML = html; activarClaves(); } };
  const html = c => clavesHTML(c.claves, c.nA, c.nB);
  if (clavesCache[p.id]) { pintar(html(clavesCache[p.id])); return; }
  try {
    const [fa, fb] = await Promise.all([formaEquipo(p.homeId, p.fecha, CLAVES_N), formaEquipo(p.awayId, p.fecha, CLAVES_N)]);
    const A = datosEquipoClaves(fa, p.homeId), B = datosEquipoClaves(fb, p.awayId);
    if (A.n < 5 || B.n < 5) return;
    pintar(html(clavesCache[p.id] = { claves: calcularClaves(p, A, B), nA: A.n, nB: B.n }));
  } catch { /* sin datos: la tarjeta no aparece */ }
}

// ---------- remates por jugador: últimos 3 partidos de cada equipo (todas las competiciones) ----------
const REM_N = 3;
// métrica → [nombre, color de la barra, color de la caja]
const METRICAS_EQ = {
  tiros: ["Remates totales", "#7F77DD", "#5148b5"],
  tiros_al_arco: ["Remates al arco", "#1D9E75", "#12684d"],
  faltas_recibidas: ["Faltas recibidas", "#378ADD", "#1f5f9e"],
  faltas_cometidas: ["Faltas cometidas", "#D85A30", "#9c3c1c"],
  goles: ["Goles", "#2FBF7F", "#1b7d51"],
  asistencias: ["Asistencias", "#2BB3C0", "#187a83"],
  amarillas: ["Amarillas", "#D9A21B", "#8f6a0f"],
  rojas: ["Rojas", "#E5484D", "#a12a2e"],
  offsides: ["Offsides", "#A26DD8", "#6d3fa3"],
  atajadas: ["Atajadas", "#8A93A0", "#555d68"],
};
const TEXTO_RES = { G: "Ganó", E: "Empató", P: "Perdió" };

async function datosRemates(p, teamId) {
  const forma = await formaEquipo(teamId, p.fecha, REM_N);
  const rs = await Promise.all(forma.partidos.map(m => resumen(m.id).catch(() => null)));
  return forma.partidos.map((m, i) => {
    const propio = +(m.esLocal ? m.gl : m.gv), ajeno = +(m.esLocal ? m.gv : m.gl);
    const jugadores = (rs[i]?.filas || []).filter(f => f.teamId === teamId)
      .map(f => ({ id: f.athleteId, nombre: f.jugador, ...Object.fromEntries(Object.keys(METRICAS_EQ).map(k => [k, f[k] || 0])) }));
    return { ...m, r: propio > ajeno ? "G" : propio < ajeno ? "P" : "E", jugadores };
  });
}

function sumarRemates(ps) {
  const suma = new Map();
  for (const m of ps) for (const j of m.jugadores) {
    let s = suma.get(j.id);
    if (!s) suma.set(j.id, s = { id: j.id, nombre: j.nombre, ...Object.fromEntries(Object.keys(METRICAS_EQ).map(k => [k, 0])) });
    for (const k of Object.keys(METRICAS_EQ)) s[k] += j[k];
  }
  return [...suma.values()];
}

function listaRematesHTML(jugadores, metrica) {
  const orden = [...jugadores].sort((a, b) => b[metrica] - a[metrica] || a.nombre.localeCompare(b.nombre));
  const max = Math.max(1, ...orden.map(j => j[metrica]));
  const total = orden.reduce((s, j) => s + j[metrica], 0);
  if (!orden.length) return `<div class="vacio">ESPN no publicó estadísticas por jugador para este partido.</div>`;
  return `<div class="rem-total"><b>${total}</b>${esc(METRICAS_EQ[metrica][0].toLowerCase())} del equipo</div>
    <div class="rem-filas">${orden.map(j => {
      const v = j[metrica];
      return `<div class="rem-fila${v ? "" : " cero"}"><span class="rem-nombre">${esc(j.nombre)}</span><span class="rem-caja">${v}</span>
        <span>${v ? `<div class="rem-barra" style="width:${(v / max * 100).toFixed(1)}%"></div>` : ""}</span></div>`;
    }).join("")}</div>`;
}

async function pintarRemates(p) {
  const lado = vista.remLado, teamId = lado === "home" ? p.homeId : p.awayId;
  const nombreEq = lado === "home" ? p.local : p.visitante;
  const cab = `<div class="seg rem-eqs" role="tablist" aria-label="Equipo">
      <button role="tab" data-rem-lado="home" class="${lado === "home" ? "on" : ""}">${esc(p.local)}</button>
      <button role="tab" data-rem-lado="away" class="${lado === "away" ? "on" : ""}">${esc(p.visitante)}</button></div>`;
  const cuerpo = () => $("cuerpo");
  if (cuerpo().querySelector(".remates")?.dataset.lado !== lado) cuerpo().innerHTML = `<section class="remates" data-lado="${lado}">${cab}<div class="vacio">Trayendo los últimos partidos de ${esc(nombreEq)}…</div></section>`;
  const ps = await datosRemates(p, teamId);
  if (activo !== p.id || vista.tab !== "remates" || vista.remLado !== lado) return;
  const metrica = vista.remMetrica, sel = vista.remSel;
  let html;
  if (!ps.length) {
    html = `<div class="vacio">ESPN no tiene partidos anteriores de ${esc(nombreEq)}.</div>`;
  } else if (sel == null || (sel !== "suma" && !ps[sel])) {
    html = `<div class="rem-lista">${ps.map((m, i) => `<button class="rem-partido" data-rem-sel="${i}">
        <b>${esc(m.local)} ${esc(m.gl)} - ${esc(m.gv)} ${esc(m.visitante)}</b>
        <span class="meta">${fmtLarga.format(new Date(m.fecha))} · ${m.esLocal ? "Local" : "Visitante"} · ${esc(m.comp)}</span>
        <span class="chev"><span class="rem-res ${m.r}">${TEXTO_RES[m.r]}</span>›</span></button>`).join("")}
      <button class="rem-partido suma" data-rem-sel="suma"><b>Los ${ps.length} partidos sumados</b>
        <span class="meta">Suma por jugador</span><span class="chev">›</span></button></div>`;
  } else {
    const m = sel === "suma" ? null : ps[sel];
    const titulo = m ? `<p class="rem-titulo">${esc(m.local)} ${esc(m.gl)} - ${esc(m.gv)} ${esc(m.visitante)}</p>
        <div class="meta">${esc(m.comp)} · ${fmtLarga.format(new Date(m.fecha))} · ${m.esLocal ? "Local" : "Visitante"} · ${TEXTO_RES[m.r]}</div>`
      : `<p class="rem-titulo">Los ${ps.length} partidos sumados</p><div class="meta">${esc(nombreEq)} · suma por jugador</div>`;
    html = `<button class="rem-volver" data-rem-volver>← Partidos</button>${titulo}
      <div class="rem-metricas" role="group" aria-label="Estadística">
        ${Object.entries(METRICAS_EQ).map(([k, [t]]) => `<button data-rem-metrica="${k}" class="${k === metrica ? "on" : ""}">${t}</button>`).join("")}</div>
      ${listaRematesHTML(m ? m.jugadores : sumarRemates(ps), metrica)}`;
  }
  const [, color, caja] = METRICAS_EQ[metrica] || METRICAS_EQ.tiros;
  cuerpo().innerHTML = `<section class="remates" style="--rem:${color};--rem-caja:${caja}" data-lado="${lado}">${cab}${html}</section>`;
}

function filtrosHTML(p) {
  const opt = (arr, val) => arr.map(([v, t]) => `<option value="${v}"${String(v) === String(val) ? " selected" : ""}>${t}</option>`).join("");
  const lineas = [0.5, 1.5, 2.5, 3.5, 4.5].map(v => [v, `Más de ${r1(v)}`]);
  return `<div class="filtros">
    <div class="seg" role="group" aria-label="Equipo">
      <button data-lado="home" class="${vista.lado === "home" ? "on" : ""}">${esc(p.local)}</button>
      <button data-lado="away" class="${vista.lado === "away" ? "on" : ""}">${esc(p.visitante)}</button>
    </div>
    <label>Estadística <select id="fStat">${opt(Object.entries(NOMBRE_STAT), vista.stat)}</select></label>
    <label>Línea <select id="fLinea">${opt(lineas, vista.linea)}</select></label>
    <label>Partidos <select id="fN">${opt([[5, "Últimos 5"], [10, "Últimos 10"], [15, "Últimos 15"]], vista.n)}</select></label>
    <label class="check"><input type="checkbox" id="fTit"${vista.soloTitular ? " checked" : ""}> Solo como titular</label>

}

function filtrosComparativaHTML(forma) {
  const opt = (arr, val) => arr.map(([v, t]) => `<option value="${v}"${String(v) === String(val) ? " selected" : ""}>${t}</option>`).join("");
  const rivales = [...new Map(forma.partidos.map(m => [m.rivalId, m.rival])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  return `<div class="filtros">
    <label>A favor o en contra <select id="fFavorContra">${opt([["favor", "A favor"], ["contra", "En contra"]], vista.favorContra)}</select></label>
    <label>Rival <select id="fRival"><option value=""${vista.rivalEq ? "" : " selected"}>Todos</option>${opt(rivales, vista.rivalEq)}</select></label>
    <label>Como local o visitante <select id="fSede">${opt([["todos", "Todos"], ["local", "Local"], ["visita", "Visitante"]], vista.sedeEq)}</select></label>
  </div>`;
}

function pintarComparativa(forma, nombreEq) {
  const cont = $("comparativa");
  if (!cont) return;
  const cabecera = `<h4>Comparativa de equipo</h4>${filtrosComparativaHTML(forma)}`;
  if (!forma.partidos.length) { cont.innerHTML = `${cabecera}<div class="vacio">ESPN no tiene partidos anteriores de ${esc(nombreEq)}.</div>`; return; }
  let filas = forma.partidos.map(m => ({
    eventId: m.id, fecha: m.fecha, comp: m.comp, rival: m.rival, rivalId: m.rivalId,
    condicion: m.esLocal ? "L" : "V", resultado: `${m.gl}-${m.gv}`, minutos: 90, titular: true,
    stats: vista.favorContra === "contra" ? m.contra : m.favor,
  }));
  if (vista.rivalEq) filas = filas.filter(f => String(f.rivalId) === String(vista.rivalEq));
  if (vista.sedeEq !== "todos") filas = filas.filter(f => f.condicion === (vista.sedeEq === "local" ? "L" : "V"));
  const sel = filtrarPartidos(filas), r = resumenStat(sel);
  if (!sel.length) { cont.innerHTML = `${cabecera}<div class="vacio">No hay partidos con estos filtros.</div>`; return; }
  const { svg, orden } = graficoBarras(sel, (cont.clientWidth || 700) - 24);
  const stat = NOMBRE_STAT[vista.stat].toLowerCase();
  const sentido = vista.favorContra === "favor" ? "a favor" : "en contra";
  const comoTxt = vista.sedeEq === "local" ? " de local" : vista.sedeEq === "visita" ? " de visitante" : "";
  const rivalTxt = vista.rivalEq ? ` contra ${esc(filas[0]?.rival || "")}` : "";
  cont.innerHTML = `${cabecera}
    <p class="comparativa-frase">El <b>${esc(nombreEq)}</b>${comoTxt} promedia <b>${r1(r.prom)}</b> ${esc(stat)} (${sentido})${rivalTxt}, en sus últimos ${sel.length} partidos.</p>
    <div class="leyenda"><span><i style="background:var(--hit)"></i>Superó la línea</span><span><i style="background:var(--miss)"></i>No la superó</span><span><i class="dash"></i>Línea ${r1(vista.linea)}</span></div>
    <div class="chart" id="chartEq">${svg}</div>`;
  activarTooltip($("chartEq"), orden);
}

async function pintarPrevia(p) {
  const teamId = vista.lado === "home" ? p.homeId : p.awayId;
  const nombreEq = vista.lado === "home" ? p.local : p.visitante;
  $("cuerpo").innerHTML = filtrosHTML(p)
    + `<section class="xi" id="alineacion"><h4>Alineaciones</h4><div class="campo-espera ${esAngosto() ? "medio" : ""}"></div></section>`
    + `<div id="previa"><div class="vacio">Trayendo los últimos partidos de ${esc(nombreEq)}…</div></div>`
    + `<section class="picks" id="picks"><div class="vacio">Buscando las mejores picks…</div></section>`
    + `<section class="comparativa" id="comparativa"><div class="vacio">Comparando a ${esc(nombreEq)} con sus últimos partidos…</div></section>`
    + `<section class="avisos" id="avisos"></section>`;
  pintarAlineacion(p);
  pintarPicksPartido(p);
  const [forma, actual] = await Promise.all([formaEquipo(teamId, p.fecha, Math.max(vista.n, 10)), resumen(p.id).catch(() => null)]);
  if (activo !== p.id || vista.tab !== "previa" || (vista.lado === "home" ? p.homeId : p.awayId) !== teamId) return;

  pintarComparativa(forma, nombreEq);
  const conv = actual?.convocados?.[teamId] || [];
  const avisos = avisosEquipo(teamId, forma, actual, p.fecha, p.liga_nombre);
  const convMap = new Map(conv.map(c => [c.id, c]));
  const jugadores = new Map(forma.jugadores);
  for (const c of conv) if (!jugadores.has(c.id)) jugadores.set(c.id, { id: c.id, nombre: c.nombre, pos: c.pos, partidos: [] });

  const filas = [...jugadores.values()].map(j => {
    const ps = filtrarPartidos(j.partidos);
    return { j, ps, ...resumenStat(ps), hoy: convMap.get(j.id) };
  }).filter(f => f.pj > 0 || f.hoy);
  if (!filas.length) { $("previa").innerHTML = `<div class="vacio">ESPN no tiene estadísticas por jugador de los partidos anteriores de ${esc(nombreEq)}. Probá con el otro equipo.</div>`; return; }

  const { col, asc } = vista.ordenPlantel;
  const val = (f, c) => c === "jugador" ? f.j.nombre : c === "pos" ? (f.j.pos || "") : f[c] ?? -1;
  filas.sort((a, b) => { const x = val(a, col), y = val(b, col); const s = typeof x === "string" ? x.localeCompare(y) : x - y;
    return (asc ? s : -s) || (b.pct ?? -1) - (a.pct ?? -1) || (b.prom ?? -1) - (a.prom ?? -1) || b.n - a.n; });
  if (!vista.jugador || !jugadores.has(vista.jugador)) vista.jugador = filas.find(f => f.pj)?.j.id ?? null;

  const stat = NOMBRE_STAT[vista.stat].toLowerCase();
  const cols = [["jugador", "Jugador", "izq"], ["pos", "Pos", "izq col-opc"], ["pj", "PJ"], ["min", "Min por partido", "col-opc"],
    ["prom", `Promedio de ${stat}`], ["pct", `Superó ${r1(vista.linea)}`], ["spark", "Últimos partidos", "izq"]];
  plantelActual = jugadores;
  const enTabla = esAngosto();  // en celular el gráfico va debajo del jugador elegido
  const maxProm = Math.max(...filas.map(f => f.prom ?? 0), 0.1);
  const etiquetasDe = f => {
    const av = (avisos.get(f.j.id) || []).filter(a => a.tipo !== "hoy").slice(0, 1);
    // "Convocado" + "Suplente hoy" dicen lo mismo: con un aviso presente alcanza, salvo que sea titular
    const hoy = f.hoy && (f.hoy.titular || !av.length) ? `<span class="hoy">${f.hoy.titular ? "Titular hoy" : "Convocado"}</span>` : "";
    return hoy + av.map(etiquetaAviso).join("");
  };

  // lectura rápida: la barra es el promedio, la píldora es cuántas veces superó la línea
  const lista = `<div class="plantel-lista">${filas.map(f => `
    <div class="jug${f.j.id === vista.jugador ? " sel" : ""}" data-j="${esc(f.j.id)}" tabindex="0" role="button"
         aria-label="${esc(f.j.nombre)}${f.pct != null ? `, superó la línea en ${f.sup} de ${f.n}` : ""}">
      <span class="jug-quien"><b>${esc(f.j.nombre)}</b><small>${esc(f.j.pos && f.j.pos !== "SUB" ? f.j.pos : "")}${
        f.pj ? `${f.j.pos && f.j.pos !== "SUB" ? " · " : ""}${f.pj} PJ` : ""}</small>${etiquetasDe(f)}</span>
      <span class="jug-barra"><i style="width:${Math.round(((f.prom ?? 0) / maxProm) * 100)}%"></i>
        <em>${f.prom != null ? r1(f.prom) : "–"}</em></span>
      <span class="jug-pct${f.pct >= 0.7 ? " alta" : ""}">${f.pct != null ? `${Math.round(f.pct * 100)}%` : "–"}
        <small>${f.pct != null ? `${f.sup}/${f.n}` : ""}</small></span>
      <span class="jug-spark">${f.ps.length ? sparkline(f.ps) : ""}</span>
    </div>${enTabla && f.j.id === vista.jugador ? PANEL_MOVIL : ""}`).join("")}</div>`;

  const tabla = `<details class="plantel-tabla"><summary>Ver la tabla con todos los números</summary>
    <div class="tablewrap"><table data-tabla="plantel"><thead><tr>${cols.map(([c, t, cl]) =>
      `<th data-col="${c}" class="${cl || ""} ${c === col ? "ord" + (asc ? " asc" : "") : ""}">${t}</th>`).join("")}</tr></thead><tbody>
    ${filas.map(f => `<tr class="fila${f.j.id === vista.jugador ? " sel" : ""}" data-j="${esc(f.j.id)}" tabindex="0">
      <td class="izq">${esc(f.j.nombre)}${etiquetasDe(f)}</td>
      <td class="izq sup col-opc">${esc(f.j.pos === "SUB" ? "" : f.j.pos)}</td>
      <td>${f.pj}</td><td class="col-opc">${f.min != null ? Math.round(f.min) : "–"}</td>
      <td>${f.prom != null ? r1(f.prom) : "–"}</td>
      <td class="pct">${f.pct != null ? `${Math.round(f.pct * 100)}%<small>${f.sup} de ${f.n}</small>` : "–"}</td>
      <td class="izq">${f.ps.length ? sparkline(f.ps) : ""}</td></tr>`).join("")}
    </tbody></table></div></details>`;

  $("previa").innerHTML = `<div class="plantel-cab"><h4>${esc(nombreEq)}: ${esc(stat)} por partido</h4>
      <span class="sup">Barra: promedio. Píldora: cuántas veces superó ${r1(vista.linea)}. Tocá un jugador para ver su gráfico.</span></div>`

  const dudas = [];
  const ubicados = (ubicadoYa ? xi : ubicarXI(xi, formacion)).map(j => {
    const av = (avisos?.get(j.id) || []).find(a => a.tipo !== "hoy" && a.tipo !== "volvio");
    if (av && !confirmada) dudas.push(`${j.corto} (${NOMBRE_AVISO[av.tipo].toLowerCase()})`);
    return { ...j, est: stats(j), aviso: av };
  });
  return { ubicados, formacion, fuente, confirmada, dudas };
}

function lineasCancha(W, H, medio) {
  const s = 1000 / 105;  // unidades por metro
  const area = [16.5 * s, 40.3 * s], chica = [5.5 * s, 18.3 * s], r = 9.15 * s;
  if (medio) {  // media cancha vertical, arco abajo
    return `<rect x="4" y="4" width="${W - 8}" height="${H - 8}"/>
      <line x1="4" y1="4" x2="${W - 4}" y2="4"/><path d="M${W / 2 - r} 4 A${r} ${r} 0 0 0 ${W / 2 + r} 4"/>
      <rect x="${(W - area[1]) / 2}" y="${H - 4 - area[0]}" width="${area[1]}" height="${area[0]}"/>
      <rect x="${(W - chica[1]) / 2}" y="${H - 4 - chica[0]}" width="${chica[1]}" height="${chica[0]}"/>
      <path d="M${W / 2 - 7.3 * s} ${H - 4 - area[0]} A${r} ${r} 0 0 1 ${W / 2 + 7.3 * s} ${H - 4 - area[0]}"/>`;
  }
  return `<rect x="4" y="4" width="${W - 8}" height="${H - 8}"/>
    <line x1="${W / 2}" y1="4" x2="${W / 2}" y2="${H - 4}"/><circle cx="${W / 2}" cy="${H / 2}" r="${r}"/>
    <rect x="4" y="${(H - area[1]) / 2}" width="${area[0]}" height="${area[1]}"/>
    <rect x="4" y="${(H - chica[1]) / 2}" width="${chica[0]}" height="${chica[1]}"/>
    <rect x="${W - 4 - area[0]}" y="${(H - area[1]) / 2}" width="${area[0]}" height="${area[1]}"/>
    <rect x="${W - 4 - chica[0]}" y="${(H - chica[1]) / 2}" width="${chica[0]}" height="${chica[1]}"/>
    <path d="M${4 + area[0]} ${H / 2 - 7.3 * s} A${r} ${r} 0 0 1 ${4 + area[0]} ${H / 2 + 7.3 * s}"/>
    <path d="M${W - 4 - area[0]} ${H / 2 - 7.3 * s} A${r} ${r} 0 0 0 ${W - 4 - area[0]} ${H / 2 + 7.3 * s}"/>`;
}

// ESPN arma la camiseta del equipo con el dorsal; el combiner la devuelve liviana (6 KB en vez de 240 KB).
const urlCamiseta = (href, w = 120) => href ? `https://a.espncdn.com/combiner/i?img=${encodeURIComponent(href)}&w=${w}` : "";

// Nombre para la cancha: el apellido ("J. Calleri" → "Calleri")
const nombreCancha = j => String(j.corto || j.nombre || "").replace(/^(\p{Lu}\.\s*)+/u, "").trim() || j.nombre || "";

// Ficha HTML sobre la cancha: foto (365Scores → ESPN → camiseta → dorsal), % arriba de la foto y nombre siempre abajo.
// x, y en % del ancho y alto de la cancha.
function fichaJugador(j, x, y, color, lado, ancho) {
  const sel = j.id === vista.jugador, pct = j.est?.pct != null ? Math.round(j.est.pct * 100) : null;
  const fuentes = [j.foto, fotoESPN(j.espn ? j.id : null), j.camiseta ? urlCamiseta(j.camiseta) : null].filter(Boolean);
  const img = fuentes.length ? `<img src="${esc(fuentes[0])}" data-alt="${esc(fuentes.slice(1).join(" "))}" alt="" loading="lazy" decoding="async" onerror="fotoFalla(this)">` : "";
  const clic = j.espn ? ` data-xi="${esc(j.id)}" data-xi-lado="${lado}" tabindex="0" role="button"` : "";
  return `<div class="ficha${sel ? " sel" : ""}${j.espn ? "" : " sin-datos"}"${clic} style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%;width:${ancho.toFixed(2)}%"
      aria-label="${esc(j.nombre)}${pct != null ? `, ${pct}%` : ""}" title="${esc(j.nombre)}">
    <span class="foto" style="--eq:#${color};--eq-txt:${colorTexto(color)}"><span class="dorsal">${esc(j.dorsal ?? "")}</span>${img}</span>
    ${pct != null ? `<span class="pct-xi${pct >= 70 ? " alta" : ""}">${pct}%</span>` : ""}
    ${j.aviso ? `<span class="marca m-${j.aviso.tipo}" title="${esc(NOMBRE_AVISO[j.aviso.tipo])}: ${esc(j.aviso.texto)}">${j.aviso.tipo === "rotar" ? "↻" : "!"}</span>` : ""}
    <span class="nombre">${esc(nombreCancha(j))}</span>
  </div>`;
}

let tRefresco = null, avisosActuales = null;
function programarRefresco(p, confirmadas, previo = { h: false, a: false }) {
  clearTimeout(tRefresco); tRefresco = null;
  const faltan = new Date(p.fecha) - Date.now();
  // antes del partido, si falta alguna alineación, se vuelve a consultar ESPN cada 2 minutos
  if (p.estado !== "pre" || confirmadas || faltan > 6 * 36e5) return;
  tRefresco = setTimeout(async () => {
    if (activo !== p.id || vista.tab !== "previa" || !$("alineacion")) return;
    delete resumenes[p.id];
    const r = await resumen(p.id).catch(() => null);
    const ok = id => (r?.convocados?.[id] || []).filter(j => j.titular).length >= 11;
    const j = await juego365(p);  // el detalle de 365Scores se renueva solo cada 2 minutos
    if (activo !== p.id || vista.tab !== "previa") return;
    const h = ok(p.homeId) || !!lado365(j, true)?.confirmada, a = ok(p.awayId) || !!lado365(j, false)?.confirmada;
    if ((h && !previo.h) || (a && !previo.a)) pintarDetalle();  // salió una alineación: se repinta todo (tabla incluida)
    else programarRefresco(p, false, previo);
  }, 120e3);
}

// Suma los lesionados y suspendidos que publica 365Scores a los avisos deducidos de ESPN
function sumarAusentes365(av, nomMap, l365, teamId, forma, actual) {
  if (!l365?.ausentes.length) return;
  const conv = actual?.convocados?.[teamId] || [];
  const candidatos = [...conv, ...[...forma.jugadores.values()].filter(j => !conv.some(c => c.id === j.id))];
  for (const a of l365.ausentes) {
    const e = emparejar(a.nombre, a.corto, a.dorsal, candidatos);
    const id = e?.id ?? `s365-${a.nombre}`;
    if (!nomMap.has(id)) nomMap.set(id, a.nombre);
    const v = a.vuelta.replace(/^about\s+/i, "unas ").replace(/\bweeks?\b/i, "semanas").replace(/\bdays?\b/i, "días").replace(/\bmonths?\b/i, "meses");
    const texto = `${a.motivo}${v ? `. ${/\d|principios|mediados|fines|semanas|días|meses/.test(v) && !/^unas/.test(v) ? "Vuelve: " : ""}${/^unas/.test(v) ? "Vuelve en " : ""}${v}` : ""} (365Scores)`;
    av.set(id, [{ tipo: "baja", texto }, ...(av.get(id) || []).filter(x => x.tipo !== "baja")]);
  }
}

function pintarAvisos(p, avh, ava, con365 = false) {
  const cont = $("avisos");
  if (!cont) return;
  const bloque = (eq, av, nom) => {
    const items = [...av].filter(([, l]) => l.some(a => a.tipo !== "hoy"))
      .sort((a, b) => ORDEN_AVISO[a[1][0].tipo] - ORDEN_AVISO[b[1][0].tipo]);
    return `<div class="avisos-eq"><h5>${esc(eq)}</h5>${items.length ? `<ul>${items.map(([id, l]) => `<li>
        <span class="quien">${esc(nom.get(id) || "")}</span>${l.filter(a => a.tipo !== "hoy").map(etiquetaAviso).join("")}
        <span class="por">${esc(l.filter(a => a.tipo !== "hoy").map(a => a.texto).join(". "))}</span></li>`).join("")}</ul>`
      : `<p class="sup">Sin avisos: el plantel viene completo.</p>`}</div>`;
  };
  const [eqs, avs, nms] = [[p.local, p.visitante], [avh.av, ava.av], [avh.nom, ava.nom]];
  const orden = esAngosto() ? (vista.lado === "home" ? [0] : [1]) : [0, 1];
  cont.innerHTML = `<h4>Avisos del plantel</h4><div class="avisos-grid">${orden.map(i => bloque(eqs[i], avs[i], nms[i])).join("")}</div>
    <p class="nota">${con365 ? "Las lesiones y suspensiones marcadas con (365Scores) vienen de 365Scores. El resto de los avisos sale" : "ESPN no publica lesionados de fútbol: estos avisos salen"} de las listas de convocados, los minutos y las tarjetas de los partidos anteriores. Confirmalo con las noticias antes de apostar.</p>`;
  avisosActuales = { partido: p.id, home: avh, away: ava };
}

// Cada nombre usa el ancho libre hasta el vecino más cercano de su misma línea (nada de nombres pisados).
function fichasEquipo(ubicados, posicion, color, lado, medio) {
  const ps = ubicados.map(j => ({ j, xy: posicion(j) }));
  const [tope, piso] = medio ? [34, 15] : [13, 6];
  return ps.map(({ j, xy: [x, y] }) => {
    const gaps = ps.filter(o => o.j !== j && Math.abs(o.xy[1] - y) < 6).map(o => Math.abs(o.xy[0] - x));
    const ancho = Math.max(piso, Math.min(tope, gaps.length ? Math.min(...gaps) * 0.94 : tope));
    return fichaJugador(j, x, y, color, lado, ancho);
  }).join("");
}

async function pintarAlineacion(p) {
  const n = Math.max(vista.n, 10);
  try {
    const [fh, fa, actual, j365] = await Promise.all([formaEquipo(p.homeId, p.fecha, n), formaEquipo(p.awayId, p.fecha, n),
      resumen(p.id).catch(() => null), juego365(p)]);
    const lh = lado365(j365, true), la = lado365(j365, false);
    const avh = avisosEquipo(p.homeId, fh, actual, p.fecha, p.liga_nombre), ava = avisosEquipo(p.awayId, fa, actual, p.fecha, p.liga_nombre);
    const nom = (teamId, forma) => {
      const m = new Map();
      for (const j of forma.jugadores.values()) m.set(j.id, j.nombre);
      for (const c of actual?.convocados?.[teamId] || []) if (!m.has(c.id)) m.set(c.id, c.nombre);
      return m;
    };
    const nh = nom(p.homeId, fh), na = nom(p.awayId, fa);
    sumarAusentes365(avh, nh, lh, p.homeId, fh, actual); sumarAusentes365(ava, na, la, p.awayId, fa, actual);
    const [xh, xa] = await Promise.all([datosXI(p, p.homeId, fh, actual, avh, lh), datosXI(p, p.awayId, fa, actual, ava, la)]);
    const cont = $("alineacion");
    if (!cont || activo !== p.id) return;
    pintarAvisos(p, { av: avh, nom: nh }, { av: ava, nom: na }, !!j365);
    programarRefresco(p, !!(xh?.confirmada && xa?.confirmada), { h: !!xh?.confirmada, a: !!xa?.confirmada });
    const [ch, ca] = coloresEquipos(actual?.colores?.[p.homeId], actual?.colores?.[p.awayId]);
    const stat = NOMBRE_STAT[vista.stat].toLowerCase();
    const nota = (nombre, x) => x ? `<span class="xi-nota"><span class="estado-xi ${x.confirmada ? "conf" : "prob"}">${x.confirmada ? "Confirmada" : "Probable"}</span>
        <b>${esc(nombre)}</b>${x.formacion ? ` ${esc(x.formacion)}` : ""} · ${esc(x.fuente)}
        ${x.dudas.length ? `<span class="dudas">En duda: ${esc(x.dudas.join(", "))}</span>` : ""}</span>`
                                  : `<span><b>${esc(nombre)}</b>: sin alineación disponible</span>`;
    let svg;
    if (esAngosto()) {  // celular: media cancha del equipo elegido
      const x = vista.lado === "home" ? xh : xa, color = vista.lado === "home" ? ch : ca;
      const W = 648, H = 820;
      const fichas = x ? fichasEquipo(x.ubicados, j => [(50 + j.t * (W - 100)) / W * 100, (H - 92 - j.d * (H - 200)) / H * 100], color, vista.lado, true) : "";
      svg = `<div class="campo-wrap medio" role="group" aria-label="Alineación"><svg viewBox="0 0 ${W} ${H}" class="campo medio" aria-hidden="true"><g class="tiza">${lineasCancha(W, H, true)}</g></svg><div class="fichas">${fichas}</div></div>`;
      cont.innerHTML = `<h4>Alineación</h4>${svg}<div class="xi-notas">${nota(vista.lado === "home" ? p.local : p.visitante, x)}</div>`;
    } else {
      const W = 1000, H = 648;
      const fh2 = xh ? fichasEquipo(xh.ubicados, j => [(34 + j.d * 430) / W * 100, (52 + j.t * (H - 104)) / H * 100], ch, "home") : "";
      const fa2 = xa ? fichasEquipo(xa.ubicados, j => [(W - 34 - j.d * 430) / W * 100, (H - 52 - j.t * (H - 104)) / H * 100], ca, "away") : "";
      svg = `<div class="campo-wrap" role="group" aria-label="Alineaciones"><svg viewBox="0 0 ${W} ${H}" class="campo" aria-hidden="true"><g class="tiza">${lineasCancha(W, H, false)}</g></svg><div class="fichas">${fh2}${fa2}</div></div>`;
      cont.innerHTML = `<h4>Alineaciones</h4>${svg}<div class="xi-notas">${nota(p.local, xh)}${nota(p.visitante, xa)}</div>`;
    }
    cont.querySelector(".xi-notas").insertAdjacentHTML("beforeend", `<span>El % es cuántas veces superó ${r1(vista.linea)} ${stat} en sus últimos ${vista.n} partidos con su equipo. Tocá un jugador para ver su gráfico.</span>`);
  } catch {
    const cont = $("alineacion");
    if (cont) cont.innerHTML = `<h4>Alineaciones</h4><div class="vacio">No se pudo traer la alineación de ESPN ni de 365Scores.</div>`;
  }
}

function elegirDesdeCancha(g) {
  const id = g.dataset.xi, lado = g.dataset.xiLado;
  if (!id) return;
  if (lado !== vista.lado) { vista.lado = lado; vista.jugador = id; pintarDetalle(); return; }
  const fila = document.querySelector(`.jug[data-j="${CSS.escape(id)}"], tr.fila[data-j="${CSS.escape(id)}"]`);
  if (fila) elegirFila(fila); else { vista.jugador = id; pintarDetalle(); }
  document.querySelectorAll("#alineacion .ficha").forEach(f => f.classList.toggle("elegida", f.dataset.xi === id));
  const p = partidos.find(x => x.id === activo); if (p) pintarAlineacion(p);
}

let plantelActual = null;
const PANEL_FILA = `<tr class="panel-fila panel-movil"><td colspan="7"><section class="jugador" id="panelJugador"></section></td></tr>`;
const PANEL_MOVIL = `<section class="jugador panel-movil" id="panelJugador"></section>`;
const esAngosto = () => window.matchMedia("(max-width: 860px)").matches;

// Ejecuta un cambio en la página sin que se mueva lo que el usuario está mirando:
// mide dónde está `ancla` antes y después, y compensa el scroll.
function sinSalto(ancla, cambio) {
  const antes = ancla?.isConnected ? ancla.getBoundingClientRect().top : null;
  cambio();
  if (antes == null || !ancla.isConnected) return;
  const delta = ancla.getBoundingClientRect().top - antes;
  if (Math.abs(delta) < 1) return;
  const main = $("detalle");
  if (!esAngosto() && main.scrollHeight > main.clientHeight) main.scrollTop += delta;
  else window.scrollBy(0, delta);
}

// sirve igual para una fila de la tabla y para una tarjeta de la lista gráfica
function elegirFila(el) {
  const id = el.dataset.j;
  if (id === vista.jugador || !plantelActual) return;
  vista.jugador = id;
  sinSalto(el, () => {
    document.querySelectorAll("[data-j].sel").forEach(r => r.classList.remove("sel"));
    document.querySelectorAll(`[data-j="${CSS.escape(id)}"]`).forEach(r => r.classList.add("sel"));
    if (esAngosto()) {
      document.querySelector(".panel-movil")?.remove();
      el.insertAdjacentHTML("afterend", el.tagName === "TR" ? PANEL_FILA : PANEL_MOVIL);
    }
    pintarJugador(plantelActual.get(id));
  });
}

async function pintarJugador(j) {
  const cont = $("panelJugador");
  if (!cont) return;
  if (!j) { cont.innerHTML = `<div class="vacio">Tocá un jugador de la tabla para ver su gráfico.</div>`; return; }
  const dibujar = (ps, cargandoOtros) => {
    const sel = filtrarPartidos(ps), r = resumenStat(sel);
    if (!sel.length) { cont.innerHTML = `<div><h3>${esc(j.nombre)}</h3></div><div class="vacio">No jugó partidos con estos filtros.</div>`; return; }
    pickVisible = pickDesdeVista(j, r);
    const guardado = pickVisible && misPicks.some(x => x.id === pickVisible.id);
    const angosto = window.matchMedia("(max-width: 760px)").matches;
    const { svg, orden } = graficoBarras(sel, angosto ? cont.clientWidth - 24 : cont.clientWidth - 284);
    const otros = sel.some(p => p.otroEquipo);
    const nota = cargandoOtros ? "Buscando también sus partidos con otros equipos…"
      : otros ? "Incluye sus partidos con otros equipos (club o selección)." : "";
    cont.innerHTML = `<div>
        <h3>${esc(j.nombre)}</h3>
        <div class="pos">${esc(j.pos && j.pos !== "SUB" ? j.pos : "")}</div>
        <div class="cifra"><div class="v">${Math.round(r.pct * 100)}%</div>
          <div class="k">superó ${r1(vista.linea)} ${NOMBRE_STAT[vista.stat].toLowerCase()} en ${r.sup} de ${r.n} partidos</div></div>
        <div class="cifras-chicas">
          <div><div class="v">${r1(r.prom)}</div><div class="k">promedio</div></div>
          <div><div class="v">${Math.max(...sel.map(p => p.stats[vista.stat] ?? 0))}</div><div class="k">máximo</div></div>
        </div>
        ${pickVisible ? `<button class="guardar-pick${guardado ? " on" : ""}" data-guardar-pick>${
          guardado ? "✓ En mi talón" : "☆ Guardar en mi talón"}</button>` : ""}
      </div>
      <div>
        <p class="nota">${NOMBRE_STAT[vista.stat]} en sus últimos ${sel.length} partidos${vista.soloTitular ? " como titular" : ""}. ${nota}</p>
        <div class="leyenda"><span><i style="background:var(--hit)"></i>Superó la línea</span><span><i style="background:var(--miss)"></i>No la superó</span><span><i class="dash"></i>Línea ${r1(vista.linea)}</span></div>
        <div class="chart" id="chart">${svg}</div>
        <details><summary>Ver los partidos en una tabla</summary><div class="tablewrap" style="margin-top:8px"><table>
          <thead><tr><th class="izq">Fecha</th><th class="izq">Rival</th><th class="izq">Competición</th><th>Resultado</th><th>Min</th><th>${NOMBRE_STAT[vista.stat]}</th></tr></thead><tbody>
          ${sel.map(p => `<tr><td class="izq">${fmtLarga.format(new Date(p.fecha))}</td><td class="izq">${p.condicion === "V" ? "en cancha de " : ""}${esc(p.rival)}</td>
            <td class="izq sup">${esc(p.comp)}</td><td>${esc(p.resultado)}</td><td>${p.minutos ?? "–"}${p.titular ? "" : " <span class='sup'>entró</span>"}</td>
            <td><b>${p.stats[vista.stat] ?? "–"}</b></td></tr>`).join("")}</tbody></table></div></details>
      </div>`;
    activarTooltip($("chart"), orden);
  };
  dibujar(j.partidos, true);
  const extra = await partidosAtleta(j.id);
  if (vista.jugador !== j.id || $("panelJugador") !== cont) return;
  const porId = new Map(j.partidos.map(p => [p.eventId, p]));
  for (const p of extra) if (!porId.has(p.eventId)) porId.set(p.eventId, p);
  sinSalto(document.querySelector("tr.fila.sel"), () => dibujar([...porId.values()], false));
}

function activarTooltip(chart, orden) {
  const tip = $("tip");
  chart.querySelectorAll("rect.hit").forEach(rc => {
    const mostrar = e => {
      const p = orden[+rc.dataset.i], v = p.stats[vista.stat];
      tip.innerHTML = `<div class="sup">${esc(fmtLarga.format(new Date(p.fecha)))}, ${esc(p.comp)}</div>
        <div>${p.condicion === "V" ? "En cancha de " : "Contra "}${esc(p.rival)} <span class="sup">${esc(p.resultado)}</span></div>
        <div style="margin-top:4px"><b>${v ?? "–"}</b> ${NOMBRE_STAT[vista.stat].toLowerCase()} en ${p.minutos != null ? p.minutos + " minutos" : (p.titular ? "su partido como titular" : "su partido desde el banco")}</div>`;
      tip.style.display = "block";
      const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
      const yTop = e.clientY - tip.offsetHeight - 14;
      tip.style.left = Math.max(8, x) + window.scrollX + "px";
      tip.style.top = (yTop < 8 ? e.clientY + 18 : yTop) + window.scrollY + "px";
      rc.setAttribute("fill", "color-mix(in srgb, var(--text) 6%, transparent)");
    };
    rc.addEventListener("mouseenter", mostrar);
    rc.addEventListener("mousemove", mostrar);
    rc.addEventListener("mouseleave", () => { tip.style.display = "none"; rc.setAttribute("fill", "transparent"); });
  });
}

// ---------- música de fondo ----------
// Los navegadores no permiten sonar sin una acción del usuario: arranca con el botón,
// o con el primer toque en la página si la última vez quedó prendida.
const CLAVE_MUSICA = "laoficina.musica";
const musica = $("musica");
musica.volume = 0.35;
function marcarMusica(sonando) {
  $("musicaBtn").setAttribute("aria-pressed", String(sonando));
  $("musicaBtn").textContent = sonando ? "Pausar música" : "Poner música";
}
async function ponerMusica(prender) {
  try { localStorage.setItem(CLAVE_MUSICA, prender ? "1" : "0"); } catch {}
  if (!prender) { musica.pause(); marcarMusica(false); return; }
  $("musicaBtn").textContent = "Cargando música…";
  try { await musica.play(); marcarMusica(true); }
  catch { marcarMusica(false); $("musicaBtn").textContent = "No se pudo reproducir"; }
}
$("musicaBtn").addEventListener("click", e => { e.stopPropagation(); ponerMusica(musica.paused); });
// Prendida por defecto: intenta sonar al abrir; si el navegador lo bloquea, arranca con el primer toque.
// Solo queda apagada si el usuario la pausó (preferencia "0").
let prefMusica = "1";
try { prefMusica = localStorage.getItem(CLAVE_MUSICA) ?? "1"; } catch {}
if (prefMusica === "1") {
  musica.preload = "auto";
  const eventos = ["pointerdown", "keydown", "touchstart"];
  const arrancar = e => {
    eventos.forEach(ev => document.removeEventListener(ev, arrancar, true));
    if (e?.target?.closest?.("#musicaBtn")) return;  // el botón ya maneja su propio clic
    if (musica.paused) ponerMusica(true);
  };
  musica.play().then(() => marcarMusica(true))
    .catch(() => eventos.forEach(ev => document.addEventListener(ev, arrancar, { capture: true, passive: true })));
}

// ---------- eventos ----------
$("lista").addEventListener("click", e => {
  const b = e.target.closest(".partido"); if (b) abrirPartido(b.dataset.id);
});
$("destacados").addEventListener("click", e => {
  const b = e.target.closest(".rapido"); if (b) abrirPartido(b.dataset.id);
});
$("detalle").addEventListener("click", e => {
  if (e.target.closest("[data-volver]")) { volverALista(); return; }
  if (e.target.closest("[data-guardar-pick]")) { alternarPickVisible(); return; }
  const quitar = e.target.closest("[data-quitar]");
  if (quitar) {
    misPicks = misPicks.filter(x => x.id !== quitar.dataset.quitar);
    guardarEnDisco(); actualizarCuentaTalon(); pintarTalon(); return;
  }
  const copiar = e.target.closest("[data-copiar-talon]");
  if (copiar) { copiarTalon(copiar); return; }
  if (e.target.closest("[data-vaciar-talon]")) {
    if (confirm("¿Vaciar el talón? Se borran todos los picks guardados.")) {
      misPicks = []; guardarEnDisco(); actualizarCuentaTalon(); pintarTalon();
    }
    return;
  }
  const pk = e.target.closest(".pick");
  if (pk) { irAPick(pk); return; }
  const ficha = e.target.closest(".ficha");
  if (ficha) { elegirDesdeCancha(ficha); return; }
  if (e.target.closest("[data-claves-plegar]")) {
    clavesPlegada = !clavesPlegada;
    try { localStorage.setItem(CLAVE_PLEGADA, clavesPlegada ? "1" : "0"); } catch {}
    const c = $("detalle").querySelector(".claves");
    c?.classList.toggle("plegada", clavesPlegada);
    c?.querySelector("[data-claves-plegar]")?.setAttribute("aria-expanded", String(!clavesPlegada));
    return;
  }
  const ir = e.target.closest("[data-clave-ir]");
  if (ir) { const t = $("detalle").querySelector(".claves-tira"); t?.scrollTo({ left: t.clientWidth * +ir.dataset.claveIr, behavior: "smooth" }); return; }
  const rem = e.target.closest("[data-rem-lado], [data-rem-sel], [data-rem-volver], [data-rem-metrica]");
  if (rem) {
    const d = rem.dataset;
    if (d.remLado) { vista.remLado = d.remLado; vista.remSel = null; }
    else if (d.remSel) vista.remSel = d.remSel === "suma" ? "suma" : +d.remSel;
    else if (d.remMetrica) vista.remMetrica = d.remMetrica;
    else vista.remSel = null;
    const p = partidos.find(x => x.id === activo);
    if (p) pintarRemates(p).catch(() => { $("cuerpo").innerHTML = `<div class="vacio">ESPN no respondió. Revisá tu conexión y volvé a elegir el partido.</div>`; });
    return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab) { vista.tab = tab.dataset.tab; pintarDetalle(); return; }
  const lado = e.target.closest("[data-lado]");
  if (lado) { vista.lado = lado.dataset.lado; vista.jugador = null; vista.rivalEq = ""; pintarDetalle(); return; }
  const th = e.target.closest("th[data-col]");
  if (th) {
    const t = th.closest("table").dataset.tabla, c = th.dataset.col;
    if (c === "spark") return;
    const o = t === "plantel" ? "ordenPlantel" : "ordenPartido";
    vista[o] = { col: c, asc: vista[o].col === c ? !vista[o].asc : ["jugador", "pos", "posicion"].includes(c) };
    pintarDetalle(); return;
  }
  const fila = e.target.closest("tr.fila, .jug");
  if (fila) elegirFila(fila);
});
$("detalle").addEventListener("keydown", e => {
  const ficha = e.target.closest?.(".ficha");
  if (ficha && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); elegirDesdeCancha(ficha); return; }
  const fila = e.target.closest?.("tr.fila, .jug");
  if (fila && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); elegirFila(fila); }
});
$("detalle").addEventListener("change", e => {
  const id = e.target.id;
  if (id === "fStat") vista.stat = e.target.value;
  else if (id === "fLinea") vista.linea = +e.target.value;
  else if (id === "fN") vista.n = +e.target.value;
  else if (id === "fTit") vista.soloTitular = e.target.checked;
  else if (id === "fFavorContra") vista.favorContra = e.target.value;
  else if (id === "fRival") vista.rivalEq = e.target.value;
  else if (id === "fSede") vista.sedeEq = e.target.value;
  else if (id === "iStat") { vista.stat = e.target.value; pintarInicio(); return; }
  else if (id === "iLinea") { vista.linea = +e.target.value; pintarInicio(); return; }
  else return;
  pintarDetalle();
});
let anchoPrevio = window.innerWidth, tRedim;
window.addEventListener("resize", () => {
  clearTimeout(tRedim);
  tRedim = setTimeout(() => {
    if (Math.abs(window.innerWidth - anchoPrevio) > 40 && $("panelJugador")) { anchoPrevio = window.innerWidth; pintarDetalle(); }
  }, 250);
});
$("buscar").addEventListener("input", () => { pintarLista(); if (esAngosto() && document.body.classList.contains("ver-detalle")) volverALista(); });
$("filtroLiga").addEventListener("change", pintarLista);
$("picksMovil").addEventListener("click", e => { const pk = e.target.closest(".pick"); if (pk) irAPick(pk); });
$("picksMovil").addEventListener("change", e => {
  if (e.target.id === "iStat") vista.stat = e.target.value; else if (e.target.id === "iLinea") vista.linea = +e.target.value; else return;
  pintarInicio();
});
// los totales se recalculan sin repintar la lista, para no perder el foco mientras se escribe
$("detalle").addEventListener("input", e => {
  const id = e.target.dataset?.cuota;
  if (id) {
    const k = misPicks.find(x => x.id === id);
    if (!k) return;
    k.cuota = e.target.value;
  } else if (e.target.id === "montoTalon") {
    montoTalon = +e.target.value || 0;
  } else return;
  guardarEnDisco();
  const tot = $("talonTotales");
  if (tot) tot.innerHTML = totalesTalonHTML();
});
$("irTalon").addEventListener("click", irATalon);
actualizarCuentaTalon();
$("irInicio").addEventListener("click", () => {
  verTalon = false;
  activo = null; document.body.classList.remove("ver-detalle");
  pintarLista(); pintarDestacados(); pintarDetalle();
  if (esAngosto()) window.scrollTo({ top: 0 });
});
$("cargar").addEventListener("click", cargarPartidos);

// ---------- app instalable (PWA) ----------
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

// ---------- inicio ----------
(async () => {
  const hoy = new Date(), antes = new Date(), despues = new Date();
  antes.setDate(hoy.getDate() - 1); despues.setDate(hoy.getDate() + 1);
  $("desde").value = isoLocal(antes); $("hasta").value = isoLocal(despues);
  $("grupo").innerHTML = `<option value="principales">Ligas principales (${PRINCIPALES.length})</option>`;
  getJSON("/leagues/dropdown?sport=soccer&limit=1000").then(d => {
    const ls = (d.leagues || []).slice().sort((a, b) => a.name.localeCompare(b.name));
    $("grupo").insertAdjacentHTML("beforeend", ls.map(l => `<option value="${esc(l.slug)}">${esc(l.name)}</option>`).join(""));
  }).catch(() => {});
  await cargarPartidos();
})();
</script>
</body>
